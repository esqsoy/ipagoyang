<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>발음고양</title>
<!-- 생성물이다. 고칠 때는 pipeline/template.html과 data/·sources/를 고치고 python3 pipeline/build.py를 돌린다. -->
<style>
@font-face{font-family:"Balum IPA";src:url("assets/fonts/BalumIPA-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Balum IPA";src:url("assets/fonts/BalumIPA-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{
  --bg:#fbf8f3;--card:#ffffff;--ink:#22201c;--sub:#6b665d;--line:#e4ddd1;
  --tis:#efe6da;--cav:#f7f2ea;--tongue:#f2b8b0;--tooth:#ffffff;--hot:#e0541e;--hot-soft:#fde3d6;
  --ok:#2f8f4e;--ok-soft:#dff2e5;--ng:#c43d3d;--ng-soft:#f8e0e0;--key:#f4efe6;--accent:#3b5bdb;
  --ipa:"Balum IPA","Charis SIL","Doulos SIL","Gentium Plus","Noto Sans","Segoe UI",sans-serif;
  --ko:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#181715;--card:#222120;--ink:#ece8e1;--sub:#a59f95;--line:#3a3733;
  --tis:#3a332c;--cav:#2a2622;--tongue:#8e4f49;--tooth:#e9e4dc;--hot:#ff7a45;--hot-soft:#4a2a1d;
  --ok:#5cc47f;--ok-soft:#1f3a28;--ng:#ff7b7b;--ng-soft:#432424;--key:#2d2b28;--accent:#8ea4ff;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ko);word-break:keep-all;-webkit-text-size-adjust:100%}
body{min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px}
.ipa{font-family:var(--ipa);font-weight:400}
h1{font-size:26px;margin:6px 0 2px}
h2{font-size:19px;margin:16px 0 8px}
p{line-height:1.6;margin:6px 0}
.sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;padding:13px 16px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-size:17px;font-weight:700;margin-top:12px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.top{display:flex;align-items:flex-start;gap:10px;min-height:64px}
.bubble{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:15px;line-height:1.45;position:relative;min-height:46px}
.bubble:before{content:"";position:absolute;left:-8px;top:16px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.bubble:after{content:"";position:absolute;left:-6px;top:17px;border:7px solid transparent;border-right-color:var(--card);border-left:0}
.cat{width:54px;height:54px;flex:none}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.big{font-size:64px;line-height:1;text-align:center;margin:6px 0}
.name{text-align:center;font-weight:700;font-size:17px}
.svgbox svg{width:100%;height:auto;display:block}
.cap{font-size:12px;color:var(--sub);text-align:center;margin-top:2px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.ex{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.lang{font-size:12px;color:var(--sub);white-space:nowrap}
.word{font-size:17px;font-weight:600}
.word small{font-weight:400;color:var(--sub);font-size:13px;margin-left:6px}
.tr{font-family:var(--ipa);font-size:18px}
.tr b{color:var(--hot);font-weight:700}
.play{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--key);font-size:15px;display:flex;align-items:center;justify-content:center}
.play[disabled]{opacity:.35;cursor:default}
canvas.wave{width:100%;height:40px;display:block;grid-column:1/-1}
.feel{background:var(--hot-soft);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.55}
.dots{display:flex;gap:6px;justify-content:center;margin:8px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:10px;margin-top:12px}
.opt{padding:14px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:26px}
.opt.ipa{font-size:30px}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--ng-soft);border-color:var(--ng)}
.opt.need{outline:3px solid var(--hot);outline-offset:2px}
.qword{font-size:30px;text-align:center;font-weight:700;margin:8px 0 0}
.qmeta{text-align:center;color:var(--sub);font-size:14px}
.qtr{font-family:var(--ipa);font-size:34px;text-align:center;margin:10px 0}
.slot{display:inline-block;min-width:1.3em;border-bottom:3px solid var(--hot);color:var(--hot);text-align:center}
.kb{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kb table{width:100%;border-collapse:collapse}
.kb th{font-size:11px;color:var(--sub);font-weight:600;text-align:left;padding:6px 8px;background:var(--key);width:64px;border-top:1px solid var(--line)}
.kb td{padding:6px;border-top:1px solid var(--line)}
.kb .keys{display:flex;gap:6px;flex-wrap:wrap}
.key{min-width:54px;padding:6px 6px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-family:var(--ipa);font-size:26px;line-height:1;text-align:center}
.key .ks{display:block;line-height:1.5;padding-bottom:3px}
.key small{display:block;font-family:var(--ko);font-size:10px;color:var(--sub);line-height:1.2}
.key.right{background:var(--ok-soft);border-color:var(--ok)}
.key.wrong{background:var(--ng-soft);border-color:var(--ng)}
.key.need{outline:3px solid var(--hot);outline-offset:1px}
.kbhead{font-size:11px;color:var(--sub);padding:6px 8px;background:var(--key)}
.reveal{margin-top:12px;border-radius:12px;padding:12px;font-size:15px;line-height:1.55}
.reveal.ok{background:var(--ok-soft)}
.reveal.ng{background:var(--ng-soft)}
.reveal .tr{font-size:22px}
.tap{font-size:12px;color:var(--sub);text-align:center;margin-top:8px}
table.cr{width:100%;border-collapse:collapse;font-size:13px}
table.cr td,table.cr th{border-top:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
a{color:var(--accent)}
.vib{animation:vib .12s linear infinite alternate}
@keyframes vib{from{transform:translateX(-.6px)}to{transform:translateX(.6px)}}
.puff{animation:puff 1.4s ease-out infinite}
@keyframes puff{0%{opacity:0;transform:translateX(0)}30%{opacity:1}100%{opacity:0;transform:translateX(-8px)}}
@media (prefers-reduced-motion:reduce){.vib,.puff{animation:none}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const D = /*__DATA__*/null;
const KEY = 'ipagoyang-v1';
const app = document.getElementById('app');
const B = D.bundle, SYM = D.symbols.symbols;
const LANG = Object.fromEntries(D.langs.map(l => [l.id, l]));
const WORD = Object.fromEntries(B.words.map(w => [w.id, w]));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }

/* ---------- 소리 ---------- */
let cur = null, raf = 0;
function hasAudio(id) { return !!(id && D.audio[id] && D.audio[id].src); }
function play(id, canvas) {
  if (!hasAudio(id)) return;
  if (cur) { cur.pause(); cancelAnimationFrame(raf); }
  const a = new Audio(D.audio[id].src);
  cur = a;
  const draw = () => { if (canvas) wave(canvas, id, a.duration ? a.currentTime / a.duration : 0); if (!a.paused && !a.ended) raf = requestAnimationFrame(draw); else if (canvas) wave(canvas, id, a.ended ? 1 : 0); };
  a.addEventListener('playing', draw);
  a.play().catch(() => {});
  if (canvas) wave(canvas, id, 0);
}
function stopAudio() { if (cur) { cur.pause(); cur = null; } cancelAnimationFrame(raf); }
function wave(c, id, t) {
  const pk = (D.audio[id] || {}).peaks; if (!pk) return;
  const dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  if (!w) return;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const bw = w / pk.length;
  pk.forEach((v, i) => {
    const bh = Math.max(1, v * (h - 4));
    g.fillStyle = (i / pk.length) <= t ? css.getPropertyValue('--hot') : css.getPropertyValue('--sub');
    g.globalAlpha = (i / pk.length) <= t ? 1 : .45;
    g.fillRect(i * bw, (h - bh) / 2, Math.max(1, bw - 1), bh);
  });
}

/* ---------- 그림: 입 옆모습(모식도) ---------- */
const PLACES = [
  {n:1, ko:'양순', x:29, y:97}, {n:2, ko:'순치', x:45, y:98}, {n:3, ko:'치', x:47, y:89}, {n:4, ko:'치경', x:55, y:80},
  {n:5, ko:'후치경', x:64, y:76}, {n:6, ko:'권설', x:76, y:72}, {n:7, ko:'경구개', x:96, y:67}, {n:8, ko:'연구개', x:126, y:72},
  {n:9, ko:'구개수', x:149, y:99}, {n:10, ko:'인두', x:171, y:140}, {n:11, ko:'성문', x:161, y:206}];
const PLACE_OF = {bilabial: 1};
function sagittal(o = {}) {
  const low = o.lips === 'near' ? 4 : o.lips === 'open' ? 12 : -1;
  const hot = o.highlight ? PLACE_OF[o.highlight] : 0;
  const lipStroke = hot === 1 ? 'stroke="var(--hot)" stroke-width="2.2"' : 'stroke="var(--sub)" stroke-width=".8"';
  let s = `
  <path d="M122,2 C94,4 74,14 67,28 C63,37 55,46 45,54 C38,59 31,61 32,66 C33,70 39,71 42,71" fill="none" stroke="var(--sub)" stroke-width="1" opacity=".7"/>
  <path d="M29,${120 + low} C24,129 27,140 36,146 C54,158 82,167 106,177 C124,185 138,194 145,206 L147,236" fill="none" stroke="var(--sub)" stroke-width="1" opacity=".7"/>
  <path d="M58,56 C70,36 112,28 158,34 L164,58 C150,56 120,56 58,56 Z" fill="var(--cav)" stroke="var(--line)"/>
  <path d="M172,40 L184,40 L184,236 L172,236 Z" fill="var(--tis)"/>
  <path d="M44,118 C34,121 26,124 28,134 C32,152 52,166 82,174 C104,180 122,184 136,186 L140,176 L60,124 L50,113 Z" fill="var(--tis)"/>
  <path d="M50,113 C52,104 58,99 68,95 C88,86 116,82 134,92 C146,100 150,116 150,136 C150,154 148,166 142,176 L136,186 C118,170 88,150 60,124 Z" fill="var(--tongue)"/>
  <path d="M58,56 L164,58 C166,66 160,76 156,84 C152,92 154,99 150,101 C146,98 146,90 142,84 C134,74 122,70 108,68 C88,66 72,70 62,78 C58,81 54,83 50,82 L44,80 L40,72 C42,64 48,58 58,56 Z" fill="var(--tis)"/>
  <path d="M146,172 C150,162 156,160 160,166" fill="none" stroke="var(--sub)" stroke-width="1.4"/>
  <path d="M150,186 L150,236 M170,186 L170,236" stroke="var(--sub)" stroke-width="1" />
  <path d="M151,206 L159,206 M169,206 L163,206" stroke="var(--sub)" stroke-width="2.4"/>
  <path d="M44,80 L40,72 C30,72 20,78 19,86 C18,93 26,97 40,96 L44,95 Z" fill="var(--tongue)" ${lipStroke}/>
  <path d="M44,82 L50,82 L49,96 L45,97 Z" fill="var(--tooth)" stroke="var(--sub)" stroke-width=".7"/>
  <g transform="translate(0,${low})">
    <path d="M45,100 L49,100 L50,112 L45,113 Z" fill="var(--tooth)" stroke="var(--sub)" stroke-width=".7"/>
    <path d="M44,99 L40,98 C26,98 19,103 20,110 C21,118 32,121 44,118 Z" fill="var(--tongue)" ${lipStroke}/>
  </g>`;
  if (o.puff) s += `<g class="puff" stroke="var(--hot)" fill="none" stroke-width="1.6" stroke-linecap="round"><path d="M14,92 q-4,3 0,6"/><path d="M9,90 q-5,5 0,10"/><path d="M4,88 q-6,7 0,14"/></g>`;
  if (o.places) PLACES.forEach(p => {
    const on = p.n === hot;
    s += `<circle cx="${p.x}" cy="${p.y}" r="${on ? 5.5 : 4.2}" fill="${on ? 'var(--hot)' : 'var(--card)'}" stroke="${on ? 'var(--hot)' : 'var(--sub)'}" stroke-width="1"/>
          <text x="${p.x}" y="${p.y + 2.6}" font-size="6.5" text-anchor="middle" fill="${on ? '#fff' : 'var(--ink)'}" font-family="var(--ko)">${p.n}</text>`;
  });
  else if (hot) { const p = PLACES[hot - 1]; s += `<circle cx="${p.x}" cy="${p.y}" r="5" fill="none" stroke="var(--hot)" stroke-width="1.6"/>`; }
  return s;
}
/* 입 옆모습을 펼치면 IPA 자음표의 가로줄(조음 위치)이 된다 */
const CHART = [
  {n:1, plo:['p','b']}, {n:2}, {n:3, span:3, plo:['t','d']}, {n:4, skip:true}, {n:5, skip:true}, {n:6, plo:['ʈ','ɖ']},
  {n:7, plo:['c','ɟ']}, {n:8, plo:['k','ɡ']}, {n:9, plo:['q','ɢ']}, {n:10, imp:true}, {n:11, plo:['ʔ']}];
function mapSvg(lit = []) {
  const cw = 31, x0 = 4, top = 330, K = 1.3, OX = 28, OY = 2, colX = i => x0 + i * cw + cw / 2;
  let s = `<svg viewBox="0 0 349 422" role="img" aria-label="입 옆모습과 IPA 자음표의 조음 위치"><g transform="translate(${OX},${OY}) scale(${K})">${sagittal({places: true, highlight: lit.length ? 'bilabial' : null})}</g>`;
  PLACES.forEach((p, i) => {
    const px = OX + p.x * K, py = OY + p.y * K;
    s += `<path d="M${px},${py + 4} C${px},${(py + top) / 2 + 20} ${colX(i)},${top - 30} ${colX(i)},${top - 6}" fill="none" stroke="${lit.length && p.n === 1 ? 'var(--hot)' : 'var(--line)'}" stroke-width="${lit.length && p.n === 1 ? 1.6 : 1}"/>`;
    s += `<circle cx="${colX(i)}" cy="${top}" r="7" fill="var(--card)" stroke="var(--sub)"/><text x="${colX(i)}" y="${top + 3}" font-size="8" text-anchor="middle" fill="var(--ink)">${p.n}</text>`;
    s += `<text x="${colX(i)}" y="${top + 20}" font-size="8.2" text-anchor="middle" fill="var(--sub)">${p.ko}</text>`;
  });
  s += `<text x="4" y="${top + 38}" font-size="8.5" fill="var(--sub)">파열음 줄</text>`;
  CHART.forEach((c, i) => {
    if (c.skip) return;
    const x = x0 + i * cw + 1, w = cw * (c.span || 1) - 2, y = top + 44;
    const on = c.plo && c.plo.some(v => lit.includes(v));
    s += `<rect x="${x}" y="${y}" width="${w}" height="34" rx="5" fill="${c.imp ? 'var(--line)' : on ? 'var(--hot-soft)' : 'var(--card)'}" stroke="${on ? 'var(--hot)' : 'var(--line)'}"/>`;
    if (c.plo) s += `<text x="${x + w / 2}" y="${y + 21}" font-size="14" text-anchor="middle" font-family="var(--ipa)" fill="${on ? 'var(--ink)' : 'var(--sub)'}" opacity="${on ? 1 : .55}">${c.plo.join(' ')}</text>`;
    if (on && c.n === 1) s += `<text x="${x + w / 2}" y="${y + 31}" font-size="8" text-anchor="middle" font-family="var(--ipa)" fill="var(--hot)">pʰ p͈</text>`;
  });
  return s + '</svg>';
}
function glottisSvg(st) {
  const g = {open: [24, 46], wide: [12, 58], voiced: [33, 37], tight: [34, 36]}[st] || [24, 46];
  const w = st === 'tight' ? 3.2 : 2;
  const cls = st === 'voiced' ? ' class="vib"' : '';
  let s = `<svg viewBox="0 0 70 50" role="img" aria-label="목청 모양"><rect x="1" y="1" width="68" height="48" rx="8" fill="var(--cav)" stroke="var(--line)"/>
    <g${cls}><path d="M35,7 L${g[0]},40" stroke="var(--tongue)" stroke-width="${w + 3}" stroke-linecap="round"/><path d="M35,7 L${g[1]},40" stroke="var(--tongue)" stroke-width="${w + 3}" stroke-linecap="round"/></g>`;
  if (st === 'tight') s += `<path d="M14,26 l7,0 m-3,-3 l3,3 l-3,3 M56,26 l-7,0 m3,-3 l-3,3 l3,3" stroke="var(--hot)" stroke-width="1.4" fill="none"/>`;
  return s + '</svg>';
}
function votSvg(k) {
  const y = 30, rel = 120;
  let s = `<svg viewBox="0 0 300 66" role="img" aria-label="소리 시작 띠"><line x1="10" y1="${y}" x2="290" y2="${y}" stroke="var(--line)" stroke-width="2"/>
    <line x1="${rel}" y1="10" x2="${rel}" y2="48" stroke="var(--ink)" stroke-width="1.6"/><text x="${rel}" y="60" font-size="10" text-anchor="middle" fill="var(--ink)">터뜨림</text>`;
  const wavy = (a, b) => { let d = `M${a},${y}`; for (let x = a; x < b; x += 6) d += ` q1.5,-7 3,0 q1.5,7 3,0`; return `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.6"/>`; };
  const noise = (a, b) => { let d = ''; for (let x = a; x < b; x += 4) d += `M${x},${y - 6} L${x + 2},${y + 6} `; return `<path d="${d}" stroke="var(--hot)" stroke-width="1.2"/>`; };
  if (k === 'lead') { s += wavy(30, 290); s += `<text x="70" y="14" font-size="10" text-anchor="middle" fill="var(--accent)">울림이 먼저</text>`; }
  if (k === 'short') { s += wavy(rel + 8, 290); s += `<text x="205" y="14" font-size="10" text-anchor="middle" fill="var(--accent)">바로 울림</text>`; }
  if (k === 'long') { s += noise(rel + 2, 196) + wavy(198, 290); s += `<text x="158" y="14" font-size="10" text-anchor="middle" fill="var(--hot)">바람(흐)</text><text x="244" y="14" font-size="10" text-anchor="middle" fill="var(--accent)">울림</text>`; }
  return s + '</svg>';
}
function catSvg() {
  return `<svg class="cat" viewBox="0 0 60 60" aria-hidden="true"><path d="M12,24 L14,6 L26,17 Z M48,24 L46,6 L34,17 Z" fill="#f0a35e"/><circle cx="30" cy="34" r="20" fill="#f0a35e"/>
    <path d="M18,31 q4,-4 8,0 M34,31 q4,-4 8,0" stroke="#2b2b2b" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M27,40 l3,2 l3,-2" stroke="#2b2b2b" stroke-width="1.6" fill="none"/>
    <path d="M8,38 l10,1 M8,43 l10,-1 M52,38 l-10,1 M52,43 l-10,-1" stroke="#2b2b2b" stroke-width="1"/></svg>`;
}
function trHtml(w, blank) {
  const [a, t, b] = w.ipa;
  return `[${esc(a)}${blank ? `<span class="slot">${blank === true ? '&nbsp;' : esc(blank)}</span>` : `<b>${esc(t)}</b>`}${esc(b)}]`;
}

/* ---------- 화면 ---------- */
function home() {
  stopAudio();
  const st = load();
  const done = st.b01 && st.b01.done;
  app.innerHTML = `
    <div class="top">${catSvg()}<div class="bubble">발음기호는 입 지도라고양. 오늘은 맨 앞, 입술부터라고양.</div></div>
    <h1>발음고양</h1>
    <p class="sub">같은 기호로 여러 언어의 소리를 견주며 IPA를 익힌다. 시제품: 묶음 1.</p>
    <div class="card"><div class="svgbox">${mapSvg(done ? ['p', 'b'] : [])}</div>
      <p class="sub">입을 옆에서 본 그림의 1(입술)~11(목청)이 IPA 자음표의 가로 칸 순서다. 표의 왼쪽일수록 입 앞쪽, 오른쪽일수록 목 안쪽에서 나는 소리다. 칸을 다 익히면 표에 불이 들어온다.</p></div>
    <div class="card"><b>묶음 1 · ${esc(B.title)}</b> <span class="ipa">${esc(B.symbols_title)}</span>
      <p class="sub">한국어·영어·스페인어·일본어·프랑스어. 배우기 ${B.learn.length}장 → 한국어와 견주기 → 듣고 고르기 → 전사 빈칸.${done ? ` 최고 ${st.b01.best}/${st.b01.total}` : ''}</p>
      <button class="btn" id="go">시작</button></div>
    <button class="btn ghost" id="cr">출처·라이선스</button>`;
  document.getElementById('go').onclick = () => learn(0);
  document.getElementById('cr').onclick = credits;
}

function learn(i) {
  stopAudio();
  const k = B.learn[i], s = SYM[k];
  const ex = B.words.filter(w => w.target === k);
  const feel = (B.feel || []).filter(f => f.for.includes(k));
  app.innerHTML = `
    <div class="top">${catSvg()}<div class="bubble">${i === 0 ? esc(B.lines.start) : '눌러서 들어 보라고양. 눈으로도 보라고양.'}</div></div>
    <div class="dots">${B.learn.map((_, j) => `<i class="${j === i ? 'on' : ''}"></i>`).join('')}</div>
    <div class="card">
      <div class="big ipa">${esc(k === 'β' ? 'β β̞' : k)}</div>
      <div class="name">${esc(s.name)}</div>
      ${hasAudio(s.sound) ? `<div class="row" style="justify-content:center;gap:8px;margin-top:6px"><button class="play" id="symplay" aria-label="기호 소리 듣기">▶</button><span class="sub">기호 소리(시범 녹음, 낱말 아님)</span></div>` : ''}
      <div class="pair" style="margin-top:10px">
        <div><div class="svgbox"><svg viewBox="0 0 196 240">${sagittal({lips: s.lips, highlight: s.place, puff: s.glottis === 'wide'})}</svg></div><div class="cap">입 옆모습(모식도)</div></div>
        <div><div class="svgbox">${glottisSvg(s.glottis)}</div><div class="cap">목청(위에서 본 모식도)</div><p class="sub" style="font-size:13px">${esc(D.symbols.glottis[s.glottis] || '')}</p></div>
      </div>
      ${s.vot ? `<div class="svgbox" style="margin-top:6px">${votSvg(s.vot)}</div><div class="cap">소리 시작 띠(모식도): ${esc(D.symbols.vot[s.vot])}</div>` : ''}
      <p style="margin-top:10px">${esc(s.how)}</p>
      <p><b>한국어와:</b> ${esc(s.ko)}</p>
      ${s.other ? `<p class="sub">다른 표기: ${esc(s.other)}</p>` : ''}
    </div>
    <div class="card"><b>언어별로 들어 보기</b>
      ${ex.map(w => `<div class="ex" data-w="${w.id}">
          <span class="lang">${esc(LANG[w.lang].ko)}</span>
          <span><span class="word">${esc(w.text)}<small>${esc(w.ko)}</small></span><br><span class="tr">${trHtml(w)}</span></span>
          <button class="play" ${hasAudio(w.audio) ? '' : 'disabled title="녹음 없음"'} aria-label="${esc(w.text)} 듣기">▶</button>
          ${hasAudio(w.audio) ? '<canvas class="wave"></canvas>' : ''}
        </div>`).join('') || '<p class="sub">예 낱말 없음</p>'}
    </div>
    ${feel.map(f => `<div class="feel">${esc(f.text)}</div>`).join('')}
    <button class="btn" id="next">${i < B.learn.length - 1 ? '다음 기호' : '문제로'}</button>
    ${i > 0 ? '<button class="btn ghost" id="prev">앞으로</button>' : '<button class="btn ghost" id="prev">처음으로</button>'}`;
  app.querySelectorAll('.ex').forEach(el => {
    const w = WORD[el.dataset.w], c = el.querySelector('canvas'), b = el.querySelector('.play');
    if (c) requestAnimationFrame(() => wave(c, w.audio, 0));
    if (b) b.onclick = () => play(w.audio, c);
  });
  const sp = document.getElementById('symplay'); if (sp) sp.onclick = () => play(s.sound, null);
  document.getElementById('next').onclick = () => i < B.learn.length - 1 ? learn(i + 1) : startQuiz();
  document.getElementById('prev').onclick = () => i > 0 ? learn(i - 1) : home();
  window.scrollTo(0, 0);
}

let Q = [], qi = 0, res = [], lock = false, timer = 0;
function startQuiz() {
  const cmp = B.compare.map(c => ({type: 'compare', c, w: WORD[c.word]}));
  const lis = shuffle(B.words.filter(w => w.listen !== false && hasAudio(w.audio) && w.lang !== 'kor')).map(w => ({type: 'listen', w}));
  const bl = shuffle(B.words).map(w => ({type: 'blank', w}));
  Q = [...cmp, ...lis, ...bl]; qi = 0; res = [];
  question();
}
function header(msg) {
  return `<div class="top">${catSvg()}<div class="bubble" id="say">${esc(msg)}</div></div><div class="bar"><i style="width:${Math.round(qi / Q.length * 100)}%"></i></div>`;
}
function say(t) { const b = document.getElementById('say'); if (b) b.textContent = t; }
function keyboard() {
  const rows = ['파열음', '비음', '마찰음'];
  const short = Object.fromEntries(Object.entries(B.shortcuts).map(([k, v]) => [v, k]));
  return `<div class="kb"><div class="kbhead">양순(입술) 칸 · IPA 표 그대로</div><table>${B.keyboard.map((r, i) => `<tr><th>${rows[i]}</th><td><div class="keys">${r.map(k => `<button class="key" data-k="${esc(k)}" title="${esc(SYM[k].name)}"><span class="ks">${esc(k)}</span><small>${esc(short[k] || '')}</small></button>`).join('')}</div></td></tr>`).join('')}</table></div>`;
}
function question() {
  stopAudio(); clearTimeout(timer); lock = false; copyNeed = null; typed = '';
  if (qi >= Q.length) return result();
  const q = Q[qi], w = q.w, L = LANG[w.lang].ko;
  let body = '';
  if (q.type === 'compare') {
    body = `${header('한국어 귀로 들어 보라고양.')}
      <div class="card"><div class="qmeta">${esc(L)} · 한국어와 견주기</div><div class="qword">${esc(w.text)}</div><div class="qmeta">${esc(w.roman !== w.text ? w.roman : '\u00a0')}</div>
      <div class="row" style="justify-content:center;margin-top:8px"><button class="play" id="pl" ${hasAudio(w.audio) ? '' : 'disabled'}>▶</button></div>
      ${hasAudio(w.audio) ? '<canvas class="wave" id="wv"></canvas>' : ''}
      <p style="text-align:center;margin-top:10px">${esc(q.c.q)}</p>
      <div class="opts">${q.c.options.map(o => `<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`;
  } else if (q.type === 'listen') {
    body = `${header('첫소리 기호를 고르라고양. 철자는 안 보여 준다고양.')}
      <div class="card"><div class="qmeta">${esc(L)} · 듣고 고르기</div>
      <div class="row" style="justify-content:center;margin-top:10px"><button class="play" id="pl" style="width:64px;height:64px;font-size:22px">▶</button></div>
      <canvas class="wave" id="wv" style="margin-top:8px"></canvas>
      <div class="opts">${['p', 'b', 'pʰ', 'p͈'].map(o => `<button class="opt ipa" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div></div>`;
  } else {
    body = `${header('빈칸에 들어갈 기호를 치라고양.')}
      <div class="card"><div class="qmeta">${esc(L)} · 전사 빈칸</div><div class="qword">${esc(w.text)}</div><div class="qmeta">${esc(w.roman !== w.text ? w.roman + ' · ' : '')}${esc(w.ko)}</div>
      <div class="qtr" id="qtr">${trHtml(w, true)}</div>
      <div class="row" style="justify-content:center"><button class="play" id="pl" ${hasAudio(w.audio) ? '' : 'disabled title="녹음 없음"'}>▶</button></div>
      ${hasAudio(w.audio) ? '<canvas class="wave" id="wv"></canvas>' : ''}
      ${keyboard()}<div class="tap">컴퓨터 자판: 키 아래 글자를 치고 Enter</div></div>`;
  }
  app.innerHTML = body + '<div id="rv"></div>';
  const wv = document.getElementById('wv'), pl = document.getElementById('pl');
  if (pl) pl.onclick = () => play(w.audio, wv);
  if (wv) requestAnimationFrame(() => wave(wv, w.audio, 0));
  if (q.type !== 'blank' && hasAudio(w.audio)) setTimeout(() => play(w.audio, wv), 250);
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b.dataset.o, b));
  app.querySelectorAll('.key').forEach(b => b.onclick = () => answer(b.dataset.k, b));
  typed = '';
}
let typed = '';
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const q = Q[qi];
  if (copyNeed) {
    if (e.key === 'Enter' || e.key.length === 1) { e.preventDefault(); typedCopy(e); }
    return;
  }
  if (lock) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } return; }
  if (!q || !document.getElementById('rv')) return;
  if (q.type === 'blank') {
    if (e.key === 'Enter') { e.preventDefault(); const k = B.shortcuts[typed]; if (k) answer(k, app.querySelector(`.key[data-k="${CSS.escape(k)}"]`)); typed = ''; return; }
    if (e.key === 'Backspace') { typed = typed.slice(0, -1); }
    else if (e.key.length === 1) typed += e.key;
    const slot = app.querySelector('.slot'); if (slot) slot.textContent = typed ? (B.shortcuts[typed] || typed) : ' ';
  } else if (/^[1-9]$/.test(e.key)) {
    const b = app.querySelectorAll('.opt')[+e.key - 1]; if (b) b.click();
  }
});
function correctOf(q) { return q.type === 'compare' ? [q.c.answer] : q.type === 'listen' ? [q.w.target] : (q.w.accept || [q.w.target]); }
let copyNeed = null;
function answer(v, btn) {
  if (lock || copyNeed) return;
  const q = Q[qi], ok = correctOf(q).includes(v);
  typed = '';
  res.push({q, ok, v});
  const sel = q.type === 'blank' ? '.key' : '.opt';
  const right = correctOf(q)[0];
  if (btn) btn.classList.add(ok ? 'right' : 'wrong');
  const slot = app.querySelector('.slot'); if (slot) { slot.textContent = right; slot.style.color = ok ? 'var(--ok)' : 'var(--ng)'; }
  const w = q.w;
  const why = q.type === 'compare' ? q.c.why : (w.note || '');
  const line = (B.lines.by_word || {})[w.id] || pick(ok ? B.lines.correct : B.lines.wrong);
  say(line);
  document.getElementById('rv').innerHTML = `<div class="reveal ${ok ? 'ok' : 'ng'}">
      <b>${ok ? '맞음' : '틀림'}</b> · ${esc(LANG[w.lang].ko)} <b>${esc(w.text)}</b> <span class="tr">${trHtml(w)}</span>
      ${why ? `<div style="margin-top:4px">${esc(why)}</div>` : ''}
      ${q.type !== 'compare' ? `<div class="sub" style="margin-top:4px"><span class="ipa">[${esc(w.target === 'β' ? 'β̞' : w.target)}]</span> ${esc(SYM[w.target].name)}</div>` : ''}
      ${ok ? '' : `<div style="margin-top:6px"><b>따라 하기:</b> 정답 칸(<span class="ipa">${esc(right)}</span>)을 눌러야 넘어간다고양.</div>`}
    </div><div class="tap" id="tp">${ok ? '화면을 누르거나 Enter로 다음' : ''}</div>`;
  if (hasAudio(w.audio)) play(w.audio, document.getElementById('wv'));
  if (!ok) {
    copyNeed = right;
    const tgt = [...app.querySelectorAll(sel)].find(b => (b.dataset.k || b.dataset.o) === right);
    if (tgt) { tgt.classList.add('need'); }
    app.querySelectorAll(sel).forEach(b => b.onclick = () => { if ((b.dataset.k || b.dataset.o) === copyNeed) copied(b); });
    return;
  }
  settle(why + line);
}
function typedCopy(e) {
  const q = Q[qi];
  if (q.type !== 'blank') { if (/^[1-9]$/.test(e.key)) { const b = app.querySelectorAll('.opt')[+e.key - 1]; if (b && b.dataset.o === copyNeed) copied(b); } return; }
  if (e.key === 'Enter') { if (B.shortcuts[typed] === copyNeed) copied(app.querySelector(`.key[data-k="${CSS.escape(copyNeed)}"]`)); typed = ''; return; }
  typed += e.key;
}
function copied(b) {
  copyNeed = null; if (b) { b.classList.remove('need'); b.classList.add('right'); }
  document.getElementById('tp').textContent = '화면을 누르거나 Enter로 다음';
  settle('');
}
function settle(text) {
  lock = true;
  const ms = Math.min(15000, 2000 + 110 * [...String(text)].length);
  timer = setTimeout(next, ms);
  setTimeout(() => { document.addEventListener('click', tapNext, {once: true}); }, 300);
}
function tapNext(e) { if (e.target.closest('.play')) { document.addEventListener('click', tapNext, {once: true}); return; } next(); }
function next() { if (!lock) return; lock = false; clearTimeout(timer); document.removeEventListener('click', tapNext); qi++; question(); }

function result() {
  stopAudio();
  const ok = res.filter(r => r.ok).length, tot = res.length;
  const st = load(); const prev = st.b01 || {};
  st.b01 = {done: true, best: Math.max(prev.best || 0, ok), total: tot, at: new Date().toISOString().slice(0, 10)};
  save(st);
  const wrong = res.filter(r => !r.ok);
  app.innerHTML = `<div class="top">${catSvg()}<div class="bubble">${esc(B.lines.end)}</div></div>
    <h2>묶음 1 끝: ${ok}/${tot}</h2>
    <div class="card"><div class="svgbox">${mapSvg(['p', 'b'])}</div><p class="sub">입술(1) 칸의 파열음에 불이 들어왔다. [pʰ]·[p͈]는 표에 따로 칸이 없고, [p]에 부호를 붙여 적는다.</p></div>
    ${wrong.length ? `<div class="card"><b>틀린 것</b>${wrong.map(r => `<div class="ex"><span class="lang">${esc(LANG[r.q.w.lang].ko)}</span><span><span class="word">${esc(r.q.w.text)}</span> <span class="tr">${trHtml(r.q.w)}</span></span><span class="sub">${esc(r.v)}</span></div>`).join('')}</div>` : ''}
    <button class="btn" id="again">다시</button><button class="btn ghost" id="hm">처음으로</button>`;
  document.getElementById('again').onclick = startQuiz;
  document.getElementById('hm').onclick = home;
}

function credits() {
  stopAudio();
  const files = D.audioCredits;
  app.innerHTML = `<h2>출처·라이선스</h2>
    <div class="card"><b>녹음</b> (Wikimedia Commons, 파일마다 라이선스 확인)
    <table class="cr">${files.map(f => `<tr><td>${esc(f.id)}</td><td><a href="${esc(f.page)}" target="_blank" rel="noopener">${esc(f.commons_file)}</a><br>${esc(f.author)} · ${esc(f.license)}${f.mp3 ? '' : ' · <b>아직 못 받음</b>'}</td></tr>`).join('')}</table>
    <p class="sub">게임에는 형식만 mp3로 바꿔 넣었다(자르거나 다듬지 않음).</p></div>
    <div class="card"><b>자료</b><table class="cr">${D.refs.map(r => `<tr><td>${esc(r.cite)}${r.doi ? ` <a href="https://doi.org/${esc(r.doi)}" target="_blank" rel="noopener">doi</a>` : ''}</td></tr>`).join('')}</table>
    <p class="sub">PHOIBLE 대조 결과(sources/phoible-b01.json)는 CC BY-SA 3.0을 따른다.</p></div>
    <div class="card"><b>글꼴</b><p class="sub">Balum IPA: Charis SIL 7.000(SIL Global)에서 글자를 줄이고 이름을 바꾼 것. SIL Open Font License 1.1(assets/fonts/OFL.txt).</p></div>
    <div class="card"><b>그림</b><p class="sub">입 옆모습·목청·소리 시작 띠는 이 게임이 그린 모식도다. 실제 비율이 아니다.</p></div>
    <button class="btn ghost" id="hm">처음으로</button>`;
  document.getElementById('hm').onclick = home;
}
home();
</script>
</body>
</html>
