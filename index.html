<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>발음고양</title>
<!-- 생성물이다. 고칠 때는 pipeline/template.html과 data/·sources/를 고치고 python3 pipeline/build.py를 돌린다. -->
<style>
@font-face{font-family:"Balum IPA";src:url("assets/fonts/BalumIPA-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Balum IPA";src:url("assets/fonts/BalumIPA-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{
  --bg:#fbf8f3;--card:#ffffff;--ink:#22201c;--sub:#6b665d;--line:#e4ddd1;
  --tis:#efe6da;--cav:#f7f2ea;--tongue:#f2b8b0;--tooth:#ffffff;--hot:#e0541e;--hot-soft:#fde3d6;
  --ok:#2f8f4e;--ok-soft:#dff2e5;--ng:#c43d3d;--ng-soft:#f8e0e0;--key:#f4efe6;--accent:#3b5bdb;
  --ipa:"Balum IPA","Charis SIL","Doulos SIL","Gentium Plus","Noto Sans","Segoe UI",sans-serif;
  --ko:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#181715;--card:#222120;--ink:#ece8e1;--sub:#a59f95;--line:#3a3733;
  --tis:#3a332c;--cav:#2a2622;--tongue:#8e4f49;--tooth:#e9e4dc;--hot:#ff7a45;--hot-soft:#4a2a1d;
  --ok:#5cc47f;--ok-soft:#1f3a28;--ng:#ff7b7b;--ng-soft:#432424;--key:#2d2b28;--accent:#8ea4ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#181715;--card:#222120;--ink:#ece8e1;--sub:#a59f95;--line:#3a3733;
  --tis:#3a332c;--cav:#2a2622;--tongue:#8e4f49;--tooth:#e9e4dc;--hot:#ff7a45;--hot-soft:#4a2a1d;
  --ok:#5cc47f;--ok-soft:#1f3a28;--ng:#ff7b7b;--ng-soft:#432424;--key:#2d2b28;--accent:#8ea4ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ko);word-break:keep-all;-webkit-text-size-adjust:100%}
body{min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding-block:12px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ipa{font-family:var(--ipa);font-weight:400}
h1{font-size:26px;margin:6px 0 2px}
h2{font-size:19px;margin:16px 0 8px}
p{line-height:1.6;margin:6px 0}
.sub{color:var(--sub);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{display:block;width:100%;padding:13px 16px;border-radius:12px;border:0;background:var(--accent);color:#fff;font-size:17px;font-weight:700;margin-top:12px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line);font-weight:600}
.row{display:flex;gap:8px;align-items:center}
.top{display:flex;align-items:flex-start;gap:10px;min-height:64px}
.bubble{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;font-size:15px;line-height:1.45;position:relative;min-height:46px}
.bubble:before{content:"";position:absolute;left:-8px;top:16px;border:8px solid transparent;border-right-color:var(--line);border-left:0}
.bubble:after{content:"";position:absolute;left:-6px;top:17px;border:7px solid transparent;border-right-color:var(--card);border-left:0}
.cat{width:54px;height:54px;flex:none}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 10px}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.big{font-size:64px;line-height:1;text-align:center;margin:6px 0}
.name{text-align:center;font-weight:700;font-size:17px}
.svgbox svg{width:100%;height:auto;display:block}
.cap{font-size:12px;color:var(--sub);text-align:center;margin-top:2px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start}
.ex{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.ex:first-child{border-top:0}
.lang{font-size:12px;color:var(--sub);white-space:nowrap}
.word{font-size:17px;font-weight:600}
.word small{font-weight:400;color:var(--sub);font-size:13px;margin-left:6px}
.tr{font-family:var(--ipa);font-size:18px}
.tr b{color:var(--hot);font-weight:700}
.play{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--key);font-size:15px;display:flex;align-items:center;justify-content:center}
.play[disabled]{opacity:.35;cursor:default}
.soon{font-size:11px;color:var(--sub);white-space:nowrap}
.pcell{display:flex;flex-direction:column;align-items:center;gap:2px}
canvas.wave{width:100%;height:40px;display:block;grid-column:1/-1}
.feel{background:var(--hot-soft);border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.55}
.dots{display:flex;gap:6px;justify-content:center;margin:8px 0}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--accent)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:10px;margin-top:12px}
.opt{padding:14px 6px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:26px}
.opt.ipa{font-size:30px}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.wrong{background:var(--ng-soft);border-color:var(--ng)}
.opt.need{outline:3px solid var(--hot);outline-offset:2px}
.qword{font-size:30px;text-align:center;font-weight:700;margin:8px 0 0}
.qmeta{text-align:center;color:var(--sub);font-size:14px}
.qtr{font-family:var(--ipa);font-size:34px;text-align:center;margin:10px 0}
.slot{display:inline-block;min-width:1.3em;border-bottom:3px solid var(--hot);color:var(--hot);text-align:center}
.kb{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.kb table{width:100%;border-collapse:collapse}
.kb th{font-size:11px;color:var(--sub);font-weight:600;text-align:left;padding:6px 8px;background:var(--key);width:64px;border-top:1px solid var(--line)}
.kb td{padding:6px;border-top:1px solid var(--line)}
.kb .keys{display:flex;gap:6px;flex-wrap:wrap}
.key{min-width:54px;padding:6px 6px 4px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-family:var(--ipa);font-size:26px;line-height:1;text-align:center}
.key .ks{display:block;line-height:1.5;padding-bottom:3px}
.key small{display:block;font-family:var(--ko);font-size:10px;color:var(--sub);line-height:1.2}
.key.right{background:var(--ok-soft);border-color:var(--ok)}
.key.wrong{background:var(--ng-soft);border-color:var(--ng)}
.key.need{outline:3px solid var(--hot);outline-offset:1px}
.kbhead{font-size:11px;color:var(--sub);padding:6px 8px;background:var(--key)}
.reveal{margin-top:12px;border-radius:12px;padding:12px;font-size:15px;line-height:1.55}
.reveal.ok{background:var(--ok-soft)}
.reveal.ng{background:var(--ng-soft)}
.reveal .tr{font-size:22px}
.tap{font-size:12px;color:var(--sub);text-align:center;margin-top:8px}
table.cr{width:100%;border-collapse:collapse;font-size:13px}
table.cr td,table.cr th{border-top:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
a{color:var(--accent)}
.vib{animation:vib .12s linear infinite alternate}
@keyframes vib{from{transform:translateX(-.6px)}to{transform:translateX(.6px)}}
.puff{animation:puff 1.4s ease-out infinite}
@keyframes puff{0%{opacity:0;transform:translateX(0)}30%{opacity:1}100%{opacity:0;transform:translateX(-8px)}}
@media (prefers-reduced-motion:reduce){.vib,.puff{animation:none}}
</style>
</head>

const D = {"bundle":{"id":"b01","title":"입술 파열음","symbols_title":"[p] [b] [pʰ] [p͈]","about":"묶음 1 원본(PRINCIPLES 8-1·8-5: 첫 묶음). 낱말 전사는 출처 관례대로 직접 적었다(8-6). ipa는 [앞, 대상, 뒤]로 나눠 빈칸 자리를 정한다. phoible은 대상 소리를 대조할 PHOIBLE 목록과 분절음(seg: 음소, allo: 그 음소의 변이음). status는 PRINCIPLES 2-3.","place":"bilabial","learn":["p","pʰ","p͈","b","β"],"keyboard":[["p","pʰ","p͈","b"],["m"],["ɸ","β"]],"shortcuts":{"p":"p","ph":"pʰ","p*":"p͈","b":"b","m":"m","F":"ɸ","B":"β"},"words":[{"id":"ko-bul","lang":"kor","text":"불","roman":"bul","ko":"불","ipa":["","p","ul"],"target":"p","audio":"ko-bul-ys","phoible":{"inv":2197,"seg":"p͉"},"note":"낱말 첫 ㅂ. 좁게 적으면 [p͉]로 적는 문헌도 있다.","status":"확인","status_why":"PHOIBLE 2197(Lee 1993) /p͉/. 이 게임은 [p]로 적는다(PRINCIPLES 2-4)"},{"id":"ko-pul","lang":"kor","text":"풀","roman":"pul","ko":"풀","ipa":["","pʰ","ul"],"target":"pʰ","audio":"ko-pul-ys","phoible":{"inv":2197,"seg":"pʰ"},"status":"확인","status_why":"PHOIBLE 2197 /pʰ/"},{"id":"ko-ppul","lang":"kor","text":"뿔","roman":"ppul","ko":"뿔","ipa":["","p͈","ul"],"target":"p͈","audio":"ko-ppul-ys","phoible":{"inv":2197,"seg":"p"},"note":"PHOIBLE 2197은 ㅃ을 그냥 [p]로 적는다. 이 게임은 [p͈].","status":"확인","status_why":"PHOIBLE 2197 /p/(된소리 줄). 표기 관례 차이는 symbols p͈"},{"id":"ko-bubu","lang":"kor","text":"부부","roman":"bubu","ko":"부부","ipa":["pu","b","u"],"target":"b","audio":"ko-bubu-ys","phoible":{"inv":2197,"seg":"p͉","allo":"b"},"note":"같은 ㅂ인데 앞은 [p], 모음 사이 뒤는 [b]다.","status":"확인","status_why":"PHOIBLE 2197 /p͉/의 변이음 b"},{"id":"en-pin","lang":"eng","text":"pin","roman":"pin","ko":"핀","ipa":["","pʰ","ɪn"],"target":"pʰ","audio":"en-pin","phoible":{"inv":2176,"seg":"pʰ","allo":"pʰ"},"status":"확인","status_why":"PHOIBLE 2176(Hillenbrand 2003) /pʰ/"},{"id":"en-spin","lang":"eng","text":"spin","roman":"spin","ko":"돌다·돌리다","ipa":["s","p","ɪn"],"target":"p","audio":"en-spin","phoible":{"inv":2176,"seg":"pʰ","allo":"p"},"note":"s 뒤 p는 기식이 없다.","status":"확인 필요","status_why":"PHOIBLE은 /pʰ/의 변이음 p만 적고 조건(s 뒤)은 없다. 조건은 Hillenbrand 2003 본문 미열람"},{ /* ---------- 소리 ---------- */
let cur = null, raf = 0;
function hasAudio(id) { return !!(id && D.audio[id] && D.audio[id].src); }
function play(id, canvas) {
  if (!hasAudio(id)) return;
  if (cur) { cur.pause(); cancelAnimationFrame(raf); }
  const a = new Audio(D.audio[id].src);
  cur = a;
  const draw = () => { if (canvas) wave(canvas, id, a.duration ? a.currentTime / a.duration : 0); if (!a.paused && !a.ended) raf = requestAnimationFrame(draw); else if (canvas) wave(canvas, id, a.ended ? 1 : 0); };
  a.addEventListener('playing', draw);
  a.play().catch(() => {});
  if (canvas) wave(canvas, id, 0);
}
function stopAudio() { if (cur) { cur.pause(); cur = null; } cancelAnimationFrame(raf); }
function wave(c, id, t) {
  const pk = (D.audio[id] || {}).peaks; if (!pk) return;
  const dpr = window.devicePixelRatio || 1, w = c.clientWidth, h = c.clientHeight;
  if (!w) return;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement);
  const bw = w / pk.length;
  pk.forEach((v, i) => {
    const bh = Math.max(1, v * (h - 4));
    g.fillStyle = (i / pk.length) <= t ? css.getPropertyValue('--hot') : css.getPropertyValue('--sub');
    g.globalAlpha = (i / pk.length) <= t ? 1 : .45;
    g.fillRect(i * bw, (h - bh) / 2, Math.max(1, bw - 1), bh);
  });
}

  if (!ok) {
    copyNeed = right;
    const tgt = [...app.querySelectorAll(sel)].find(b => (b.dataset.k || b.dataset.o) === right);
    if (tgt) { tgt.classList.add('need'); }
    app.querySelectorAll(sel).forEach(b => b.onclick = () => { if ((b.dataset.k || b.dataset.o) === copyNeed) copied(b); });
    return;
  }
  settle(why + line);
}
function typedCopy(e) {
  const q = Q[qi];
  if (q.type !== 'blank') { if (/^[1-9]$/.test(e.key)) { const b = app.querySelectorAll('.opt')[+e.key - 1]; if (b && b.dataset.o === copyNeed) copied(b); } return; }
  if (e.key === 'Enter') { if (B.shortcuts[typed] === copyNeed) copied(app.querySelector(`.key[data-k="${CSS.escape(copyNeed)}"]`)); typed = ''; return; }
  typed += e.key;
}
function copied(b) {
  copyNeed = null; if (b) { b.classList.remove('need'); b.classList.add('right'); }
  document.getElementById('tp').textContent = '화면을 누르거나 Enter로 다음';
  settle('');
}
function settle(text) {
  lock = true;
  const ms = Math.min(15000, 2000 + 110 * [...String(text)].length);
  timer = setTimeout(next, ms);
  setTimeout(() => { document.addEventListener('click', tapNext, {once: true}); }, 300);
}
function tapNext(e) { if (e.target.closest('.play')) { document.addEventListener('click', tapNext, {once: true}); return; } next(); }
function next() { if (!lock) return; lock = false; clearTimeout(timer); document.removeEventListener('click', tapNext); qi++; question(); }

function result() {
  stopAudio();
  const ok = res.filter(r => r.ok).length, tot = res.length;
  const st = load(); const prev = st.b01 || {};
  st.b01 = {done: true, best: Math.max(prev.best || 0, ok), total: tot, at: new Date().toISOString().slice(0, 10)};
  save(st);
  const wrong = res.filter(r => !r.ok);
  app.innerHTML = `<div class="top">${catSvg()}<div class="bubble">${esc(B.lines.end)}</div></div>
    <h2>묶음 1 끝: ${ok}/${tot}</h2>
    <div class="card"><div class="svgbox">${mapSvg(['p', 'b'])}</div><p class="sub">입술(1) 칸의 파열음에 불이 들어왔다. [pʰ]·[p͈]는 표에 따로 칸이 없고, [p]에 부호를 붙여 적는다.</p></div>
    ${wrong.length ? `<div class="card"><b>틀린 것</b>${wrong.map(r => `<div class="ex"><span class="lang">${esc(LANG[r.q.w.lang].ko)}</span><span><span class="word">${esc(r.q.w.text)}</span> <span class="tr">${trHtml(r.q.w)}</span></span><span class="sub">${esc(r.v)}</span></div>`).join('')}</div>` : ''}
    <button class="btn" id="again">다시</button><button class="btn ghost" id="hm">처음으로</button>`;
  document.getElementById('again').onclick = startQuiz;
  document.getElementById('hm').onclick = home;
}

function credits() {
  stopAudio();
  const files = D.audioCredits;
  app.innerHTML = `<h2>출처·라이선스</h2>
    <div class="card"><b>녹음</b> (Wikimedia Commons, 파일마다 라이선스 확인)
    <table class="cr">${files.map(f => `<tr><td>${esc(f.id)}</td><td><a href="${esc(f.page)}" target="_blank" rel="noopener">${esc(f.commons_file)}</a><br>${esc(f.author)} · ${esc(f.license)}${f.mp3 ? '' : ' · <b>아직 못 받음</b>'}</td></tr>`).join('')}</table>
    <p class="sub">게임에는 형식만 mp3로 바꿔 넣었다(자르거나 다듬지 않음). ${esc(D.audioPlan || '')}</p></div>
    <div class="card"><b>자료</b><table class="cr">${D.refs.map(r => `<tr><td>${esc(r.cite)}${r.doi ? ` <a href="https://doi.org/${esc(r.doi)}" target="_blank" rel="noopener">doi</a>` : ''}</td></tr>`).join('')}</table>
    <p class="sub">PHOIBLE 대조 결과(sources/phoible-b01.json)는 CC BY-SA 3.0을 따른다.</p></div>
    <div class="card"><b>글꼴</b><p class="sub">Balum IPA: Charis SIL 7.000(SIL Global)에서 글자를 줄이고 이름을 바꾼 것. SIL Open Font License 1.1(assets/fonts/OFL.txt).</p></div>
    <div class="card"><b>그림</b><p class="sub">입 옆모습·목청·소리 시작 띠는 이 게임이 그린 모식도다. 실제 비율이 아니다.</p></div>
    <button class="btn ghost" id="hm">처음으로</button>`;
  document.getElementById('hm').onclick = home;
