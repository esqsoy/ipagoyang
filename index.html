<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#160826">
<title>발음고양</title>
<style>
:root{--pink-rgb:255,79,163;--gold-rgb:255,211,77;--cyan-rgb:92,230,255;--panel-rgb:34,16,58;--bg1-rgb:22,8,38;
  --bg1:#160826; --bg2:#2a0c40; --bg3:#3a1054;
  --ink:#ffffff; --muted:#c6bcdd;        /* 번역·라벨: 채도 .61→.33, 명암비 10.2:1 */
  --panel:#1d0c2e; --panel2:#26103a;
  --line:#6f3c95;                        /* 경계 명암비 1.83→2.41:1 */
  --pink:#ff4fa3; --pink2:#ff8ac6; --pinkpale:#f6e2ec;   /* 예문: 채도 1.00→.53, 명암비 14.9:1 */
  --cyan:#5ce6ff; --cyansoft:#a5dfef; --mint:#7cffb2; --gold:#ffd34d; --gold2:#f5b301;
  --bad:#ff5d6c; --bad2:#ff8a94;         /* 테두리는 --bad, 글자는 읽기 쉬운 --bad2 */
  --radius:14px;
  --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{
  font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color:var(--ink);
  /* 한국어는 낱말 단위로 줄을 바꾼다. 없으면 "가리/켜"처럼 낱말 중간에서 끊겨
     폰(390px)에서 해설의 43%가 읽다 걸린다(26.10.08 실측). 칸을 넘칠 만큼 긴 낱말만 쪼갠다. */
  word-break:keep-all;overflow-wrap:break-word;
  background:
    radial-gradient(circle at 16% 14%, rgba(var(--pink-rgb),.30), transparent 30%),
    radial-gradient(circle at 84% 10%, rgba(var(--cyan-rgb),.16), transparent 26%),
    radial-gradient(circle at 78% 84%, rgba(124,255,178,.10), transparent 26%),
    linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 60%, var(--bg3) 100%);
  background-attachment:fixed;
  overflow-x:hidden;
}
/* starfield */
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    radial-gradient(2px 2px at 20% 30%,#fff,transparent),
    radial-gradient(2px 2px at 70% 80%,#fff,transparent),
    radial-gradient(1px 1px at 40% 60%,var(--gold),transparent),
    radial-gradient(1px 1px at 85% 22%,var(--cyan),transparent),
    radial-gradient(2px 2px at 12% 82%,var(--pink2),transparent),
    radial-gradient(1px 1px at 52% 12%,#fff,transparent),
    radial-gradient(2px 2px at 34% 88%,var(--pink),transparent);
  opacity:.7;animation:tw 3s steps(2) infinite;
}
@keyframes tw{50%{opacity:.3;}}
button,input{font:inherit;}
.app{position:relative;z-index:1;width:min(100%,560px);min-height:100dvh;margin:0 auto;
  padding:max(10px,env(safe-area-inset-top)) 13px max(14px,env(safe-area-inset-bottom));
  display:flex;flex-direction:column;gap:12px;}

/* ---------- header / map ---------- */
.appbar{display:flex;align-items:center;gap:10px;}
.appbar h1{margin:0;font-size:clamp(.86rem,3.9vw,1.12rem);line-height:1.2;letter-spacing:-.4px;min-width:0;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.appbar h1 b{color:var(--gold);}
.appbar .spacer{flex:1;}
.iconbtn{width:40px;height:40px;border-radius:11px;border:2px solid var(--line);
  background:var(--panel2);color:#fff;font-size:1.05rem;cursor:pointer;display:grid;place-items:center;}
.iconbtn:active{transform:translateY(1px);}
.appbar > .iconbtn{flex-shrink:0;}
.course-home{text-decoration:none;}
.course-home svg{display:block;width:20px;height:20px;}
.course-home:focus-visible{outline:2px solid var(--gold);outline-offset:3px;}
body.playing .course-home{display:none;}

/* map progress (Ilsan -> Seoul) */
.maproute{order:5;border:2px solid var(--line);border-radius:var(--radius);background:
   linear-gradient(135deg,rgba(255,255,255,.05),transparent 40%),var(--panel);
  box-shadow:var(--shadow);padding:11px 13px 13px;}
.maproute .ends{display:flex;justify-content:space-between;font-size:.74rem;font-weight:800;
  color:var(--muted);margin-bottom:7px;}
.maproute .ends .seoul{color:var(--gold);}
.track{position:relative;height:20px;}
.track .rail{position:absolute;top:50%;left:6px;right:6px;height:6px;transform:translateY(-50%);
  border-radius:99px;background:#3a1f55;overflow:hidden;
}
.track .rail i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--cyan),var(--mint),var(--gold),var(--pink2),var(--pink));
  transition:width .5s cubic-bezier(.2,1,.3,1);}
.track .marker{position:absolute;top:50%;left:0;width:24px;height:24px;transform:translate(-50%,-50%);
  transition:left .5s cubic-bezier(.2,1,.3,1);z-index:2;}
.track .marker img{width:100%;height:auto;image-rendering:pixelated;
  filter:drop-shadow(0 0 5px rgba(var(--pink-rgb),.6));}
.track .pin{position:absolute;top:50%;width:11px;height:11px;border-radius:50%;
  transform:translate(-50%,-50%);background:#2a0a3a;border:2px solid var(--line);}
.track .pin.lit{background:var(--gold);border-color:var(--gold2);}
.maproute .pct{margin-top:8px;text-align:center;font-size:.78rem;color:var(--muted);}
.maproute .pct b{color:var(--gold);}

/* ---------- cat companion bubble (home) ---------- */
.catrow{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:end;
  border:2px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(135deg,rgba(255,255,255,.05),transparent 40%),var(--panel);
  box-shadow:var(--shadow);padding:12px;}
.catimg{width:clamp(78px,21vw,104px);}
.catimg img{width:100%;height:auto;image-rendering:pixelated;display:block;
  filter:drop-shadow(0 0 8px rgba(255,255,255,.7)) drop-shadow(0 0 16px rgba(var(--pink-rgb),.4));
  animation:bob 2.6s ease-in-out infinite;}
@keyframes bob{50%{transform:translateY(-4px) rotate(-1deg);}}
.bubble{position:relative;border:2px solid var(--pink2);border-radius:12px;padding:11px 13px;
  background:rgba(var(--panel-rgb),.96);font-size:clamp(.86rem,3.6vw,1.02rem);line-height:1.5;
  min-height:3em;display:flex;align-items:center;}
.bubble::before{content:"";position:absolute;left:-9px;bottom:18px;width:15px;height:15px;
  background:rgba(var(--panel-rgb),.96);border-left:2px solid var(--pink2);border-bottom:2px solid var(--pink2);
  transform:rotate(45deg);}
.bubble .nm{color:var(--pink2);font-weight:900;}

/* ---------- screens ---------- */
.screen{display:none;flex-direction:column;gap:12px;flex:1;animation:lift .18s ease-out;}
.screen.active{display:flex;}
/* game: 플레이 중엔 상단바·지도 숨김, 입력 띠 → 카드 → 진행 패널 */
body.playing .appbar,body.playing .maproute{display:none;}
body.playing::before{animation:none;opacity:.45;}   /* 별 깜빡임 정지 */
body.playing .app{gap:8px;padding:max(6px,env(safe-area-inset-top)) 6px max(8px,env(safe-area-inset-bottom));}
#gameScreen{gap:8px;}
@keyframes lift{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

.homeCredit{margin:8px 0 0;text-align:center;font-size:.78rem;font-weight:800;letter-spacing:.4px;color:var(--muted);opacity:.9;}
.homeCredit b{color:var(--pink2);}
.homeCredit a{display:inline-block;padding:8px 12px;color:inherit;text-decoration:none;}
.panel{border:2px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(135deg,rgba(255,255,255,.05),transparent 42%),var(--panel);
  box-shadow:var(--shadow);}
.phead{display:flex;align-items:center;gap:10px;padding:13px;}
.phead h2{margin:0;font-size:1.05rem;}
.phead p{margin:3px 0 0;color:var(--muted);font-size:.82rem;}

/* lesson + exercise grids */
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;align-items:start;}
.lessonbtn,.exbtn{border:2px solid var(--line);border-radius:12px;cursor:pointer;color:#fff;
  text-align:left;padding:13px;display:flex;flex-direction:column;gap:9px;
  background:linear-gradient(160deg,#3a1555,var(--panel2) 62%,var(--bg1));
  transition:transform .12s,border-color .12s;}
.lessonbtn:active,.exbtn:active{transform:translateY(1px);}
.lessonbtn:hover,.exbtn:hover{border-color:var(--pink);}
.lessonbtn .t,.exbtn .t{font-size:1.18rem;font-weight:900;}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;
  color:var(--muted);font-size:.78rem;}
.bar{height:7px;border-radius:99px;background:var(--panel2);overflow:hidden;
  border:1px solid rgba(var(--cyan-rgb),.25);}
.bar i{display:block;height:100%;width:0;border-radius:99px;
  background:#9b59cd;
  transition:width .3s;}
.lessonbtn{padding:9px 11px !important;gap:5px !important;}
.lessonbtn .lh{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap;line-height:1.12;}
.lessonbtn .lid{font-size:1rem;font-weight:900;color:#fff;}
.lessonbtn .lname{font-size:.8rem;font-weight:700;color:var(--pink2);letter-spacing:-.3px;}
.lessonbtn .lmeta{font-size:.72rem;color:var(--muted);}
.lessonbtn .lmeta b{color:var(--gold);}
.lessonbtn.done{border-color:var(--gold2);}
.lessonbtn.morph{border-color:#2f7d95;background:linear-gradient(160deg,#153a4d,#1a1d3a 62%,var(--bg1));}
.lessonbtn.morph .lname{color:var(--cyan);}
.lessonbtn .lbar{height:4px;margin-top:2px;}
.btn.resume{margin:0 13px 10px;width:calc(100% - 26px);min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:9px 12px;line-height:1.15;}
.btn.resume small{font-weight:800;font-size:.76rem;opacity:.85;}
.resume-heading{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:center;column-gap:10px;row-gap:2px;}
#homeMeta{display:block;line-height:1.35;}
#homeHeading #homeMeta{margin-top:3px;color:var(--muted);font-size:.82rem;}
.btn.resume #homeMeta{font-size:.72rem;font-weight:700;}
.btn.resume[hidden]{display:none;}
.exgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:0 13px 13px;}
.exbtn .done{color:var(--gold);font-weight:800;}
.exbtn.cleared{border-color:var(--gold2);}
.exbtn.cleared::after{content:"★";color:var(--gold);position:absolute;}
/* 연습·세트 타일(26.10.08 영신 제보, iPhone Safari 화면):
   - Safari는 keep-all에서 "백·천·백만"처럼 가운뎃점으로 이은 한국어를 한 덩어리로 보고 끊지 않는다. 그 폭이 1fr 칸의 최소 폭이 되어 왼쪽 칸만 넓어졌다. → 두 칸을 내용과 상관없이 같은 폭으로.
   - 별이 제목 첫 글자(E)를 덮었다(위치 없는 absolute). → 별을 제목 앞 글자로.
   - 구분점 " · "이 혼자 한 줄을 차지했다. → tileTitleHtml()에서 앞말에 붙이고, 낱말 사이 "·" 뒤에서는 줄을 바꿀 수 있게 한다. */
body .grid,body .exgrid{grid-template-columns:repeat(2,minmax(0,1fr));}
.lessonbtn .t,.exbtn .t{overflow-wrap:anywhere;}
.exbtn.cleared::after{content:none;}
.exbtn.cleared .t::before{content:"★";color:var(--gold);margin-right:.3em;}
.exbtn .t .nb{white-space:nowrap;}

/* ---------- game ---------- */
.gtop{display:grid;gap:8px;padding:9px 12px;}
.gtoprow{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.gtl{display:flex;align-items:baseline;gap:6px;min-width:0;}
.kick{color:var(--ink);font-size:.74rem;font-weight:900;flex:none;}
.gtitle{font-size:.86rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted);}
.gstat{display:flex;align-items:center;gap:8px;flex:none;font-size:.82rem;flex-wrap:wrap;justify-content:flex-end;row-gap:2px;} /* wrap: 낱말을 쪼개지 않아도(keep-all) 320px에서 넘치지 않게. 실제로는 한 줄 유지 */
.gstat b{font-weight:900;} .gstat .t-time{color:var(--cyansoft);font-variant-numeric:tabular-nums;} .gstat .t-err{color:var(--bad2);}
.gstat .t-err i{font-style:normal;color:var(--muted);font-weight:700;font-size:.72rem;}
.roundpill{flex:none;color:var(--muted);font-weight:800;font-size:.82rem;}
.grow2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.ghost.small{min-height:36px;font-size:.82rem;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px;}
.spk{display:inline-block;vertical-align:middle;color:var(--pink2);}
/* quiz card: 예문이 주인공 */
.quiz{flex:0 0 auto;display:flex;flex-direction:column;justify-content:flex-start;gap:8px;
  padding:12px 10px 14px;gap:10px;position:relative;overflow:hidden;isolation:isolate;transition:border-color .2s,box-shadow .2s;}
.quiz.good{border-color:var(--mint);}
.quiz.bad{border-color:var(--bad);}
/* 공개 화면: 이미 답한 뜻 줄은 작게(자리를 해설에 넘긴다), 작은 폰에서 넘치면 카드가 스크롤 */
.quiz.good,.quiz.bad{overflow-y:auto;}
.quiz.good .meaning,.quiz.bad .meaning{font-size:clamp(1.2rem,5.3vw,1.45rem);} /* 공개 순간 뜻이 16px 내려앉던 것을 줄였다. 완전히 같게 두면 해설 자리가 모자란다 */
.quiz.wrong{animation:sh .3s;}
.cstreak{color:var(--gold);font-weight:900;}
.exwrap{position:relative;min-height:44px;}
.hform{position:absolute;inset:0;z-index:2;}
.hform #submitBtn,.hform .fb{display:none;}
.quiz .ainput{position:absolute;inset:0;width:100%;height:100%;min-height:0;opacity:0;font-size:16px;border:0;border-radius:0;padding:0;margin:0;
  background:transparent;color:transparent;caret-color:transparent;box-shadow:none;-webkit-user-select:text;user-select:text;}
.quiz .ainput:focus{box-shadow:none;border:0;}
.input-help{margin:0;color:var(--gold);font-size:.82rem;line-height:1.45;text-align:center;}
.input-focus{align-self:center;}
.input-focus[hidden]{display:none;}
/* 뜻(문제)은 카드 폭을 통째로 쓴다. 전에는 💡와 고양이 사이에 끼어 69%(245px)만 써서
   390px 폭에서 26%가 두 줄로 쪼개졌다 — 지금은 6%. 한글 뜻은 어절 단위로 끊겨
   줄이 좁을수록 읽는 리듬이 끊기고, 줄 수가 문제마다 달라져 카드 높이도 요동쳤다. */
.trow{display:flex;align-items:center;gap:10px;}
.time-slot{flex:1;min-width:0;display:grid;align-items:center;}
.time-slot>*{grid-area:1/1;}
.trow .timewrap{width:100%;min-width:0;}
.cat-speech{position:relative;z-index:1;margin:0;padding:7px 9px;
  border:1px solid var(--pink2);border-radius:10px;background:var(--panel2);
  color:var(--pink2);font-size:clamp(.85rem,3.5vw,.98rem);font-weight:800;line-height:1.45;
  text-align:center;word-break:keep-all;overflow-wrap:anywhere;pointer-events:none;}
.cat-speech[hidden]{display:none;}
.cat-speech::after{content:"";position:absolute;right:-5px;top:calc(50% - 4px);
  width:8px;height:8px;background:var(--panel2);border-top:1px solid var(--pink2);
  border-right:1px solid var(--pink2);transform:rotate(45deg);}
.quiz.good .cat-speech{color:var(--mint);border-color:var(--mint);}
.quiz.good .cat-speech::after{border-color:var(--mint);}
.trow .ibtn{flex:none;width:44px;min-height:44px;font-size:1.05rem;padding:0;display:grid;place-items:center;line-height:1;}
.trow .catbtn{flex:none;height:46px;}
.meaning{margin:0;text-align:center;font-weight:900;line-height:1.2;word-break:keep-all;
  font-size:clamp(1.55rem,7vw,2.2rem);
  position:relative;z-index:1;}
.qmini{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:.92rem;min-height:1.1em;}
.qmini:empty{display:none;}
.timewrap{position:relative;z-index:1;height:8px;border-radius:99px;background:var(--panel2);overflow:hidden;
  border:1px solid rgba(var(--cyan-rgb),.25);}
.qoverlay{position:absolute;inset:0;z-index:5;display:none;flex-direction:column;justify-content:flex-start;
  align-items:center;gap:8px;padding:14px 16px;border-radius:inherit;text-align:center;overflow:auto;
  background:linear-gradient(160deg,rgba(38,16,58,.97),rgba(var(--bg1-rgb),.98));animation:ovin .18s ease-out;}
.qoverlay.show{display:flex;}
.qoverlay.good{background:linear-gradient(160deg,rgba(20,44,30,.96),rgba(14,30,22,.98));}
@keyframes ovin{from{opacity:0;transform:scale(.97);}to{opacity:1;transform:scale(1);}}
.ov-cat{width:clamp(46px,12vw,64px);}
.ov-cat img{width:100%;image-rendering:pixelated;filter:drop-shadow(0 0 7px rgba(var(--pink-rgb),.5));}
.ov-say{color:var(--pink2);font-weight:900;font-size:clamp(.92rem,4vw,1.12rem);line-height:1.35;}
.qoverlay.good .ov-say{color:var(--mint);}
.ov-ans{color:var(--gold);font-weight:900;line-height:1.08;font-size:clamp(1.8rem,9vw,3rem);
  overflow-wrap:anywhere;}
.ov-ko{color:var(--muted);font-size:.84rem;}
.ov-ghost{font-family:ui-monospace,monospace;font-size:clamp(1.5rem,8vw,2.4rem);font-weight:900;
  letter-spacing:2px;word-break:break-all;color:var(--line);}
.ov-ghost b{color:var(--mint);} .ov-ghost .x{color:var(--bad);}
.ov-hint{color:var(--muted);font-size:.78rem;}
.qoverlay.wrong{animation:sh .3s;}
.timewrap i{display:block;height:100%;width:100%;border-radius:99px;background:var(--muted);
  transition:width .15s linear, background .3s;}
.timewrap.warn i{background:var(--muted);} .timewrap.danger i{background:#b97882;}

/* input strip */
.inpanel{padding:7px 8px;display:flex;gap:7px;align-items:center;}
.inpanel .ainput{flex:1;}
.inpanel #submitBtn{display:none;}
.inpanel .fb{display:none;}
.ibtn{min-height:44px;width:44px;padding:0;font-size:1.15rem;flex:none;}
.catbtn{background:none;border:0;padding:0 2px;cursor:pointer;height:46px;flex:none;
  display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;}
.catbtn img{height:100%;width:auto;image-rendering:pixelated;display:block;
  filter:drop-shadow(0 0 8px rgba(255,255,255,.6)) drop-shadow(0 0 14px rgba(var(--pink-rgb),.4));
  animation:bob 2.6s ease-in-out infinite;}
.catbtn:active{transform:translateY(2px);}
.ainput{min-width:0;min-height:44px;border:2px solid var(--line);border-radius:11px;background:#160a24;
  color:var(--muted);padding:0 12px;font-size:1rem;letter-spacing:.4px;outline:none;caret-color:var(--gold);
  box-shadow:inset 0 0 12px rgba(0,0,0,.55);}
.ainput:focus{border-color:var(--pink2);}
.ainput.ok{border-color:var(--mint);} .ainput.bad{border-color:var(--bad);animation:sh .35s;}
@keyframes sh{0%,100%{transform:translateX(0);}25%{transform:translateX(-6px);}50%{transform:translateX(6px);}75%{transform:translateX(-4px);}}
.btn{min-height:56px;border-radius:11px;border:2px solid var(--gold2);cursor:pointer;font-weight:900;
  padding:0 18px;background:linear-gradient(180deg,#ffe06b,#e0a92a 60%,#7d4f06);color:#1a0820;
  box-shadow:0 4px 0 #4a2d06;}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #4a2d06;}
.btn:disabled{opacity:.5;}
.ghost{min-height:44px;border-radius:11px;border:2px solid var(--line);background:var(--panel2);color:#fff;
  cursor:pointer;font-weight:800;padding:0 12px;}
.ghost:active{transform:translateY(1px);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}

/* feedback / copy mode */
.fb{display:none;border:2px solid var(--line);border-radius:12px;background:var(--panel2);padding:12px;}
.fb.show{display:block;}
.fb.good{border-color:var(--mint);background:rgba(124,255,178,.08);}
.fb.bad{border-color:var(--bad);background:rgba(255,93,108,.08);}
.reveal{display:block;text-align:center;color:var(--gold);font-weight:900;line-height:1.1;
  font-size:clamp(2rem,11vw,4.4rem);overflow-wrap:anywhere;
}
.reveal small{display:block;font-size:.9rem;color:var(--muted);margin-top:6px;text-shadow:none;letter-spacing:0;}
.copywrap{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:center;}
.copywrap .cc{width:clamp(64px,17vw,90px);}
.copywrap .cc img{width:100%;image-rendering:pixelated;filter:drop-shadow(0 0 7px rgba(var(--pink-rgb),.5));}
.copybox{min-width:0;}
.copybox .say{color:var(--pink2);font-weight:900;margin-bottom:6px;font-size:.92rem;}
.ghosttar{font-family:ui-monospace,monospace;font-size:clamp(1.5rem,8vw,2.6rem);font-weight:900;
  letter-spacing:2px;word-break:break-all;color:var(--line);}
.ghosttar b{color:var(--mint);} .ghosttar .x{color:var(--bad);}
.copyhint{color:var(--muted);font-size:.74rem;margin-top:6px;}
.copywrap.wrong{animation:sh .3s;}

/* summary */
.sum{padding:16px;display:grid;gap:13px;}
.sum h2{margin:0;font-size:clamp(1.4rem,6vw,2rem);}
.sumcat{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:center;}
.sumcat .cc{width:clamp(70px,18vw,96px);}
.sumcat .cc img{width:100%;image-rendering:pixelated;filter:drop-shadow(0 0 8px rgba(var(--gold-rgb),.6));}
.sumgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;}
.wrongs{display:grid;gap:6px;}
.wrongs .wh{color:var(--muted);font-size:.8rem;font-weight:800;padding:2px 2px 0;}
.wrongs .wh.ok{color:var(--mint);}
.wrow{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;text-align:left;
  border:2px solid var(--line);border-radius:11px;background:var(--panel2);color:#fff;padding:9px 12px;cursor:pointer;}
.wrow b{color:var(--gold);font-size:1.02rem;} .wrow span{color:var(--muted);font-size:.84rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wrow i{font-style:normal;color:var(--bad);font-size:.76rem;font-weight:800;}
.wrow:active{transform:translateY(1px);}
.wrow{transition:opacity .25s,transform .25s;}
.wrow.gone{opacity:0;transform:translateX(28px);pointer-events:none;}
.sumitem{border:2px solid var(--line);border-radius:11px;background:var(--panel2);padding:11px;}
.sumitem b{display:block;font-size:1.15rem;} .sumitem span{color:var(--muted);font-size:.78rem;}

/* fx layer */
.fxlayer{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:40;}
.quiz.flash{animation:cardPulse .5s ease-out;}
@keyframes cardPulse{0%{box-shadow:var(--shadow);}45%{box-shadow:0 0 0 2px #fff,0 0 26px 8px var(--pink2),var(--shadow);}100%{box-shadow:var(--shadow);}}
/* 정답 광원: 빈칸 자리에서 작은 꽃잎·불티가 바깥으로 터져 0.6초 안에 사라진다(글자를 안 가림) */
.pt{position:absolute;left:var(--x,50%);top:var(--y,50%);width:calc(var(--sz,18px) * var(--fx-pk,1));height:calc(var(--sz,18px) * var(--fx-pk,1));transform:translate(-50%,-50%);
  animation:ptfly var(--dur,.6s) cubic-bezier(.1,.8,.3,1) forwards;filter:drop-shadow(0 0 5px var(--glow,var(--pink)));will-change:transform,opacity;}
.pt svg{width:100%;height:100%;display:block;}
@keyframes ptfly{0%{transform:translate(-50%,-50%) translate(0,0) scale(.3) rotate(0);opacity:0;}8%{opacity:1;}55%{opacity:1;}
  100%{transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(1) rotate(var(--rot,180deg));opacity:0;}}
.dot{position:absolute;left:var(--x,50%);top:var(--y,50%);width:calc(6px * var(--fx-pk,1));height:calc(6px * var(--fx-pk,1));border-radius:50%;background:#fff;
  box-shadow:0 0 6px #fff,0 0 12px var(--gold);transform:translate(-50%,-50%);animation:dotfly var(--dur,.5s) cubic-bezier(.1,.8,.3,1) forwards;}
@keyframes dotfly{0%{transform:translate(-50%,-50%) translate(0,0) scale(1);opacity:1;}60%{opacity:1;}100%{transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.2);opacity:0;}}
/* 하트 파동: 속을 채우지 않은 빛나는 윤곽이라 글자가 비쳐 읽힌다 */
.hwave{position:absolute;left:var(--x,50%);top:var(--y,50%);width:var(--sz,56px);height:var(--sz,56px);
  transform:translate(-50%,-50%) rotate(var(--tilt,0deg)) scale(.35);opacity:0;
  animation:hwave var(--dur,.66s) var(--del,0s) cubic-bezier(.12,.75,.3,1) forwards;
  filter:drop-shadow(0 0 6px rgba(255,138,198,.9));}
.hwave svg{width:100%;height:100%;display:block;}
@keyframes hwave{0%{transform:translate(-50%,-50%) rotate(var(--tilt,0deg)) scale(.35);opacity:0;}
  18%{opacity:.95;}60%{opacity:.35;}100%{transform:translate(-50%,-50%) rotate(var(--tilt,0deg)) scale(var(--s2,2.2));opacity:0;}}
/* 틀린 단어 지울 때: 줄 자리에서 하트가 커지며 빛나고 사라짐 */
.hpop{position:absolute;left:var(--x,50%);top:var(--y,50%);width:76px;height:76px;transform:translate(-50%,-50%) scale(.3);opacity:0;
  animation:hpop .9s cubic-bezier(.16,1,.3,1) forwards;filter:drop-shadow(0 0 10px #fff) drop-shadow(0 0 22px var(--pink));}
.hpop svg{width:100%;height:100%;display:block;}
@keyframes hpop{0%{transform:translate(-50%,-50%) scale(.3);opacity:0;}25%{opacity:1;}60%{transform:translate(-50%,-50%) scale(1.5);opacity:.95;}100%{transform:translate(-50%,-50%) scale(1.9);opacity:0;}}
.spark{position:absolute;left:var(--x,50%);top:var(--y,50%);width:var(--sz,30px);height:var(--sz,30px);
  transform:translate(-50%,-50%);animation:fly 1.25s cubic-bezier(.18,.9,.3,1) forwards;
  filter:drop-shadow(0 0 5px #fff) drop-shadow(0 0 12px var(--glow,var(--pink)));will-change:transform,opacity;}
.spark svg{width:100%;height:100%;display:block;}
@keyframes fly{0%{transform:translate(-50%,-50%) translate(0,0) scale(.25) rotate(0);opacity:0;}
  18%{opacity:1;}
  100%{transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(1.05) rotate(var(--rot,360deg));opacity:0;}}
.ring{position:absolute;left:var(--x,50%);top:var(--y,50%);width:24px;height:24px;border-radius:50%;
  border:6px solid var(--gold);transform:translate(-50%,-50%);animation:rg .85s ease-out forwards;
  box-shadow:0 0 24px #fff,0 0 50px var(--pink);}
.ring.b{border-color:var(--pink);animation-delay:.08s;} .ring.c{border-color:var(--cyan);animation-delay:.16s;}
@keyframes rg{0%{width:20px;height:20px;opacity:1;}100%{width:440px;height:440px;opacity:0;border-width:1px;}}
.heartburst{position:absolute;left:var(--x,50%);top:var(--y,50%);width:120px;height:120px;
  transform:translate(-50%,-50%) scale(.2);transform-origin:center;opacity:0;
  animation:hburst .95s cubic-bezier(.16,1,.3,1) forwards;
  filter:drop-shadow(0 0 24px #fff) drop-shadow(0 0 60px var(--pink));will-change:transform,opacity;}
.heartburst svg{width:100%;height:100%;display:block;}
@keyframes hburst{0%{transform:translate(-50%,-50%) scale(.2);opacity:0;}
  22%{opacity:1;}
  55%{transform:translate(-50%,-50%) scale(2.6);opacity:.95;}
  100%{transform:translate(-50%,-50%) scale(3.4);opacity:0;}}
body.shake{animation:bshake .3s;}
@keyframes bshake{0%,100%{transform:translate(0,0);}33%{transform:translate(-2px,1px);}66%{transform:translate(2px,-1px);}}


@media (max-width:640px){
  .grid,.exgrid{grid-template-columns:1fr 1fr;}
  .stats{grid-template-columns:repeat(4,1fr);}
}
@media (max-width:380px){
  .stat span{font-size:.6rem;}
  .meaning{font-size:clamp(1.5rem,8.5vw,2.6rem);}
}

/* ---------- 화면 가장자리 금빛(10연속부터) ---------- */
.edge{position:absolute;inset:0;box-shadow:inset 0 0 60px 20px rgba(var(--gold-rgb),.55),inset 0 0 120px 40px rgba(var(--pink-rgb),.25);animation:edge 1s ease-out forwards;}
@keyframes edge{0%{opacity:0;}25%{opacity:1;}100%{opacity:0;}}
/* ---------- 퍼펙트 포효 ---------- */
.roar{position:fixed;inset:0;z-index:70;display:none;place-items:center;overflow:hidden;
  background:radial-gradient(circle at 50% 45%,rgba(var(--gold-rgb),.35),rgba(var(--bg1-rgb),.92) 70%);}
.roar.show{display:grid;animation:endfade .25s ease;}
.roar .rays{position:absolute;left:50%;top:45%;width:200vmax;height:200vmax;transform:translate(-50%,-50%);
  background:repeating-conic-gradient(from 0deg,rgba(var(--gold-rgb),.28) 0deg 9deg,transparent 9deg 22deg);animation:spin 6s linear infinite;opacity:.9;}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg);}}
.roar-cat{position:relative;width:min(62vw,260px);animation:roarpop 2.2s cubic-bezier(.16,1,.3,1) both;}
.roar-cat img{width:100%;image-rendering:pixelated;display:block;
  filter:drop-shadow(0 0 14px #fff) drop-shadow(0 0 34px var(--gold)) drop-shadow(0 0 60px var(--pink));}
@keyframes roarpop{0%{transform:scale(.3);opacity:0;}12%{transform:scale(1.18);opacity:1;}18%{transform:scale(1.05) rotate(-3deg);}24%{transform:scale(1.14) rotate(3deg);}30%{transform:scale(1.06) rotate(-2deg);}36%{transform:scale(1.1) rotate(0);}100%{transform:scale(1.1);opacity:1;}}
.roar-inner{position:relative;display:flex;flex-direction:column;align-items:center;gap:26px;transform:translateY(-4vh);}
.roar-txt{text-align:center;animation:endpop .6s .25s cubic-bezier(.2,1.4,.4,1) both;}
.roar-txt b{display:block;font-size:clamp(2rem,11vw,3.4rem);color:var(--gold);letter-spacing:3px;text-shadow:0 0 14px #fff,0 0 30px var(--gold),3px 3px 0 var(--bg3);}
.roar-txt span{display:block;margin-top:6px;font-size:clamp(1.1rem,5.5vw,1.6rem);font-weight:900;color:#fff;text-shadow:0 0 10px var(--pink);}
body.roaring{animation:roarshake .5s .15s;}
@keyframes roarshake{0%,100%{transform:translate(0,0);}20%{transform:translate(-5px,3px);}40%{transform:translate(5px,-3px);}60%{transform:translate(-4px,2px);}80%{transform:translate(4px,-2px);}}
/* ---------- ending (100% 탈출) ---------- */
.ending{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:20px;
  background:radial-gradient(circle at 50% 28%,rgba(var(--pink-rgb),.28),rgba(8,3,16,.93));
  -webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);}
.ending.show{display:grid;animation:endfade .45s ease;}
@keyframes endfade{from{opacity:0;}}
.ending-card{width:min(100%,420px);border:2px solid var(--gold2);border-radius:18px;
  background:linear-gradient(160deg,#2c0d44,var(--bg1));
  padding:22px 20px 18px;text-align:center;}
.ending-card .ec{width:114px;margin:0 auto;}
.ending-card .ec img{width:100%;image-rendering:pixelated;filter:drop-shadow(0 0 12px rgba(var(--gold-rgb),.65));animation:bob 2.6s ease-in-out infinite;}
.ending-card h2{margin:8px 0 6px;color:var(--gold);font-size:1.3rem;}
.ending-card p{color:var(--muted);font-size:.9rem;line-height:1.55;margin:0 0 15px;}
.ending-form{display:flex;flex-direction:column;gap:10px;}
.ending-form input{padding:12px 14px;border-radius:12px;border:2px solid var(--line);
  background:var(--panel2);color:#fff;font-size:1.06rem;text-align:center;}
.ending-form input:focus{outline:none;border-color:var(--pink);}
.ending-result{display:none;margin-top:6px;font-size:1.18rem;font-weight:800;color:var(--gold);line-height:1.55;animation:endpop .5s cubic-bezier(.2,1.4,.4,1);}
.ending-result .nm{color:var(--pink2);}
@keyframes endpop{from{transform:scale(.7);opacity:0;}}

/* ===== HoE 리치 카드/리빌 ===== */
.hoectx .ex{margin-top:4px;font-size:1rem;color:var(--ink);line-height:1.55;word-break:keep-all;text-align:center;}
.hoectx .blanks{display:inline-flex;gap:5px;margin:0 3px;vertical-align:-2px;}
.hoectx .slot{min-width:15px;height:1.05em;padding:0 1px;box-sizing:border-box;display:inline-flex;align-items:flex-end;justify-content:center;border-bottom:3px solid var(--gold);color:var(--gold);font-weight:900;font-size:1.05rem;line-height:1;}
.hoectx .slot.cur{border-bottom-color:#fff;animation:caret 1s steps(1) infinite;}
.hoectx .slot.over{border-bottom-color:var(--bad);}
@keyframes caret{50%{border-bottom-color:var(--gold);}}
.ov-ipa{font-size:1.02rem;color:var(--cyansoft);font-weight:600;letter-spacing:.3px;margin-top:4px;}
.ov-ipa b{color:var(--gold);font-weight:900;font-size:1.55rem;}
.ov-ipa i{font-style:normal;color:var(--gold);font-weight:800;font-size:1.18rem;opacity:.85;}
.ov-ex{margin-top:10px;font-size:1.02rem;color:#fff;line-height:1.5;word-break:keep-all;}
.ov-ex .fill{color:var(--gold);font-weight:900;}
.ov-tr{margin-top:5px;font-size:.9rem;color:var(--muted);}
.ov-c{margin-top:12px;font-size:1.05rem;color:#fff;line-height:1.6;text-align:left;overflow-wrap:anywhere;
  background:rgba(124,255,178,.09);border:1px solid var(--mint);border-radius:12px;padding:11px 13px;}
.ov-say{font-size:.86rem;opacity:.85;}
.qoverlay.show{overflow-y:auto;}
/* 제자리 정답 공개 */
.hoectx .ex{font-size:clamp(1.42rem,6.4vw,1.8rem);line-height:1.7;margin-top:6px;}
.hoectx .blanks{gap:.4em .8em;margin:0 4px;max-width:calc(100% - 8px);flex-wrap:wrap;align-items:flex-end;justify-content:center;}
.hoectx .slot-word{display:inline-flex;gap:6px;max-width:100%;flex-wrap:wrap;justify-content:center;row-gap:.4em;}
.hoectx .slot{min-width:22px;font-size:1.5rem;border-bottom-width:3px;}
.hoectx .slot.gh{color:var(--muted);border-bottom-color:var(--line);}
.hoectx .slot.ok{color:var(--mint);border-bottom-color:var(--mint);}
.hoectx .slot.x{color:var(--bad2);border-bottom-color:var(--bad);}
.hoectx .fill{color:var(--gold);font-weight:900;padding:0 2px;}
.quiz.bad .hoectx .fill{color:var(--bad);}
.rv{display:none;gap:8px;flex-direction:column;align-items:center;text-align:center;animation:ovin .18s ease-out;}
.rv.show{display:flex;}
.rv-word{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;margin-top:2px;} /* 발음기호를 단어 아래에(26.9.12 시험, 롤백은 flex-direction:row;gap:10px) */
.rv-w{color:var(--gold);font-weight:900;font-size:clamp(2.1rem,9.4vw,3rem);line-height:1.1;overflow-wrap:anywhere;
}
.rv .ov-ipa{margin-top:0;}
.rv-w{cursor:pointer;}
.rv .ov-tr{margin-top:-2px;font-size:1.16rem;color:var(--muted);}
.rv .rv-word{margin-top:4px;}
.rv .ov-ipa{font-size:1.3rem;} .rv .ov-ipa b{font-size:1.95rem;} .rv .ov-ipa i{font-size:1.45rem;}
.rv .ov-c{font-size:1.26rem;line-height:1.6;padding:11px 13px;}
.rv .ov-say{font-size:.98rem;}
.rv .ov-c{margin-top:2px;width:100%;}
.rv .ov-hint{font-size:.8rem;}


/* ============ 연습마다 돌아가는 꽃 효과(유리꽃 화약 제외) ============ */
/* ===== 꽃 v1 · 겹꽃잎 다종 꽃다발 ===== */
/* ===== v1 · 겹꽃잎 다종 꽃 — #fxLayer 전용. UI에는 아무 그림자·광원도 얹지 않는다 ===== */
/* 스프라이트(기하·그라데이션 정의) — 보이지 않고 레이아웃에 영향 없음 */
.v1-defs{position:absolute;left:0;top:0;width:0;height:0;overflow:hidden;opacity:0;}

/* 꽃 한 송이: 바깥 div = 비행(translate+scale), 안쪽 svg = 회전·뒤집힘. 둘 다 transform/opacity 뿐 */
.v1-fl{position:absolute;left:var(--x,50%);top:var(--y,50%);width:calc(var(--sz,20px) * var(--fx-pk,1));height:calc(var(--sz,20px) * var(--fx-pk,1));
  transform:translate(-50%,-50%);opacity:0;
  animation:v1fly var(--dur,.92s) cubic-bezier(.12,.72,.26,1) var(--del,0s) both;
  will-change:transform,opacity;}
.v1-fl>svg{width:100%;height:100%;display:block;transform-origin:50% 50%;
  animation:v1spin var(--dur,.92s) linear var(--del,0s) both;}
@keyframes v1fly{
  0%{opacity:0;transform:translate(-50%,-50%) translate(0,0) scale(.18);}
  14%{opacity:1;}
  62%{opacity:1;transform:translate(-50%,-50%) translate(calc(var(--dx,0px)*.86),calc(var(--dy,0px)*.86 - 7px)) scale(1.08);}
  78%{opacity:1;}
  100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx,0px),calc(var(--dy,0px) + var(--drop,14px))) scale(.9);}}
@keyframes v1spin{
  0%{transform:rotate(var(--ra,0deg)) scaleX(1);}
  46%{transform:rotate(var(--rb,90deg)) scaleX(var(--flip,.5));}
  100%{transform:rotate(var(--rc,200deg)) scaleX(1);}}

/* 낱꽃잎·하트 파티클: div 하나로 비행+회전 */
.v1-lp{position:absolute;left:var(--x,50%);top:var(--y,50%);width:calc(var(--sz,10px) * var(--fx-pk,1));height:calc(var(--sz,10px) * var(--fx-pk,1));
  transform:translate(-50%,-50%);opacity:0;
  animation:v1lp var(--dur,.8s) cubic-bezier(.1,.7,.3,1) var(--del,0s) both;}
.v1-lp>svg{width:100%;height:100%;display:block;}
@keyframes v1lp{
  0%{opacity:0;transform:translate(-50%,-50%) translate(0,0) rotate(var(--ra,0deg)) scale(.2);}
  16%{opacity:1;}
  70%{opacity:1;}
  100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx,0px),calc(var(--dy,0px) + 16px)) rotate(var(--rc,360deg)) scale(1);}}

/* 불티·별빛: SVG 없이 gradient + clip-path 로만 */
.v1-sp{position:absolute;left:var(--x,50%);top:var(--y,50%);width:calc(var(--sz,7px) * var(--fx-pk,1));height:calc(var(--sz,7px) * var(--fx-pk,1));border-radius:50%;
  background:radial-gradient(circle,#fff 0 32%,var(--c,var(--gold)) 56%,rgba(255,255,255,0) 74%);
  box-shadow:0 0 6px var(--c,var(--gold));transform:translate(-50%,-50%);opacity:0;
  animation:v1sp var(--dur,.6s) cubic-bezier(.08,.72,.24,1) var(--del,0s) both;}
.v1-sp.st{border-radius:0;box-shadow:none;
  background:radial-gradient(circle,#fff 0 36%,var(--c,var(--gold)) 60%,rgba(255,255,255,0) 80%);
  clip-path:polygon(50% 0,60% 40%,100% 50%,60% 60%,50% 100%,40% 60%,0 50%,40% 40%);}
@keyframes v1sp{
  0%{opacity:0;transform:translate(-50%,-50%) translate(0,0) scale(.4);}
  12%{opacity:1;}
  100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx,0px),var(--dy,0px)) scale(var(--s2,.25)) rotate(var(--rc,0deg));}}

/* 중앙 광원 = 하트(원 아님). 가운데가 가장 옅고 0.56초에 사라져 빈칸 글자를 가리지 않는다 */
.v1-glow{position:absolute;left:var(--x,50%);top:var(--y,50%);width:var(--gw,110px);height:var(--gw,110px);
  transform:translate(-50%,-50%) scale(.34);opacity:0;
  animation:v1glow .56s cubic-bezier(.2,.8,.3,1) both;}
.v1-glow>svg{width:100%;height:100%;display:block;}
@keyframes v1glow{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.34) rotate(-5deg);}
  20%{opacity:1;}
  55%{opacity:.62;}
  100%{opacity:0;transform:translate(-50%,-54%) scale(1.62) rotate(3deg);}}

/* 5연속+ 하트 링(윤곽선만) */
.v1-ring{position:absolute;left:var(--x,50%);top:var(--y,50%);width:104px;height:104px;
  transform:translate(-50%,-50%) scale(.3);opacity:0;
  animation:v1ring .72s cubic-bezier(.2,.75,.25,1) both;}
.v1-ring>svg{width:100%;height:100%;display:block;}
@keyframes v1ring{0%{opacity:0;transform:translate(-50%,-50%) scale(.3);}
  15%{opacity:.9;}100%{opacity:0;transform:translate(-50%,-50%) scale(2.5);}}

/* 10연속+ 화면 가장자리 금빛 */
.v1-edge{position:absolute;inset:0;
  box-shadow:inset 0 0 58px 18px rgba(var(--gold-rgb),.50),inset 0 0 130px 44px rgba(var(--pink-rgb),.22);
  animation:v1edge .92s ease-out both;}

  width:calc(var(--sz,14px) * var(--fx-pk,1));height:calc(var(--sz,14px) * var(--fx-pk,1));color:var(--v6c,var(--gold));
  transform:translate(-50%,-50%);
  animation:v6twk var(--dur,.56s) ease-out var(--dly,0s) both;will-change:transform,opacity;}
@keyframes v6twk{
  0%{transform:translate(-50%,-50%) scale(.2) rotate(-30deg);opacity:0;}
  34%{opacity:1;transform:translate(-50%,-50%) translate(calc(var(--dx) * .5),calc(var(--dy) * .5)) scale(1.1) rotate(8deg);}
  100%{transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.34) rotate(46deg);opacity:0;}}
/* 불티 */
.v6-d{position:absolute;left:var(--x,50%);top:var(--y,50%);
  width:calc(var(--dsz,5px) * var(--fx-pk,1));height:calc(var(--dsz,5px) * var(--fx-pk,1));border-radius:50%;background:#fff;
  box-shadow:0 0 5px #fff,0 0 11px var(--v6c,var(--gold));
  transform:translate(-50%,-50%);
  animation:v6dot var(--dur,.58s) cubic-bezier(.1,.8,.3,1) var(--dly,0s) both;}
@keyframes v6dot{
  0%{transform:translate(-50%,-50%) scale(.9);opacity:1;}
  62%{opacity:.95;}
  100%{transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.15);opacity:0;}}
/* 금빛 리본(10연속부터): 얇게 돌며 떨어진다 */
.v6-rib{position:absolute;left:var(--x,50%);top:var(--y,50%);
  width:calc(3px * var(--fx-pk,1));height:calc(11px * var(--fx-pk,1));border-radius:2px;
  background:linear-gradient(180deg,#fff8dd,var(--gold) 42%,var(--gold2));
  transform:translate(-50%,-50%);
  animation:v6rib var(--dur,1s) cubic-bezier(.15,.75,.25,1) var(--dly,0s) both;
  will-change:transform,opacity;}
@keyframes v6rib{
  0%{transform:translate(-50%,-50%) rotate(0deg) scaleY(.4);opacity:0;}
  16%{opacity:1;}
  100%{transform:translate(-50%,-50%) translate(var(--dx),calc(var(--dy) + 26px)) rotate(var(--rot,540deg)) scaleY(1);opacity:0;}}
/* 링: 3연속 흰 링 / 6연속 금빛 점선 / 단계 진입(3·6·10·20·30·40) 분홍 파동 */
.v6-r{position:absolute;left:var(--x,50%);top:var(--y,50%);
  width:14px;height:14px;border-radius:50%;border:2.5px solid rgba(255,255,255,.92);
  transform:translate(-50%,-50%);animation:v6ring .58s ease-out var(--dly,0s) both;}
.v6-r.v6-r2{border:2px dashed var(--gold);}
.v6-r.v6-r3{border:2px solid var(--pink2);}
@keyframes v6ring{
  0%{width:14px;height:14px;opacity:.95;}
  100%{width:var(--rmax,190px);height:var(--rmax,190px);opacity:0;border-width:1px;}}
/* 중앙 광원 = 하트(원형 아님). 반투명이고 0.5초에 사라진다 */
.v6-glow{position:absolute;left:var(--x,50%);top:var(--y,50%);
  width:var(--gsz,104px);height:var(--gsz,104px);
  transform:translate(-50%,-50%);opacity:0;
  animation:v6glow .5s ease-out both;will-change:transform,opacity;}
@keyframes v6glow{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.3);}
  16%{opacity:var(--gop,.55);transform:translate(-50%,-50%) scale(.86);}
  46%{opacity:calc(var(--gop,.55) * .7);transform:translate(-50%,-50%) scale(1.14);}
  62%{opacity:calc(var(--gop,.55) * .82);transform:translate(-50%,-50%) scale(1.02);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(1.62);}}
/* 10연속+ : 큰 하트가 한 번 맥동. 선(stroke)뿐이라 글자를 덮지 않는다 */
.v6-pulse{position:absolute;left:var(--x,50%);top:var(--y,50%);
  width:88px;height:88px;transform:translate(-50%,-50%);
  animation:v6pulse .62s cubic-bezier(.2,.86,.28,1) .05s both;will-change:transform,opacity;}
@keyframes v6pulse{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.42);}
  18%{opacity:.9;}
  60%{opacity:.5;transform:translate(-50%,-50%) scale(2.1);}
  100%{opacity:0;transform:translate(-50%,-50%) scale(2.9);}}
/* 10연속+ : 화면 가장자리 금빛 (fxLayer 안이므로 UI에는 그림자가 생기지 않는다) */

  box-shadow:inset 0 0 54px 14px rgba(var(--gold-rgb),.5),inset 0 0 128px 44px rgba(var(--pink-rgb),.18);
  animation:v6edge .92s ease-out both;}
@keyframes v6edge{0%{opacity:0;}22%{opacity:1;}100%{opacity:0;}}
/* 결과 화면에서 틀린 단어를 지울 때(기존 fxHeart 호환) */
.v6-hpop{position:absolute;left:var(--x,50%);top:var(--y,50%);
  width:72px;height:72px;transform:translate(-50%,-50%) scale(.3);opacity:0;
  animation:v6hpop .82s cubic-bezier(.16,1,.3,1) both;
  filter:drop-shadow(0 0 8px rgba(255,255,255,.9));}
@keyframes v6hpop{
  0%{transform:translate(-50%,-50%) scale(.3);opacity:0;}
  26%{opacity:1;}
  62%{transform:translate(-50%,-50%) scale(1.45);opacity:.92;}
  100%{transform:translate(-50%,-50%) scale(1.8);opacity:0;}}
@media (prefers-reduced-motion:reduce){
  .v6-f,.v6-h,.v6-tw,.v6-d,.v6-rib{animation-duration:.4s;}
  .v6-edge,.v6-pulse{display:none;}
}

/* 3층-a · 빛살 부채 (conic-gradient 한 장, 링 마스크) */
.v3-fan{position:absolute;left:var(--x,50%);top:var(--y,50%);width:var(--sz,260px);height:var(--sz,260px);

/* 3층-b · 꽃 뒤를 지나가는 빛줄기 (filter 0개) */
.v3-ray{position:absolute;left:var(--x,50%);top:var(--y,50%);

  22%{opacity:.95;}
  100%{opacity:0;transform:rotate(var(--a,0deg)) translateX(var(--push,22px)) scaleX(1);}}

/* 4층 · 꽃 — 요소당 filter 1개(drop-shadow 1개) */
.v3-flower{position:absolute;left:var(--x,50%);top:var(--y,50%);width:calc(var(--sz,18px) * var(--fx-pk,1));height:calc(var(--sz,18px) * var(--fx-pk,1));
  transform:translate(-50%,-50%) scale(.2);opacity:0;
  filter:hue-rotate(var(--hr,0deg)) saturate(1.12) drop-shadow(0 0 5px var(--glow,var(--pink2)));

.v3-flower svg{width:100%;height:100%;display:block;}
@keyframes v3fly{
  0%{opacity:0;transform:translate(-50%,-50%) translate(0,0) scale(.2) rotate(0);}
  12%{opacity:1;transform:translate(-50%,-50%) translate(calc(var(--dx) * .18),calc(var(--dy) * .18)) scale(1.14) rotate(calc(var(--rot,0deg) * .2));}
  62%{opacity:1;}
  100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) scale(.74) rotate(var(--rot,0deg));}}

/* 5층 · 흰 불티 */
.v3-spark{position:absolute;left:var(--x,50%);top:var(--y,50%);width:calc(var(--sz,4px) * var(--fx-pk,1));height:calc(var(--sz,4px) * var(--fx-pk,1));

/* 6층 · 늦게 반짝이며 떨어지는 금빛 꽃가루 */
.v3-pollen{position:absolute;left:var(--x,50%);top:var(--y,50%);width:calc(var(--sz,4.5px) * var(--fx-pk,1));height:calc(var(--sz,4.5px) * var(--fx-pk,1));

/* 호환 · 날아가는 하트(v3fly 재사용) / 큰 하트 팝 */
.v3-heart{position:absolute;left:var(--x,50%);top:var(--y,50%);width:calc(var(--sz,20px) * var(--fx-pk,1));height:calc(var(--sz,20px) * var(--fx-pk,1));

/* 접근성 · 모션 최소화에서는 층을 걷고 한 번만 부드럽게 밝힌다 */
@media (prefers-reduced-motion:reduce){
  .v3-fan,.v3-ray,.v3-pollen,.v3-spark,.v3-wave{display:none;}
  .v3-flower,.v3-heart{animation-duration:.4s;}

/* ===== 정답 효과 새판: 큰 윤곽 하트 + 단계 개화 꽃 ===== */
#fxLayer{--fx-ha:1;--fx-fa:1;}
/* ===== shock · 하트 충격파 =====
   속 빈 얇은 하트 링 하나가 빈칸에서 폭발하듯 튀어나와 화면 밖으로 빠진다.
   fill 은 언제나 none. 반투명 채움·헤일로 원·큰 blur 덩어리 없음.
   선 두께 함정 해법:
     div 는 처음부터 큰 고정 크기(--shk-S)로 두고 scale 로만 키운다.
     scale 이 k 일 때 stroke-width 에 1/k 를 곱해 되돌린다 → 화면상 선 두께가 시종 일정.
     transform 키프레임과 stroke-width 키프레임을 같은 백분율·linear 로 맞춰 짝지었다.
     --shk-sw1/--shk-sw2 는 JS가 (원하는 화면px × 96 ÷ --shk-S) 로 계산해 넣는다. (viewBox 폭 96단위)
   애니메이트하는 것: transform / opacity / stroke-width 뿐. 레이아웃 유발 없음. */

.shock-ring{position:absolute;left:var(--shk-x,50%);top:var(--shk-y,50%);
  width:var(--shk-S,360px);height:calc(var(--shk-S,360px) * 0.927);
  transform:translate(-50%,-50%) rotate(var(--shk-tilt,0deg)) scale(.10);
  opacity:0;will-change:transform,opacity;
  animation:shock-fly var(--shk-dur,.56s) var(--shk-del,0s) linear both;
  filter:drop-shadow(0 0 5px rgba(255,124,196,.9)) opacity(var(--fx-ha,1));}
.shock-ring svg{width:100%;height:100%;display:block;overflow:visible;}

@keyframes shock-fly{
  0%  {transform:translate(-50%,-50%) rotate(var(--shk-tilt,0deg)) scale(.10);opacity:0;}
  3%  {transform:translate(-50%,-50%) rotate(var(--shk-tilt,0deg)) scale(.18);opacity:.7;}
  6%  {transform:translate(-50%,-50%) rotate(var(--shk-tilt,0deg)) scale(.27);opacity:1;}
  14% {transform:translate(-50%,-50%) rotate(var(--shk-tilt,0deg)) scale(.45);opacity:1;}
  25% {transform:translate(-50%,-50%) rotate(var(--shk-tilt,0deg)) scale(.63);opacity:.95;}
  40% {transform:translate(-50%,-50%) rotate(var(--shk-tilt,0deg)) scale(.78);opacity:.88;}
  58% {transform:translate(-50%,-50%) rotate(var(--shk-tilt,0deg)) scale(.89);opacity:.70;}
  78% {transform:translate(-50%,-50%) rotate(var(--shk-tilt,0deg)) scale(.96);opacity:.42;}
  100%{transform:translate(-50%,-50%) rotate(var(--shk-tilt,0deg)) scale(1);opacity:0;}}

/* 1/k 보정표 — 위 scale 값과 같은 백분율에 1:1 대응 (끝으로 갈수록 살짝 더 가늘게) */
.shock-ring .shock-a{animation:shock-w1 var(--shk-dur,.56s) var(--shk-del,0s) linear both;}
.shock-ring .shock-b{animation:shock-w2 var(--shk-dur,.56s) var(--shk-del,0s) linear both;}
@keyframes shock-w1{
  0%{stroke-width:calc(var(--shk-sw1) * 10);}    3%{stroke-width:calc(var(--shk-sw1) * 5.56);}
  6%{stroke-width:calc(var(--shk-sw1) * 3.70);}  14%{stroke-width:calc(var(--shk-sw1) * 2.18);}
  25%{stroke-width:calc(var(--shk-sw1) * 1.49);} 40%{stroke-width:calc(var(--shk-sw1) * 1.13);}
  58%{stroke-width:calc(var(--shk-sw1) * .90);}  78%{stroke-width:calc(var(--shk-sw1) * .75);}
  100%{stroke-width:calc(var(--shk-sw1) * .62);}}
@keyframes shock-w2{
  0%{stroke-width:calc(var(--shk-sw2) * 10);}    3%{stroke-width:calc(var(--shk-sw2) * 5.56);}
  6%{stroke-width:calc(var(--shk-sw2) * 3.70);}  14%{stroke-width:calc(var(--shk-sw2) * 2.18);}
  25%{stroke-width:calc(var(--shk-sw2) * 1.49);} 40%{stroke-width:calc(var(--shk-sw2) * 1.13);}
  58%{stroke-width:calc(var(--shk-sw2) * .90);}  78%{stroke-width:calc(var(--shk-sw2) * .75);}
  100%{stroke-width:calc(var(--shk-sw2) * .62);}}

/* 터지는 첫 순간의 못 — 작은 하트가 짧게 때리고 사라진다. 역시 속은 비었다 */
.shock-core{position:absolute;left:var(--shk-x,50%);top:var(--shk-y,50%);
  width:var(--shk-S,120px);height:calc(var(--shk-S,120px) * 0.927);
  transform:translate(-50%,-50%) scale(.30);opacity:0;will-change:transform,opacity;
  animation:shock-pop var(--shk-dur,.26s) linear both;
  filter:drop-shadow(0 0 6px rgba(255,255,255,.75)) opacity(var(--fx-ha,1));}
.shock-core svg{width:100%;height:100%;display:block;overflow:visible;}
@keyframes shock-pop{
  0%  {transform:translate(-50%,-50%) scale(.30);opacity:0;}
  15% {transform:translate(-50%,-50%) scale(.75);opacity:1;}
  55% {transform:translate(-50%,-50%) scale(1.25);opacity:.75;}
  100%{transform:translate(-50%,-50%) scale(1.75);opacity:0;}}
.shock-core .shock-a{animation:shock-cw1 var(--shk-dur,.26s) linear both;}
.shock-core .shock-b{animation:shock-cw2 var(--shk-dur,.26s) linear both;}
@keyframes shock-cw1{0%{stroke-width:calc(var(--shk-sw1) * 3.33);}15%{stroke-width:calc(var(--shk-sw1) * 1.33);}
  55%{stroke-width:calc(var(--shk-sw1) * .80);}100%{stroke-width:calc(var(--shk-sw1) * .57);}}
@keyframes shock-cw2{0%{stroke-width:calc(var(--shk-sw2) * 3.33);}15%{stroke-width:calc(var(--shk-sw2) * 1.33);}
  55%{stroke-width:calc(var(--shk-sw2) * .80);}100%{stroke-width:calc(var(--shk-sw2) * .57);}}

/* ===== bloomstep · 단계 개화 =====
   periodic-game animateBigBohr()의 껍질 구조를 꽃으로 옮긴다.
   가까운 고리 한 겹이 한꺼번에 "촹" 피고, 잠깐 뒤 다음 고리가 "촹".
   3중 중첩: 바깥=비행(translate/scale/rotate), 가운데=살랑(rotate±·translateX±), 안쪽=꽃잎 나부낌(scaleX±).
   transform·opacity만 애니메이트한다. drop-shadow는 바깥 한 겹뿐. */

.bloomstep-f{
  position:absolute;
  left:var(--bloomstep-x,50%);

   (영신: "목 왼쪽에 놓으면 바가 굳이 줄지 않아도 될 것 같다") 칸 안에 넣었다. 상태는 aria-pressed·레이블로도 알린다. */

.saved-search{grid-column:1/-1;min-width:0;}

.saved-search-form input::placeholder{color:var(--muted,var(--muted));opacity:1;}

.saved-search .saved-remove[aria-pressed="true"]{color:var(--gold,#ffd54f);}
.saved-search-more{display:block;margin:12px auto 0;}

<style id="milestones-style">
/* 외운 단어 돌파 축하. 빛 효과(플래시·세 색 고리·빛줄기·충격파)는 영신의 주기율표 게임(esqsoy/periodic-game) 연출을 옮겼다. */
.ms-fx{position:fixed;inset:0;z-index:80;display:grid;place-items:center;overflow:hidden;cursor:pointer;
  background:radial-gradient(circle at 50% 38%,#2a0e4a 0%,#14061f 55%,#08020f 100%);animation:msIn .3s ease both;}
.ms-canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
.ms-glory{position:absolute;left:50%;top:34%;width:220vmax;height:220vmax;transform:translate(-50%,-50%);opacity:0;pointer-events:none;
  background:repeating-conic-gradient(from 0deg,rgba(var(--gold-rgb),.16) 0deg 8deg,transparent 8deg 20deg);mix-blend-mode:screen;}
.ms-fx.popped .ms-glory{animation:msGloryIn 1.2s ease-out forwards,msSpin 14s linear infinite;}
.ms-light{position:absolute;inset:0;pointer-events:none;}
.ms-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:8px;width:min(92vw,520px);
  max-height:96dvh;text-align:center;transform:translateY(-2vh);}
.ms-inner::before{content:'';position:absolute;left:-12%;right:-12%;top:-4%;bottom:-4%;z-index:-1;pointer-events:none;
  background:radial-gradient(closest-side,rgba(12,3,24,.82),rgba(12,3,24,.55) 60%,transparent);}
.ms-fx.warp:not(.popped) .ms-inner::before{opacity:.45;}
.ms-num{line-height:.95;}
.ms-num b{display:block;font-size:clamp(4rem,24vw,8rem);font-weight:900;color:var(--gold,var(--gold));font-variant-numeric:tabular-nums;letter-spacing:.02em;
  text-shadow:0 0 18px #fff,0 0 36px var(--gold,var(--gold)),0 0 70px var(--pink,var(--pink)),6px 6px 0 var(--bg3);}
.ms-num.pop b{animation:msPop .9s cubic-bezier(.2,1.5,.4,1) both;}
.ms-title{font-size:clamp(1.6rem,8.5vw,2.5rem);font-weight:900;color:#fff;letter-spacing:.04em;opacity:0;
  text-shadow:0 0 12px var(--pink,var(--pink)),0 0 28px var(--pink,var(--pink)),3px 3px 0 var(--bg3);}
.ms-cat,.ms-line,.ms-sub,.ms-close{opacity:0;}
.ms-fx.popped .ms-title{animation:msRise .5s .15s cubic-bezier(.2,1.4,.4,1) both;}
.ms-fx.popped .ms-cat{animation:msRise .6s .45s cubic-bezier(.2,1.4,.4,1) both;}
.ms-fx.popped .ms-line{animation:msRise .5s .75s ease both;}
.ms-fx.popped .ms-sub,.ms-fx.popped .ms-close{animation:msRise .5s 1.6s ease both;}
.ms-cat img{display:block;width:min(28vw,120px);image-rendering:pixelated;
  filter:drop-shadow(0 0 12px #fff) drop-shadow(0 0 28px var(--gold,var(--gold))) drop-shadow(0 0 50px var(--pink,var(--pink)));}
.ms-line{background:rgba(24,8,42,.86);border:2px solid var(--line,var(--line));border-radius:14px;padding:10px 14px;max-width:100%;
  font-weight:800;line-height:1.5;color:#fff;word-break:keep-all;overflow-wrap:anywhere;box-shadow:0 0 24px rgba(var(--pink-rgb),.25);}
.ms-line .nm{color:var(--pink2,var(--pink2));font-weight:900;}
.ms-fx.warp .ms-sub{background:rgba(12,3,24,.88);padding:5px 12px;border-radius:10px;box-shadow:0 0 14px rgba(12,3,24,.9);}
.ms-fx.warp .ms-close{background:linear-gradient(180deg,rgba(var(--gold-rgb),.22),rgba(var(--pink-rgb),.18)),#1a0a2e;}
.ms-sub .gold{color:var(--gold,var(--gold));text-shadow:0 0 8px rgba(var(--gold-rgb),.6);}
.ms-fx.warp.popped .ms-inner::before{background:radial-gradient(closest-side,rgba(12,3,24,.9),rgba(12,3,24,.7) 60%,transparent);}
.ms-sub{font-size:.82rem;line-height:1.45;color:var(--muted,var(--muted));word-break:keep-all;}
.ms-close{margin-top:4px;min-height:48px;padding:0 26px;border-radius:999px;border:2px solid var(--gold2,var(--gold2));cursor:pointer;
  background:linear-gradient(180deg,rgba(var(--gold-rgb),.22),rgba(var(--pink-rgb),.18));color:#fff;font:inherit;font-weight:900;font-size:1rem;
  box-shadow:0 0 18px rgba(var(--gold-rgb),.35);}
.ms-close:focus-visible{outline:3px solid var(--cyan,var(--cyan));outline-offset:3px;}
/* 빛 폭발: 주기율표 게임의 fx-flash·fx-ring·fx-ray·shockwave */
.ms-flash{position:absolute;inset:0;background:radial-gradient(circle at var(--x,50%) var(--y,40%),rgba(255,255,255,.95),rgba(var(--pink-rgb),.5) 30%,transparent 65%);
  animation:msFlash .6s ease-out forwards;}
.ms-ring{position:absolute;left:var(--x,50%);top:var(--y,40%);width:30px;height:30px;border-radius:50%;border:6px solid var(--gold,var(--gold));transform:translate(-50%,-50%);
  box-shadow:0 0 30px var(--gold,var(--gold)),0 0 60px var(--pink,var(--pink)),inset 0 0 30px #fff;animation:msRing 1s ease-out forwards;}
.ms-ring.r2{border-color:var(--pink,var(--pink));animation-delay:.08s;animation-duration:1.1s;}
.ms-ring.r3{border-color:var(--cyan,var(--cyan));animation-delay:.16s;animation-duration:1.2s;}
.ms-ring.r4{border-color:#c399ff;animation-delay:.24s;animation-duration:1.3s;}
.ms-ring.r5{border-color:var(--mint,var(--mint));animation-delay:.32s;animation-duration:1.4s;}
.ms-ring.r6{border-color:#fff;animation-delay:.4s;animation-duration:1.5s;}
.ms-shock{position:absolute;left:var(--x,50%);top:var(--y,40%);width:20px;height:20px;border-radius:50%;border:6px solid var(--gold,var(--gold));
  transform:translate(-50%,-50%);animation:msShock 2.2s ease-out forwards;}
.ms-rays{position:absolute;left:var(--x,50%);top:var(--y,40%);width:0;height:0;animation:msSpin 5s linear infinite;}
.ms-ray{position:absolute;left:0;top:0;width:6px;height:0;transform-origin:50% 0;filter:blur(.5px);
  background:linear-gradient(180deg,#fff,rgba(var(--gold-rgb),.9) 30%,rgba(var(--pink-rgb),.6) 60%,transparent);animation:msRay 1.3s ease-out forwards;}
.ms-fx.popped .ms-inner{animation:msShake .5s .05s;}
@keyframes msIn{from{opacity:0}to{opacity:1}}
@keyframes msPop{0%{transform:scale(1)}18%{transform:scale(1.32)}40%{transform:scale(.94)}62%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes msRise{from{opacity:0;transform:translateY(10px) scale(.92)}to{opacity:1;transform:none}}
@keyframes msFlash{0%{opacity:0}15%{opacity:1}100%{opacity:0}}
@keyframes msRing{0%{width:20px;height:20px;opacity:1;border-width:8px}100%{width:140vmax;height:140vmax;opacity:0;border-width:1px}}
@keyframes msShock{0%{width:20px;height:20px;opacity:1;border-width:8px}100%{width:320vmax;height:320vmax;opacity:0;border-width:1px}}
@keyframes msRay{0%{height:0;opacity:1}50%{height:46vmax;opacity:1}100%{height:58vmax;opacity:0}}
@keyframes msSpin{to{transform:rotate(360deg)}}
@keyframes msGloryIn{from{opacity:0}to{opacity:.9}}
@keyframes msShake{0%,100%{transform:translateY(-2vh)}20%{transform:translate(-5px,calc(-2vh + 3px))}40%{transform:translate(5px,calc(-2vh - 3px))}60%{transform:translate(-4px,calc(-2vh + 2px))}80%{transform:translate(4px,calc(-2vh - 2px))}}
@media (prefers-reduced-motion:reduce){
  .ms-fx,.ms-fx *{animation:none!important;}
  .ms-fx .ms-title,.ms-fx .ms-cat,.ms-fx .ms-line,.ms-fx .ms-sub,.ms-fx .ms-close{opacity:1;}
  .ms-fx .ms-glory{opacity:.5;}
}
</style>
<style id="pace-style">
/* 진행 속도 예측 한 줄(결과 화면, 고양이 말풍선 바로 밑). 말풍선이 주인공이라 작고 흐리게 둔다. */
.pace-note{margin:-2px 4px 2px;color:var(--muted);font-size:.76rem;font-weight:700;line-height:1.5;text-align:center;letter-spacing:-.2px;word-break:keep-all;}
</style>
<style>
/* 발음고양 덧붙임 스타일. 보카고양 틀의 색(:root)을 그대로 쓰고, 소리는 청록(--cyan), 대상 기호는 금빛(--gold). */
@font-face{font-family:"Balum IPA";src:url("assets/fonts/BalumIPA-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Balum IPA";src:url("assets/fonts/BalumIPA-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
:root{--ipa-sag-fill:#4d2f6e;--ipa-sag-line:#a184c6;--ipa:"Balum IPA","Charis SIL","Doulos SIL","Gentium Plus",serif;--ipa-sans:"Balum IPA","Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;--ipa-cav:#2a1240;--ipa-tis:#3d2558;--ipa-tongue:#a4567c;--ipa-tooth:#f6e2ec}
#prevBtn{display:none!important}
.slot,.slot-glyph,.mt-source,.ov-ipa,.rv-inline-ipa{font-family:var(--ipa)}
.mt-source{color:var(--cyan)}
/* 강 이름·카드 뜻 줄에 p͈ 같은 부호가 섞여도 보이게: IPA 글꼴을 먼저, 한글은 틀 글꼴로 */
.lessonbtn .lname{font-family:var(--ipa-sans)}
.ipa-play{position:relative;z-index:3;width:44px;height:44px;border-radius:50%;border:2px solid var(--cyan);background:var(--panel2);color:var(--cyan);font-size:15px;display:inline-grid;place-items:center;cursor:pointer;flex:none}
.ipa-soon{position:relative;z-index:3;font-size:.72rem;color:var(--muted);font-weight:800}
.ipa-cardplay{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 10px;margin:2px 0 6px}
.ipa-cardplay .ipa-spk{order:5;flex-basis:100%;text-align:center}
.ipa-cardplay canvas{flex:1;min-width:0;max-width:220px;height:36px}
.ipa-learn{position:relative;z-index:3;text-align:left;font-size:.92rem;line-height:1.6;margin-bottom:8px}
.ipa-learn p{margin:6px 0 0}
.ipa-learn b{color:var(--pink2)}
.ipa-big{font-family:var(--ipa);font-size:64px;line-height:1.05;text-align:center;color:var(--cyan)}
/* 발음 용어: 한글 · 한자 · 영어 */
.ipa-name{text-align:center;line-height:1.35;margin:2px 0 6px}
.ipa-name b{display:block;color:#fff!important;font-size:1rem}
.ipa-hanja{display:block;color:var(--pinkpale);font-size:.86rem;letter-spacing:.06em}
.ipa-en{display:block;color:var(--muted);font-size:.78rem;font-style:italic}
.ipa-hz{color:var(--muted);font-weight:600}
.ipa-dex-in .ipa-name{text-align:left;margin:0 0 4px}
.ipa-term-h{font-family:inherit;font-size:1.25rem;letter-spacing:.04em}
.ipa-symplay{display:flex;justify-content:center;align-items:center;gap:8px;font-size:.78rem;color:var(--muted);font-weight:800}
.ipa-pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:8px}
.ipa-pair svg,.ipa-vot svg{width:100%;height:auto;display:block}
.ipa-pair i,.ipa-vot i{display:block;font-style:normal;font-size:.72rem;color:var(--muted);text-align:center;font-weight:700;margin-top:2px}
.ipa-vot{margin-top:6px}
.ipa-other{color:var(--muted);font-size:.82rem}
.ipa-exs{margin-top:8px;border-top:1px solid var(--line)}
.ipa-ex{display:grid;grid-template-columns:auto auto 1fr auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.ipa-lang{font-size:.7rem;color:var(--muted);font-weight:800}
.ipa-word{font-weight:900}
.ipa-tr{font-family:var(--ipa);color:var(--cyan)}
.ipa-tr b{color:var(--gold)!important;font-weight:700}
.ipa-code{text-align:center;color:var(--muted);font-weight:800}
.ipa-code b{color:var(--gold)!important;font-family:ui-monospace,monospace}
.ipa-code span{font-family:var(--ipa);color:var(--cyan)}
.ipa-puff{animation:ipaPuff 1.4s ease-out infinite}
@keyframes ipaPuff{0%{opacity:0;transform:translateX(0)}30%{opacity:1}100%{opacity:0;transform:translateX(-8px)}}
.ipa-vib{animation:ipaVib .12s linear infinite alternate}
@keyframes ipaVib{from{transform:translateX(-.6px)}to{transform:translateX(.6px)}}
/* IPA 지도: 주기율표 게임처럼 잠긴 칸이 다 보인다 */
.ipamap{overflow:hidden}
.ipa-map-wrap{padding:0 8px 8px;overflow-x:auto}
.ipa-grid{display:grid;grid-template-columns:50px repeat(11,minmax(24px,1fr));gap:2px;min-width:336px}
.ipa-col{font:inherit;font-size:.62rem;font-weight:900;color:var(--muted);text-align:center;line-height:1.1;background:none;border:0;padding:0;cursor:pointer}
.ipa-col small{display:block;font-size:.5rem;font-weight:700;opacity:.8;white-space:nowrap}
.ipa-rowh{font:inherit;font-size:.56rem;font-weight:800;color:var(--muted);display:flex;flex-direction:column;justify-content:center;align-items:flex-start;line-height:1.1;background:none;border:0;padding:0;text-align:left;cursor:pointer}
.ipa-col small.h,.ipa-rowh small.h{font-size:.5rem;font-weight:600;opacity:.75;letter-spacing:0;white-space:nowrap}
.ipa-cell{display:flex;align-items:center;justify-content:center;gap:1px;min-height:26px;border-radius:5px;background:rgba(255,255,255,.04);border:1px solid rgba(111,60,149,.55)}
.ipa-cell.empty{background:transparent;border-color:transparent}
.ipa-cell-s{font-family:var(--ipa);font-size:.9rem;line-height:1;background:none;border:0;padding:2px 1px;color:var(--line);cursor:pointer;min-width:11px}
.ipa-cell-s.on{color:var(--gold);text-shadow:0 0 6px rgba(255,211,77,.45)}
.ipa-cell-s.cur{color:var(--cyan);animation:ipaBlink 1.2s steps(2) infinite}
@keyframes ipaBlink{50%{opacity:.45}}
.ipa-dex{padding:0 13px 13px}
.ipa-dex-in{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;border:2px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--panel2);font-size:.82rem;line-height:1.5}
.ipa-dex-in em{color:var(--cyan);font-style:normal;font-weight:800}
.ipa-dex-sym{font-family:var(--ipa);font-size:2rem;color:var(--gold);min-width:1.6em;text-align:center}
.ipa-chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.ipa-chip{font-size:.7rem;font-weight:800;border:1px solid var(--line);border-radius:999px;padding:2px 8px;color:var(--pinkpale)}
@media (prefers-reduced-motion:reduce){.ipa-puff,.ipa-vib,.ipa-cell-s.cur{animation:none}}
/* 입 옆모습(CC0 단면도): 살은 --ipa-tis, 빈 곳은 --ipa-cav, 목청 선은 울리면 청록 */
.ipa-sag path{fill:var(--ipa-sag-fill);stroke:var(--ipa-sag-line);stroke-width:.5}
.ipa-sag .ipa-sag-glottis{fill:none;stroke:var(--muted);stroke-width:.9}
.ipa-sag .ipa-sag-glottis.on{stroke:var(--cyan);stroke-width:1.1}
.ipa-sag-gap{fill:var(--ipa-cav);stroke:var(--gold);stroke-width:.35}
.ipa-sag-at{fill:none;stroke:var(--gold);stroke-width:1.1}
.ipa-sag-gl{fill:none;stroke:transparent;stroke-width:1}
.ipa-sag-puff path{fill:none;stroke:var(--gold);stroke-width:1;stroke-linecap:round}
/* 여러 화자 */
.ipa-spk{position:relative;z-index:3;font-size:.68rem;color:var(--muted);font-weight:800;white-space:nowrap}
.ipa-explay{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.ipa-explay .ipa-spk{display:none}
/* 카드 위 작은 지도 */
.ipa-mini{position:relative;z-index:3;display:grid;width:max-content;grid-template-columns:repeat(11,6px);grid-template-rows:repeat(8,5px);gap:1px;flex:none;padding:3px;border:1px solid var(--line);border-radius:5px;background:rgba(0,0,0,.18);margin:0 auto}
.ipa-learn .ipa-mini{margin:2px auto 6px}
.ipa-mini i{display:block;border-radius:1px;background:rgba(255,255,255,.13)}
.ipa-mini i.e{background:transparent}
.ipa-mini i.cur{background:var(--cyan);animation:ipaBlink 1.2s steps(2) infinite}
.ipa-mini i.hit{background:var(--gold);box-shadow:0 0 4px var(--gold)}
/* 맞힘 그림: 닫기(0~1.0s) → 목청(0.45s~) → 터뜨림·바람(1.0s~) → 울림(소리 시작 띠에 따라) */
.ipa-anim{position:relative;z-index:3;display:grid;grid-template-columns:96px 1fr;gap:10px;align-items:center;margin:0 0 8px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--panel2)}
.ipa-anim-fig svg{width:96px;height:auto;display:block}
.ipa-steps{margin:0;padding-left:1.25em;font-size:.78rem;line-height:1.55;color:var(--pinkpale);text-align:left}
.ipa-steps li{opacity:.25;animation:ipaStep .3s ease-out forwards}
.ipa-steps li:nth-child(1){animation-delay:0s}.ipa-steps li:nth-child(2){animation-delay:.45s}.ipa-steps li:nth-child(3){animation-delay:1s}.ipa-steps li:nth-child(4){animation-delay:1.45s}
.vot-short .ipa-steps li:nth-child(4){animation-delay:1.05s}.vot-lead .ipa-steps li:nth-child(4){animation-delay:.1s}
@keyframes ipaStep{to{opacity:1;color:#fff}}
.ipa-anim .a-close{opacity:0;animation:ipaClose 2.2s ease forwards}
@keyframes ipaClose{0%{opacity:0}8%{opacity:1}44%{opacity:1}48%{opacity:0}100%{opacity:0}}
.ipa-anim.vot-cont .a-close{animation:none;opacity:1;stroke-dasharray:2 1.4}
.ipa-anim .a-glot{animation:ipaGlot 2.2s ease forwards}
@keyframes ipaGlot{0%,18%{stroke:transparent}24%,60%{stroke:var(--gold)}70%,100%{stroke:transparent}}
.ipa-anim .a-puff{opacity:0;animation:ipaPuffOnce 2.2s ease forwards}
@keyframes ipaPuffOnce{0%,46%{opacity:0;transform:translateX(0)}56%{opacity:1}80%{opacity:1;transform:translateX(5px)}100%{opacity:0;transform:translateX(7px)}}
.ipa-anim .ipa-sag-glottis{stroke:var(--muted);animation:ipaVoice 2.2s steps(1) forwards}
.ipa-anim.vot-lead .ipa-sag-glottis,.ipa-anim.vot-cont .ipa-sag-glottis{animation-name:ipaVoiceLead}
.ipa-anim.vot-short .ipa-sag-glottis{animation-name:ipaVoiceShort}
.ipa-anim.vot-long .ipa-sag-glottis{animation-name:ipaVoiceLong}
@keyframes ipaVoiceLead{0%{stroke:var(--cyan)}100%{stroke:var(--cyan)}}
@keyframes ipaVoiceShort{0%{stroke:var(--muted)}48%{stroke:var(--cyan)}100%{stroke:var(--cyan)}}
@keyframes ipaVoiceLong{0%{stroke:var(--muted)}68%{stroke:var(--cyan)}100%{stroke:var(--cyan)}}
@media (prefers-reduced-motion:reduce){.ipa-mini i.cur,.ipa-anim *{animation:none!important;opacity:1!important}}
/* 기호를 누르면 소리(재생 단추 없음, 26.11.08 영신) */
.ipa-tap{cursor:pointer;position:relative;z-index:3;border-radius:6px;text-decoration:underline dotted var(--cyan);text-underline-offset:4px;text-decoration-thickness:1px}
.ipa-tap:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.ipa-big .ipa-tap{text-decoration:none;display:inline-block;padding:0 .12em;border:2px dashed rgba(94,224,255,.35)}

.ipa-symhint{text-align:center;font-size:.72rem;color:var(--muted);font-weight:800;margin:-2px 0 4px}
.ipa-exn{font-size:.68rem;color:var(--muted);font-weight:800;text-align:right;white-space:nowrap}
.mt-source.ipa-tap{text-decoration:underline dotted var(--cyan);text-underline-offset:6px}
.ipa-cardplay canvas.ipa-tap{text-decoration:none}
/* 명칭 치기: 한글 ✓(한자) · 영어 ✓ */
.ipa-namecheck{position:relative;z-index:3;display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:6px 0 2px;font-size:.78rem;font-weight:800}
.ipa-namecheck span{border:1px solid var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.ipa-namecheck span.ok{border-color:var(--mint);color:var(--mint)}
.ipa-namecheck b{color:#fff;font-weight:700;letter-spacing:.05em;margin-left:2px}
.ipa-namecheck i{font-style:italic;color:#fff;font-weight:600}
/* 명칭 카드: 원문 줄(전사)의 빈칸에는 ?만, 친 이름은 아래 따로 된 줄에(전사 속에 긴 이름이 끼지 않게, 칸 수로 답이 새지 않게) */
#hoeCtx:has(.ipa-namecheck) .blanks:not(.revealed) .slot,#hoeCtx:has(.ipa-namecheck) .blanks:not(.revealed) .slot-word{display:none}
#hoeCtx:has(.ipa-namecheck) .blanks:not(.revealed)::before{content:"?";color:var(--gold);font-weight:900;border-bottom:3px solid var(--gold);padding:0 .25em}
.ipa-typed{position:relative;z-index:3;min-height:1.6em;margin:8px auto 0;max-width:330px;padding:4px 10px;border-bottom:2px solid var(--gold);color:var(--gold);font-weight:900;font-size:1.05rem;text-align:center;word-break:keep-all;overflow-wrap:anywhere}
.ipa-typed:empty::before{content:"이름을 친다(한글 + 영어)";color:var(--muted);font-weight:700;font-size:.82rem}
.ipa-typed .caret{display:inline-block;width:2px;height:1em;background:#fff;vertical-align:-2px;margin-left:2px;animation:ipaBlink 1s steps(2) infinite}
/* 이름 대기: 대표 낱말 줄 */
.ipa-nameq{position:relative;z-index:3;margin-bottom:6px}
.ipa-nameq .ipa-big{line-height:1.25;padding-bottom:.12em}
.ipa-nameq .ipa-mini{margin:4px auto 8px}
.ipa-reps{display:grid;gap:2px;max-width:320px;margin:0 auto;text-align:left}
.ipa-rep{display:grid;grid-template-columns:4.2em auto 1fr;gap:8px;align-items:baseline;padding:4px 2px;border-bottom:1px solid var(--line)}
/* 큰 IPA 표 */
.ipa-mini[data-zoom]{cursor:zoom-in}
.ipa-zoom{position:fixed;inset:0;z-index:9999;background:rgba(8,4,16,.78);display:flex;align-items:center;justify-content:center;padding:calc(12px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.ipa-zoom-in{width:min(760px,100%);max-height:100%;overflow:auto;background:var(--panel);border:2px solid var(--line);border-radius:16px;padding:10px 10px 12px}
.ipa-zoom-h{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 8px}
.ipa-zoom-x{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:var(--panel2);color:#fff;font-size:16px;cursor:pointer}
.ipa-zoom-grid{grid-template-columns:44px repeat(11,minmax(0,1fr));min-width:0;gap:2px}
.ipa-zoom-grid .ipa-cell{min-height:36px;gap:1px;flex-wrap:wrap}
.ipa-zoom-grid .ipa-col small{white-space:normal;word-break:keep-all}
@media (min-width:560px){.ipa-zoom-grid{grid-template-columns:60px repeat(11,minmax(0,1fr));gap:3px}.ipa-zoom-grid .ipa-cell{min-height:44px;gap:4px}.ipa-zs{font-size:1.4rem}}

.ipa-zs.on{color:var(--gold);opacity:1}
.ipa-zs.cur{color:var(--cyan);opacity:1}
.ipa-zs.hit{outline:2px solid var(--gold);opacity:1}
.ipa-zs.ipa-tap{text-decoration:underline dotted var(--cyan);text-underline-offset:3px}
.ipa-zoom-k{font-size:.74rem;color:var(--muted);line-height:1.5;margin:8px 4px 0}
.ipa-zoom-k span{font-weight:900;margin-right:8px}
.ipa-zoom-k .on{color:var(--gold)}.ipa-zoom-k .cur{color:var(--cyan)}.ipa-zoom-k .hit{color:#fff}
/* ---------- 배색(26.11.08 영신 "색상은 원래 보카고양이랑 달리가도 좋습니다 좀 더 보기좋은 배색을 찾아봅시다") ----------
   html[data-pal]로 갈아 끼운다. voca는 보카고양 그대로. 고양고양이 그림 색은 바꾸지 않는다(PRINCIPLES 1). */
html[data-pal="ink"]{--panel-rgb:17,21,48;--bg1-rgb:10,12,29;--bg1:#0a0c1d;--bg2:#121735;--bg3:#1a2050;--panel:#111530;--panel2:#181d3f;--line:#3a447e;--muted:#b9bfe2;--ink:#fff;
 --pink:#ff9f45;--pink2:#ffbe7d;--pinkpale:#fff0de;--pink-rgb:255,159,69;--cyan:#79c6ff;--cyansoft:#b4dcff;--cyan-rgb:121,198,255;
 --gold:#ffd86a;--gold2:#f2b51d;--gold-rgb:255,216,106;--mint:#8fe7aa;
 --ipa-cav:#0b0f2c;--ipa-tis:#262e5e;--ipa-tongue:#d98a62;--ipa-sag-fill:#28316a;--ipa-sag-line:#8f9bd8}
html[data-pal="sea"]{--panel-rgb:12,34,42;--bg1-rgb:5,22,27;--bg1:#05161b;--bg2:#0a2630;--bg3:#0f3440;--panel:#0c222a;--panel2:#112f38;--line:#2b5d68;--muted:#a8c8cd;--ink:#fff;
 --pink:#ff7c5c;--pink2:#ffa287;--pinkpale:#ffe7de;--pink-rgb:255,124,92;--cyan:#5fe4d1;--cyansoft:#a7eadf;--cyan-rgb:95,228,209;
 --gold:#ffd166;--gold2:#f2b400;--gold-rgb:255,209,102;--mint:#9ff0aa;
 --ipa-cav:#071d25;--ipa-tis:#1c4652;--ipa-tongue:#d27a6b;--ipa-sag-fill:#1e4f5a;--ipa-sag-line:#80b7bf}
html[data-pal="chalk"]{--panel-rgb:18,37,28;--bg1-rgb:14,28,22;--bg1:#0e1c16;--bg2:#14281f;--bg3:#1a3428;--panel:#12251c;--panel2:#172f24;--line:#3c6a55;--muted:#bdd7c9;--ink:#fff;
 --pink:#ff8d7b;--pink2:#ffb3a7;--pinkpale:#fff1ec;--pink-rgb:255,141,123;--cyan:#8fd8ff;--cyansoft:#c0e8ff;--cyan-rgb:143,216,255;
 --gold:#f6e27a;--gold2:#e5c632;--gold-rgb:246,226,122;--mint:#a9f0b9;
 --ipa-cav:#0c1a14;--ipa-tis:#24443a;--ipa-tongue:#d58b78;--ipa-sag-fill:#2a4a3d;--ipa-sag-line:#9ec5b0}
.ipa-pal{display:flex;align-items:center;justify-content:center;gap:8px;padding:0 13px 12px;font-size:.74rem;font-weight:800;color:var(--muted)}
.ipa-pal button{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;position:relative;z-index:3}
.ipa-pal button[aria-pressed="true"]{border-color:#fff;box-shadow:0 0 0 2px var(--pink)}

             공개 때는 같은 칸의 막대 위에 말풍선을 띄운다. 긴 대사는 머리줄 안에서 줄바꿈한다. -->

<script>
/* 발음고양 덧붙임. 보카고양 마더텅 틀(pipeline/frame.html) 앞에 넣는다(build.py).
   틀은 그대로 두고 여기서만 발음고양에 필요한 것을 더한다(PRINCIPLES 1-1, 탄고고양 日本語能力試験과 같은 방식).
   - 입력: ph → pʰ 같은 줄임을 IPA로 바꿔 읽는다(ipaIn). 자동 제출은 끈다.
   - 칸: 부호가 붙은 기호도 칸 하나(blankParts).
   - 카드 위: 배우기 그림(입 옆모습·목청·소리 시작 띠), 녹음 재생 단추(ipaBeforeCard / ipaAfterCard).
   - 처음 화면: 주기율표 게임처럼 잠긴 칸이 다 보이는 IPA 지도와 기호 도감(ipaRenderMap). */
const IPA_NO_AUTOSUBMIT = true;
/* 배색: 보는 사람마다 고른 것을 기억한다(브라우저 저장, 없으면 기본). 고양고양이 색은 안 바뀐다 */
const IPA_PALS = [['ink', '먹물·호박'], ['sea', '밤바다'], ['chalk', '칠판'], ['voca', '보카고양']];
const IPA_PAL_DEFAULT = 'ink';
function ipaPalGet() { try { return localStorage.getItem('ipagoyang-palette') || IPA_PAL_DEFAULT; } catch (e) { return IPA_PAL_DEFAULT; } }

  // 문제 카드: 원문 줄의 전사(틀의 .mt-source)와 파형을 누르면 그 낱말 소리
  const cp = root.querySelector('.ipa-cardplay');
  if (cp && w.audio !== undefined) {
    const l = ipaAudioList(w.wid, w.audio);
    if (l.length) {
      const start = +cp.dataset.start || 0;
      for (const el of [root.querySelector('.mt-source'), root.querySelector('.ipa-cardplay canvas')]) {
        if (!el) continue;
        el.dataset.list = l.join('|'); el.dataset.i = start; el.setAttribute('role', 'button'); el.setAttribute('tabindex', '0'); el.setAttribute('aria-label', '낱말 소리 듣기');
      }
    }
  }
  const cv = root.querySelector('.ipa-cardplay canvas');
  ipaTapBind(root, b => (b.closest('.ipa-ex, .ipa-learn') ? null : cv));
  // 두 전사·파형이 같은 차례를 쓰게 맞춘다
  const taps = [...root.querySelectorAll('.mt-source[data-list], .ipa-cardplay canvas[data-list]')];
  taps.forEach(t => t.addEventListener('click', () => taps.forEach(o => { if (o !== t) o.dataset.i = t.dataset.i; })));
  if (cv && cv.dataset.list) { const l = cv.dataset.list.split('|'); requestAnimationFrame(() => ipaWave(cv, l[(+cv.dataset.i || 0) % l.length], 0)); }
  const main = taps[0];
  if (!noAuto && w.listen && main) setTimeout(() => { ipaPlay(ipaBtnNext(main), cv); taps.forEach(o => { if (o !== main) o.dataset.i = main.dataset.i; }); }, 350);
  // 친 이름 줄과 맞음 표시는 원문 줄(전사) 아래로
  const ty = root.querySelector('#ipaTyped'), nc = root.querySelector('#ipaNameCheck');
  if (ty && nc && !root.querySelector('.ipa-learn')) root.append(ty, nc);
  ipaNameLive();
}

/* ---------- 카드 위 작은 지도(PRINCIPLES 8-9 ②) ----------
   문제를 푸는 동안에는 그 묶음의 칸들을 깜박인다(답 칸만 깜박이면 β/b처럼 줄이 다른 답이 새므로). 맞히면 답 칸이 금빛이 된다. */
function ipaCellOf(sym) {

function ipaSymOf(w) {

}
function ipaMiniMap(w, hit) {

  const h = hit ? ipaCellOf(hit) : null;
  let g = '';
  IPA_ROWS.forEach((row, r) => {
    let c = 0;
    for (const cell of row.cells) {
      const span = (cell && cell.span) || 1, k = r + ':' + c;
      const cls = !cell ? 'e' : (h && h.r === r && h.c === c) ? 'hit' : cur.has(k) ? 'cur' : '';
      g += `<i class="${cls}" style="grid-column:${c + 1}/span ${span};grid-row:${r + 1}"></i>`;
      c += span;
    }
  });
  return `<div class="ipa-mini" role="button" tabindex="0" data-zoom="${w.b}" data-hit="${ipaEsc(hit || '')}" aria-label="IPA 표 크게 보기">${g}</div>`;
}
/* 작은 지도를 누르면 실제 IPA 자음표를 크게(26.11.08 영신: "해당 부분을 누르면 실제 ipa표를 확대해서 볼 수 있게").
   기호는 다 보인다(답을 가리지 않음: 묶음 칸 전체를 함께 표시). 배운 칸 금빛, 지금 묶음 칸 청록, 맞힌 답 칸 테두리. 기호를 누르면 기호 소리. */
function ipaZoomOpen(lesson, hit) {
  const bd = (IPA.bundles || []).find(b => b.lesson === +lesson);
  const cur = new Set(bd ? bd.lit : []), {set} = ipaLearned(), h = hit ? ipaBase(hit) : '';
  const colh = (k, i) => { const t = ipaT(k); return `<span class="ipa-col">${i + 1}<small>${ipaEsc(t.short || t.ko.replace(/음$/, ''))}</small><small class="h">${ipaEsc(t.short_hanja || t.hanja || '')}</small></span>`; };
  let g = `<div class="ipa-grid ipa-zoom-grid"><span></span>${IPA_COLS.map(colh).join('')}`;
  for (const r of IPA_ROWS) {
    const t = ipaT(r.ko);
    g += `<span class="ipa-rowh"><span>${ipaEsc(t.ko)}</span><small class="h">${ipaEsc(t.hanja || '')}</small></span>`;
    for (const c of r.cells) {
      if (c === null) { g += `<span class="ipa-cell empty"></span>`; continue; }
      const span = c.span || 1, v = c.v || c;
      g += `<span class="ipa-cell" style="grid-column:span ${span}">${v.map(x => { const sy = IPA.symbols[x], snd = sy && sy.sound && ipaHasAudio(sy.sound) ? ipaTapAttrs(sy.sound, x + ' 소리') : ''; return `<span class="ipa-zs${set.has(x) ? ' on' : ''}${cur.has(x) ? ' cur' : ''}${x === h ? ' hit' : ''}"${snd}>${ipaEsc(x)}</span>`; }).join('')}</span>`;

  ov.innerHTML = `<div class="ipa-zoom-in"><div class="ipa-zoom-h"><b>IPA 자음표(폐 기류)</b><button type="button" class="ipa-zoom-x" aria-label="닫기">✕</button></div>
    <div class="ipa-map-wrap">${g}</div>
    <p class="ipa-zoom-k"><span class="on">배운 칸</span><span class="cur">지금 묶음</span>${h ? '<span class="hit">맞힌 답</span>' : ''} · 가로는 입 앞(1 입술)에서 목 안(11 성문), 세로는 소리 내는 방법. 칸에 둘이면 앞(왼쪽·위)이 무성, 뒤(오른쪽·아래)가 유성. 국제음성학회 IPA 표(2020, CC BY-SA 4.0)</p></div>`;

  ov.addEventListener('click', e => { if (e.target === ov || e.target.closest('.ipa-zoom-x')) close(); });
  document.addEventListener('keydown', esc, true);
  document.body.appendChild(ov);
  ipaTapBind(ov);
}
document.addEventListener('click', e => { const m = e.target.closest && e.target.closest('.ipa-mini[data-zoom]'); if (m) { e.preventDefault(); e.stopPropagation(); ipaZoomOpen(m.dataset.zoom, m.dataset.hit); } }, true);
document.addEventListener('keydown', e => { const m = e.target.closest && e.target.closest('.ipa-mini[data-zoom]'); if (m && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); ipaZoomOpen(m.dataset.zoom, m.dataset.hit); } }, true);

/* 맞히면 소리를 내는 차례대로 그림이 움직인다(PRINCIPLES 8-9 ①): 닫기 → 목청 → 터뜨림 → 울림.
   울림이 언제 시작하는지는 기호의 소리 시작 띠(vot) 값을 따른다: lead 처음부터, short 터뜨리자 바로, long 바람 뒤 */
const IPA_NEXT_MS = 2400;
function ipaOnCorrect(w) {
  const root = document.getElementById('hoeCtx'); const sym = ipaSymOf(w); const s = sym && IPA.symbols[sym];
  if (!root || !s) return;
  const mini = root.querySelector('.ipa-mini'); if (mini) mini.outerHTML = ipaMiniMap(w, sym);
  const bw = (IPA.byWord || {})[w.wid], sp = document.getElementById('catSpeech');
  if (bw && sp && !w.learn) { sp.textContent = bw; sp.hidden = false; }
  const where = {bilabial: '입술', alveolar: '혀끝·잇몸', dental: '혀끝·이'}[s.place] || '입';
  const gl = (IPA.glottis || {})[s.glottis] || '';
  const steps = s.vot
    ? [`${where} 닫기`, `목청: ${gl}`, '터뜨림', {lead: '울림(닫을 때부터)', short: '울림(바로)', long: '바람 뒤 울림'}[s.vot]]
    : [`${where} 좁히기`, '목청 울림', '틈으로 바람'];
  const el = document.createElement('div');
  el.className = `ipa-anim vot-${s.vot || 'cont'}`;
  el.innerHTML = `<div class="ipa-anim-fig">${ipaSagittal({...ipaSagOpts(s), anim: true})}</div><ol class="ipa-steps">${steps.map(t => `<li>${ipaEsc(t)}</li>`).join('')}</ol>`;
  root.prepend(el);
}

/* ---------- 처음 화면: IPA 지도(주기율표 게임처럼 잠긴 칸이 다 보이고, 익힌 칸에 불이 들어온다) ---------- */
/* 열·줄 이름은 IPA 표 한국어판(Commons, CC BY-SA 3.0)을 따르고, 한자·영어는 data/terms.json */
const IPA_COLS = ['양순음', '순치음', '치음', '치경음', '후치경음', '권설음', '경구개음', '연구개음', '구개수음', '인두음', '성문음'];
/* 국제음성학회 IPA 표(2020, CC BY-SA 4.0)의 폐 기류 자음. 치·치경·후치경이 한 칸인 줄은 span 3 */
const IPA_ROWS = [
  {ko:'파열음', cells:[['p','b'],null,{span:3,v:['t','d']},['ʈ','ɖ'],['c','ɟ'],['k','ɡ'],['q','ɢ'],null,['ʔ']]},
  {ko:'비음', cells:[['m'],['ɱ'],{span:3,v:['n']},['ɳ'],['ɲ'],['ŋ'],['ɴ'],null,null]},
  {ko:'전동음', cells:[['ʙ'],null,{span:3,v:['r']},null,null,null,['ʀ'],null,null]},
  {ko:'탄음', cells:[null,['ⱱ'],{span:3,v:['ɾ']},['ɽ'],null,null,null,null,null]},
  {ko:'마찰음', cells:[['ɸ','β'],['f','v'],['θ','ð'],['s','z'],['ʃ','ʒ'],['ʂ','ʐ'],['ç','ʝ'],['x','ɣ'],['χ','ʁ'],['ħ','ʕ'],['h','ɦ']]},
  {ko:'설측 마찰음', cells:[null,null,{span:3,v:['ɬ','ɮ']},null,null,null,null,null,null]},
  {ko:'접근음', cells:[null,['ʋ'],{span:3,v:['ɹ']},['ɻ'],['j'],['ɰ'],null,null,null]},
  {ko:'설측 접근음', cells:[null,null,{span:3,v:['l']},['ɭ'],['ʎ'],['ʟ'],null,null,null]},

function ipaLearned() {
  const set = new Set(), current = new Set();
  for (const b of IPA.bundles || []) {
    let done = false;
    try {
      const L = state.lessons.find(l => l.lesson === b.lesson);
      done = !!(L && visEx(L).length && visEx(L).every(e => getRec(L.id, e.title)?.completed));
    } catch (e) {}

  }
  return {set, current};
}
let ipaPick = null;
function ipaRenderMap() {
  const el = document.getElementById('ipaMap'); if (!el) return;
  const {set, current} = ipaLearned();
  const sym = v => {
    const on = set.has(v), cur = current.has(v);
    return `<button type="button" class="ipa-cell-s${on ? ' on' : ''}${cur ? ' cur' : ''}" data-s="${ipaEsc(v)}" aria-label="${ipaEsc(on ? v : '잠긴 칸')}">${on || cur ? ipaEsc(v) : '·'}</button>`;
  };
  const colh = (k, i) => { const t = ipaT(k); return `<button type="button" class="ipa-col" data-term="${ipaEsc(k)}" aria-label="${ipaEsc(t.ko + ' ' + (t.hanja || '') + ' ' + (t.en || ''))}">${i + 1}<small>${ipaEsc(t.short || t.ko.replace(/음$/, ''))}</small><small class="h">${ipaEsc(t.short_hanja || t.hanja || '')}</small></button>`; };
  const rowh = k => { const t = ipaT(k); return `<button type="button" class="ipa-rowh" data-term="${ipaEsc(k)}" aria-label="${ipaEsc(t.ko + ' ' + (t.hanja || '') + ' ' + (t.en || ''))}"><span>${ipaEsc(t.ko)}</span><small class="h">${ipaEsc(t.hanja || '')}</small></button>`; };
  let grid = `<div class="ipa-grid"><span></span>${IPA_COLS.map(colh).join('')}`;
  for (const r of IPA_ROWS) {
    grid += rowh(r.ko);
    for (const c of r.cells) {
      if (c === null) { grid += `<span class="ipa-cell empty"></span>`; continue; }
      const span = c.span || 1, v = c.v || c;
      grid += `<span class="ipa-cell" style="grid-column:span ${span}">${v.map(sym).join('')}</span>`;
