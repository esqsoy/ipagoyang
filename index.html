    <div class="ipa-map-wrap">${grid}</div>
    <div class="ipa-dex" id="ipaDex"></div>
    <div class="ipa-pal">배색 ${IPA_PALS.map(([k, n]) => `<button type="button" data-pal="${k}" aria-label="${n}" title="${n}" aria-pressed="${ipaPalGet() === k}"></button>`).join('')}</div>`;
  el.querySelectorAll('.ipa-pal button').forEach(b => b.onclick = () => ipaPalSet(b.dataset.pal));
  el.querySelectorAll('.ipa-cell-s').forEach(b => b.onclick = () => { ipaPick = b.dataset.s; ipaShowDex(); const sy = IPA.symbols[ipaPick]; if (sy && sy.sound && ipaHasAudio(sy.sound) && b.classList.contains('on')) ipaPlay(sy.sound); });
  el.querySelectorAll('[data-term]').forEach(b => b.onclick = () => ipaShowTerm(b.dataset.term));
  ipaShowDex();
}
function ipaShowDex() {
  const box = document.getElementById('ipaDex'); if (!box) return;
  const {set, current} = ipaLearned();
  const v = ipaPick || [...current][0] || [...set][0];
  if (!v) { box.innerHTML = ''; return; }
  const s = IPA.symbols[v];
  if (!(set.has(v) || current.has(v)) || !s) {
    box.innerHTML = `<div class="ipa-dex-in"><b class="ipa-dex-sym">??</b><span><span class="nm">고양고양이</span> 아직 잠긴 칸이라고양. 묶음에서 만나면 열린다고양.</span></div>`;
    return;
  }
  const words = (IPA.examples[v] || []).map(e => `<span class="ipa-chip">${ipaEsc(e.lang)} ${ipaEsc(e.text)}</span>`).join('');
  const snd = s.sound && ipaHasAudio(s.sound) ? ipaTapAttrs(s.sound, v + ' 기호 소리 듣기') : '';
  box.innerHTML = `<div class="ipa-dex-in"><b class="ipa-dex-sym"${snd}>${ipaEsc(v)}</b><span>${ipaNameHtml(s)}${set.has(v) ? '' : '<em>지금 묶음</em><br>'}${ipaEsc(s.how)}</span></div>${words ? `<div class="ipa-chips">${words}</div>` : ''}`;
  ipaTapBind(box);
}
function ipaShowTerm(k) {
  const box = document.getElementById('ipaDex'); if (!box) return;
  const t = ipaT(k);
  const extra = [t.native ? `고유어 ${ipaEsc(t.native)}` : '', t.note ? ipaEsc(t.note) : ''].filter(Boolean).join(' · ');
  box.innerHTML = `<div class="ipa-dex-in ipa-term"><b class="ipa-dex-sym ipa-term-h">${ipaEsc(t.hanja || '')}</b><span><b>${ipaEsc(t.ko)}</b><span class="ipa-en">${ipaEsc(t.en || '')}</span>${extra ? `<br><small>${extra}</small>` : ''}</span></div>`;
}

/* 철자 변형: 띄어쓰기 차이와 영국식 -ise. 26.10.15 아스트라 리뷰 T01: 전에는 단어 전체의 z를 s로 바꿔

function variantKey(s){return normalize(s).replace(/\s/g,"");}
// 단어 경계를 먼저 본다. 공백부터 지우면 in size까지 insize → insise로 잘못 바뀐다.
function zKey(s){return normalize(s).replace(/[a-z]+/g,w=>w.replace(/^([a-z]{3,}[iy])z(e|es|ed|er|ers|ing|ation|ations|ational|able)$/,"$1s$2")).replace(/\s/g,"");}
function isSpellingVariant(typed,term){
  const a=variantKey(typed),b=variantKey(term);

  const z=zKey(term);return a===b||(z!==b&&a===z);

  html+=esc(c.example.slice(last,start))+blankSlots(c.example.slice(start,end),c.example.slice(start,end));last=end;

/* 발음은 정답을 공개한 뒤에만 읽는다. 자료가 없는 항목도 영어 표기로 들을 수 있다. */
let pronunciationVoice=null,pronunciationVoiceName=null,pronunciationSeq=0,pronunciationWait=null;
function pronunciationSupported(){return false;}
function pronunciationVoiceScore(v){
  const name=v.name||"",lang=(v.lang||"").replace(/_/g,"-");
  if(!/^en(?:-|$)/i.test(lang))return -1;
  let score=/^en-US/i.test(lang)?40:20;
  const preferred=["Samantha","Google US English","Ava","Allison","Microsoft Aria","Microsoft Jenny","Microsoft Zira","Joanna","Nicky","Karen"];
  const i=preferred.findIndex(n=>name.indexOf(n)>=0);if(i>=0)score+=60-i*2;
  if(/female/i.test(name))score+=8;
  if(/\bmale\b|Alex|Daniel|Fred|Tom|Aaron|Arthur|Rishi|Oliver/i.test(name))score-=20;
  if(/compact|eloquence|novelty|Albert|Bells|Boing|Bubbles|Cellos|Jester|Junior|Organ|Ralph|Superstar|Trinoids|Whisper|Wobble|Zarvox/i.test(name))score-=40;
  if(v.localService)score+=6;return score;
}
function pickPronunciationVoice(){try{
  const voices=window.speechSynthesis.getVoices()||[];
  const american=voices.filter(v=>/^en-US(?:-|$)/i.test((v.lang||"").replace(/_/g,"-")));
  const candidates=american.length?american:voices;
  if(pronunciationVoiceName){const keep=candidates.find(v=>v.name===pronunciationVoiceName);if(keep)return keep;}
  let best=null,score=-1;for(const voice of candidates){const value=pronunciationVoiceScore(voice);if(value>score){best=voice;score=value;}}
  if(best)pronunciationVoiceName=best.name;return best;
}catch(e){return null;}}
function stopPronunciation(cancelSpeech=true){
  ipaEffectCancel();
  pronunciationSeq++;clearInterval(pronunciationWait);pronunciationWait=null;
  if(cancelSpeech&&window.speechSynthesis)try{window.speechSynthesis.cancel();}catch(e){}
}
function pronunciationEntry(term,meaning,originalMeaning){
  const word=mtCurrentWord(),original=originalMeaning||(word?.term===term?word.originalMeaning:meaning);
  const entry=MT_PRONUNCIATIONS[term]||{},specific=entry.meanings&&(entry.meanings[meaning]||entry.meanings[original]);
  return specific?{...entry,label:undefined,alternatives:undefined,...specific}:entry;
}
function fmtIpa(ipa){return ipaEffectStressMarkup(ipa);}

function pronunciationMarkup(term,meaning){
  const entry=pronunciationEntry(term,meaning);
  const ipa=[entry,...(Array.isArray(entry.alternatives)?entry.alternatives:[])].filter(p=>p.ipa)
    .map(p=>(p.label?esc(p.label)+" ":"")+"["+fmtIpa(p.ipa)+"]").join(" · ");
  if(!ipa)return "";
  return pronunciationSupported()?'<button type="button" class="ov-ipa rv-inline-ipa" aria-label="'+esc(term)+' 발음 듣기">'+ipa+'</button>':'<span class="ov-ipa rv-inline-ipa">'+ipa+'</span>';
}
function pronunciationEffectInfo(term,meaning,useAudio=true){
  const entry=pronunciationEntry(term,meaning);if(!entry.ipa)return null;
  const alternatives=Array.isArray(entry.alternatives)?entry.alternatives.filter(p=>p.ipa):[];
  return {term,ipa:entry.ipa,speech:entry.speech||term,
    forceWhole:!!entry.label||alternatives.length>0||(!!entry.speech&&entry.speech!==term&&!(useAudio&&exceptionAudioEntry(pronunciationAudioInfo(term,meaning))))||mtNeedsWholePronunciation(mtCurrentWord()),
    displayIpa:[entry,...alternatives].map(p=>p.ipa).join(' · ')};
}
function pronunciationAudioInfo(term,meaning,originalMeaning){
  const entry=pronunciationEntry(term,meaning,originalMeaning);
  // A card displaying several unresolved pronunciations has no single clip.
  if(Array.isArray(entry.alternatives)&&entry.alternatives.some(p=>p.ipa))return null;
  return {term,ipa:entry.ipa};
}
function speakPronunciation(term,meaning){
  const session=state.session,id=session&&session.currentId;
  if(!session||id===null||!session.answered||session.words[id]?.term!==term||!screens.game.classList.contains("active"))return;
  stopPronunciation();const seq=pronunciationSeq;
  const current=()=>seq===pronunciationSeq&&state.session===session&&session.currentId===id&&session.answered&&screens.game.classList.contains("active");
  const effectCurrent=()=>current()&&!session.copyMode;
  const info=session.copyMode?null:pronunciationEffectInfo(term,meaning);
  if(state.muted){ipaEffectSilent(info,effectCurrent);return;}
  const stillRevealed=()=>current()&&!state.muted;
  const effect=ipaEffectRequest(info,()=>effectCurrent()&&!state.muted);
  const text=pronunciationEntry(term,meaning).speech||term;
  const say=()=>{if(!stillRevealed())return;try{
    const utterance=new window.SpeechSynthesisUtterance(text);
    utterance.lang=pronunciationVoice?.lang||"en-US";utterance.rate=.88;
    if(pronunciationVoice)utterance.voice=pronunciationVoice;
    ipaEffectAttach(utterance,effect);
    window.speechSynthesis.speak(utterance);
  }catch(e){ipaEffectCancel();}};
  const native=()=>{
    if(!stillRevealed())return;
    if(!pronunciationSupported()){ipaEffectSilent(info,effectCurrent);return;}
    // If audio failed, restore the contextual TTS overlay on the same run.
    if(effect)effect.info=pronunciationEffectInfo(term,meaning,false);
    pronunciationVoice=pickPronunciationVoice();
    if(pronunciationVoice){say();return;}
    // A late voice list cannot revive speech after the learner changes cards.
    try{const prime=new window.SpeechSynthesisUtterance(" ");prime.lang="en-US";prime.volume=0;window.speechSynthesis.speak(prime);}catch(e){}
    let tries=0;pronunciationWait=setInterval(()=>{
      if(!stillRevealed()){clearInterval(pronunciationWait);pronunciationWait=null;return;}
      pronunciationVoice=pickPronunciationVoice();
      if(pronunciationVoice||++tries>=12){clearInterval(pronunciationWait);pronunciationWait=null;say();}
    },100);
  };
  if(!exceptionAudioPlay(pronunciationAudioInfo(term,meaning),effect,stillRevealed,native))native();
}

function fmt(ms){const s=Math.max(0,Math.floor(ms/1000));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function limitFor(term){
  const letters=term.replace(/[^a-zA-Z]/g,"").length;
  const words=term.trim().split(/\s+/).filter(Boolean).length;
  return Math.min(45,Math.max(14,Math.round(8+letters*1.6+Math.max(0,words-1)*4)));
}
function normalize(v){
  return v.toLowerCase().replace(/[’‘`´]/g,"'").replace(/[‐‑‒–—−]/g,"-")
    .replace(/&/g," and ").replace(/[~().,!?;:"“”\[\]{}]/g," ").replace(/['’]/g,"")
    .replace(/[-/]/g," ").replace(/\s+/g," ").trim();
}
function isCorrect(inp,ans){
  const g=normalize(inp),t=normalize(ans);if(!g||!t)return false;
  return g===t||g.replace(/\s/g,"")===t.replace(/\s/g,"");
}
function shuffle(a){const c=[...a];for(let i=c.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[c[i],c[j]]=[c[j],c[i]];}return c;}

function abandonPerfectRun(){
  const s=state.session;
  if(s&&s.lesson?.kind!=="saved"&&!s.partial&&!s.perfectRunSettled)state.perfectStreak=0;

function completePerfectRun(s,first){
  if(s.lesson?.kind==="saved")return 0;
  if(s.perfectRunSettled)return s.perfectRunCount;
  s.perfectRunSettled=true;
  if(s.partial){s.perfectRunCount=0;return 0;}
  const perfect=s.errors===0&&first===100&&s.words.length>0;
  state.perfectStreak=perfect?(state.perfectStreak||0)+1:0;
  s.perfectRunCount=state.perfectStreak;
  return s.perfectRunCount;
}

function startExercise(i){

  state.session={

    words:ex.words.map((w,id)=>({...w,id,attempts:0,corrects:0,errors:0,
      firstWrong:false,wrongEver:false,roundStreak:0,needed:1,passed:false})),
    round:0,roundName:"",queue:[],roundTargets:[],currentId:null,

function startRound(n){
  const s=state.session;s.round=n;
  if(n===1){
    // 1회독: 전체 단어, 순서대로, 1회 정답이면 통과
    s.words.forEach(w=>{w.roundStreak=0;w.passed=false;w.needed=1;});
    s.roundName="1회독";
    s.roundTargets=s.words.map(w=>w.id);
    s.queue=[...s.roundTargets];
  } else {
    // 2회독 이후: "틀린 적 있고(wrongEver) 아직 통과 못 한" 단어만 대상.
    // -> 한 번도 안 틀린 단어, 이미 2연속 맞혀 통과한 단어는 절대 다시 나오지 않음.
    const targets=s.words.filter(w=>w.wrongEver && !w.passed).map(w=>w.id);
    if(!targets.length){ return finishExercise(); }   // 더 굳힐 단어 없으면 종료

function submit(opt={}){
  const s=state.session;if(!s||s.currentId===null)return;
  if(state.composing&&!opt.timeout&&!opt.forced)return;
  if(s.copyMode){submitCopy();return;}
  if(s.answered)return;
  const w=s.words[s.currentId];
  const typed=ipaIn($("#ainput").value);
  if(!typed.trim()&&!opt.forced&&!opt.timeout&&Date.now()-s.cardStart<400)return;
  let correct=!opt.forced&&!opt.timeout&&isCorrect(typed,w.term);
  let variantHit=false;
  if(!correct&&!opt.forced&&!opt.timeout&&typed.trim()&&isSpellingVariant(typed,w.term)){correct=true;variantHit=true;}

  s.answered=true;s.revealedAt=Date.now();s.fbMode=true;s.attempts++;w.attempts++;
  // first-try accuracy
  if(!s.seenSet.has(w.id)){s.seenSet.add(w.id);s.firstSeen++;if(correct&&s.hintLevel===0&&!opt.timeout)s.firstCorrect++;}
  $("#submitBtn").disabled=true;$("#hintBtn").disabled=true;

  if(correct){
    w.corrects++;$("#ainput").classList.add("ok");
    const combo=(s.streak||0)+1;applyCorrect(w);fx(true,combo);beep("ok",combo);setCat('quizCat','win');
    const passed=w.passed;
    const line= variantHit ? ("‘"+typed.trim()+"’도 맞다고양! 근데 이 책은 ‘"+w.term+"’로 쓴다고양 ✦")
      : (passed ? ((s.streak||0)>=3?pick(LINES.correctStreak):pick(LINES.correct)) : "정답이라고양! 한 번 더 가자고양.");
    showReveal("good",w.term,w.meaning,line);if(typeof ipaOnCorrect==='function')ipaOnCorrect(w);
    s.streak=(s.streak||0)+1;
    scheduleNext(typeof IPA_NEXT_MS==='number'?IPA_NEXT_MS:1500);
  } else {
    s.errors++;w.errors++;w.wrongEver=true;s.streak=0;
    if(s.round===1)w.firstWrong=true;
    applyWrong(w);fx(false);beep("bad");
    setCat('quizCat',(opt.timeout&&!typed.trim()&&CAT.blank)?'blank':(opt.timeout&&CAT.sour)?'sour':CAT.rage?'rage':'evil');
    let wline=opt.timeout?pick(LINES.timeout):pick(LINES.wrong);
    if(!opt.timeout&&isSynonymMiss(typed,w))wline=pick(SYNLINES).replace("{w}",typed.trim());
    startCopy(w.term,w.meaning,wline);
  }
  updateStats();
}
function applyCorrect(w){const s=state.session;if(s.round===1){w.passed=true;return;}
  w.roundStreak++;if(w.roundStreak>=w.needed)w.passed=true;else defer(w.id);}
function applyWrong(w){const s=state.session;if(s.round===1)return;w.roundStreak=0;w.needed=2;defer(w.id);}
function defer(id){const s=state.session;s.queue.splice(Math.min(3,s.queue.length),0,id);}

function answerInputActive(){const s=state.session;return !!(s&&s.currentId!==null&&(!s.answered||s.copyMode)&&$("#gameScreen").classList.contains("active"));}
function hasHangul(v){return /[\u1100-\u11ff\u3130-\u318f\uac00-\ud7af]/.test(v);}
function composingKey(e){return state.composing||e.isComposing||e.keyCode===229;}

function handleCopyInput(){const s=state.session;if(!s||!s.copyMode)return;const v=ipaIn($("#ainput").value);renderCopyBlank(v);if(!state.composing&&isCorrect(v,s.copyAns)){$("#ainput").oninput=null;submitCopy();}}
function mirrorTyped(options={}){
  const s=state.session;if(!s||s.answered||s.copyMode||s.currentId===null)return;
  const wrap=$("#hoeCtx .blanks");if(!wrap)return;const w=s.words[s.currentId],raw=ipaIn($("#ainput").value);
  wrap.innerHTML=blankSlots(w.term,raw);
  if(state.composing||hasHangul(raw))return;
  // '=' and accented letters remain significant in the original MT grader.
  // Check the normalized length as well so punctuation cannot trigger an early miss.
  const entered=normalize(raw).replace(/\s/g,""),target=normalize(w.term).replace(/\s/g,"");

}
function blankPartsOriginal(value){
  const clean=String(value||"").replace(/[^A-Za-z\u00c0-\u024f0-9=&\u1100-\u11ff\u3130-\u318f\uac00-\ud7af\s]/g,"");
  let chars="",pending=false;const breaks=new Set();
  for(const c of clean){if(/\s/.test(c)){pending=chars.length>0;continue;}if(pending)breaks.add(chars.length);chars+=c;pending=false;}
  if(pending)breaks.add(chars.length);
  return {chars,breaks,spaced:/\s/.test(clean.trimStart())};
}
function blankSlots(answer,typed="",copy=false){
  const expected=blankParts(answer),entered=blankParts(typed),n=expected.chars.length||3;
  const breaks=new Set([...expected.breaks].filter(i=>!entered.spaced||i>=entered.chars.length));
  for(const i of entered.breaks)breaks.add(i);
  const punctuation=new Map();let letters=0;
  for(const c of String(answer||"")){
    if(ipaIsBase(c))letters++;else if(ipaIsMark(c)){}
    else if(!/\s/.test(c))punctuation.set(letters,(punctuation.get(letters)||"")+c);
  }
  const mark=i=>punctuation.has(i)?`<span class="slot-punctuation${copy?" shown":""}" aria-hidden="true">${esc(punctuation.get(i))}</span>`:"";
  const words=[];let word=mark(0),start=0;
  for(let i=0;i<Math.max(n,entered.chars.length);i++){
    if(i>start&&breaks.has(i)){words.push(word);word="";start=i;}
    const c=entered.chars[i]||"",target=expected.chars[i]||"";
    const cls=copy?(c?(c.toLowerCase()===target.toLowerCase()?" ok":" x"):" gh"):(i>=n?" over":"");
    const letter=(copy||/[=&]/.test(target))&&!c?target:c;
    word+=`<span class="slot${cls}${i===entered.chars.length?" cur":""}"><span class="slot-glyph">${esc(letter)}</span></span>${mark(i+1)}`;
  }
  if(word)words.push(word);
  return words.map(w=>`<span class="slot-word">${w}</span>`).join(" ");
}
function slots(answer){return `<span class="blanks">${blankSlots(answer)}</span>`;}

function growCard(fill){
  const card=$("#quizCard");if(!card){fill();return;}
  const h0=card.getBoundingClientRect().height;
  card.style.height="";card.style.transition="";
  fill();
  const h1=card.getBoundingClientRect().height;
  if(Math.abs(h1-h0)<8)return;                 /* 티 안 나는 변화는 그냥 둔다 */
  if(window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  card.style.height=h0+"px";
  void card.offsetHeight;                       /* 리플로우를 강제해 시작점을 박는다 */
  /* 곡선 비교 실측(한 프레임 최대 이동): cubic-bezier(.22,.7,.3,1) 40px ·

     ease-in-out이 계단이 가장 고르다(1,3,6,8,11,13,15,17,17,18). */
  card.style.transition="height .3s ease-in-out";
  card.style.height=h1+"px";
  clearTimeout(card._growT);
  card._growT=setTimeout(()=>{card.style.transition="";card.style.height="";},330);
}
function openReveal(kind){const card=$("#quizCard");card.classList.add(kind);$("#qmini").style.display="none";$("#timeWrap").style.visibility="hidden";const rv=$("#reveal");rv.className="rv show";
  /* scrollTo(0)은 아래로 스크롤해 둔 상태에서 화면을 통째로 튕긴다. 카드가 이미 보이면 건드리지 않는다 */

function giveHint(){
  const s=state.session;if(!s||s.currentId===null||s.answered||s.copyMode||s.hintLevel>=1||state.composing||$("#hintBtn").disabled)return;
  const answer=s.words[s.currentId].term,input=$("#ainput"),typed=input.value;
  const letter=/[A-Za-z\u00c0-\u024f0-9]/,first=[...answer].findIndex(c=>letter.test(c));if(first<0)return;
  let tail=0;while(tail<typed.length&&!/[A-Za-z\u00c0-\u024f0-9\u1100-\u11ff\u3130-\u318f\uac00-\ud7af]/.test(typed[tail]))tail++;
  if(tail<typed.length)tail++;
  input.value=answer.slice(0,first+1)+typed.slice(tail);
  const caret=input.value.length;if(input.selectionStart!==caret||input.selectionEnd!==caret)input.setSelectionRange(caret,caret); // 끝이 아닐 때만 옮긴다(iOS는 옮길 때마다 화면을 끈다)

function updateStats(){
  const s=state.session;if(!s)return;
  $("#sTime").textContent=fmt(Date.now()-s.totalStart);
  $("#sErr").textContent=s.errors;

  const done=roundDone(),total=s.roundTargets.length||s.words.length;

  $("#gProg").style.width=(total?Math.round(done/total*100):0)+"%";
  if(!s.fbMode&&s.currentId!==null&&!s.opening){
    const left=remain();const pct=Math.max(0,left/s.cardLimit*100);
    const tw=$("#timeWrap");$("#timeFill").style.width=pct+"%";
    tw.className="timewrap"+(pct<25?" danger":(pct<50?" warn":""));
    if(left<=0)submit({timeout:true});
  } else {$("#timeFill").style.width="100%";$("#timeWrap").className="timewrap";}
}
function remain(){const s=state.session;if(!s||s.fbMode)return 0;
  return Math.max(0,Math.ceil(s.cardLimit-(Date.now()-s.cardStart)/1000));}
function roundDone(){const s=state.session;if(!s)return 0;
  if(s.round===1)return s.roundTargets.length-s.queue.length-(s.answered||s.currentId===null?0:1);

function finishExercise(){

  const timeMs=Date.now()-s.totalStart;
  const first=s.firstSeen?Math.round(s.firstCorrect/s.firstSeen*100):0;
  setRec(s.lesson.id,s.exercise.title,{timeMs,attempts:s.attempts,errors:s.errors,first});
  // lesson fully cleared?
  const lessonCleared=visEx(s.lesson).every(e=>getRec(s.lesson.id,e.title)?.completed);
  const allCleared=s.lesson.kind!=="saved"&&clearedExercises()>=totalExercises();
  $("#sumSub").textContent=`${s.lesson.id} · ${s.exercise.title}`;
  $("#sumTime").textContent=fmt(timeMs);$("#sumAtt").textContent=s.attempts;
  $("#sumErr").textContent=s.errors;$("#sumFirst").textContent=first+"%";$("#sumHint").textContent=s.hints||0;
  let line=pick(LINES.exerciseDone),expr='evil';
  if(s.lesson.kind==="saved"){$("#sumTitle").textContent="모아둔 카드 복습 끝 ✦";}
  else if(allCleared){line=pick(LINES.allDone);expr='win';$("#sumTitle").textContent="묶음 완주! 지도에 칸이 켜졌다 ✦";}
  else if(lessonCleared){const _cnt=visEx(s.lesson).reduce((a,e)=>a+e.words.length,0);line=_cnt+"개 단어를 다 확인했다고양! "+(LESSONCLEAR[s.lesson.lesson]||"한 강을 통째로 정복했다고양!");expr='win';$("#sumTitle").textContent=s.lesson.id+" 완전 정복!";}
  else $("#sumTitle").textContent="연습 클리어 ✦";

  $("#sumWrong").innerHTML=wrong.length?`<div class="wh">틀린 단어 ${wrong.length}개</div>`+wrong.map(w=>`<button type="button" class="wrow" data-id="${w.id}"><b>${esc(w.term)}</b><span>${esc(w.meaning)}</span><i>${w.errors}회</i></button>`).join(""):`<div class="wh ok">틀린 단어 없음 ✦</div>`;
  
  setCat('sumCat',expr);

  renderHome();renderExList();show("sum");

}

function beep(t,combo){if(state.muted)return;try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();

    if(v[1]<0){t=(LY0-y)/v[1];if(t<k)k=t;} else if(v[1]>0){t=(LY1-y)/v[1];if(t<k)k=t;}

      s.style.setProperty("--bloomstep-swd",FXt(150+R()*90).toFixed(0)+"ms");
      s.style.setProperty("--bloomstep-del",FXt(rDel+i*intra)+"ms");

      p.style.setProperty("--bloomstep-fdl",FXt(rDel+i*intra+Math.round(R()*60))+"ms");
      p.innerHTML=pool[(idx+poff)%pool.length];

      s.appendChild(p);f.appendChild(s);layer.appendChild(f);

function burst(layer,x,y,o){
  var R=Math.random;
  var mk=function(cls,html){var d=document.createElement("div");d.className=cls;
    d.style.setProperty("--x",x+"px");d.style.setProperty("--y",y+"px");

  /* 중앙 하트는 여기서 만들지 않는다 — 부르는 쪽(fx·fxHeart)이 딱 한 번 얹는다.
     BURSTS[0].fn이 burst를 감싼 함수라 "합본이면 건너뛰기" 같은 가드가 안 먹어
     하트가 두 겹씩 깔렸다(실측 [285,285]). 호출 지점을 하나로 모아 막는다. */
  /* 3층 — 꽃: 종류는 콤보 단계로, 색은 분홍에서 시작해 단계마다 넓어진다 */

     겹이 바깥일수록 멀리·크게 → 콤보가 오르면 꽃 크기 중앙값이 저절로 올라간다.
     예전 코드는 콤보가 오를수록 작은 종이 섞여 오히려 작아졌다. */
  stepFlowerFX(layer,x,y,o);

  for(var j=0;j<D;j++){var dd=mk("dot");var aa=Math.PI*2*j/D+(R()-.5)*.8,dd2=(40+R()*70)*dist;
    dd.style.setProperty("--dx",Math.cos(aa)*dd2+"px");dd.style.setProperty("--dy",Math.sin(aa)*dd2+"px");

  if(o.edge)mk("edge");

  var H=o.hearts||0;for(var k=0;k<H;k++){var hd=mk("pt",F_PHEART);

    var ha=Math.PI*2*k/H+Math.PI/H,hr=(60+R()*60)*dist;

function v1Pool(c){

/* burstV1(layer,x,y,o) — o: {petals,dots,dist, combo,loose, ring,edge,flash,hearts,heart}
   petals=꽃 송이 수(0~40), dots=불티 수(~20), dist=퍼짐 배수, combo=희귀종·광원 크기 판단용(없으면 petals)

function burstV1(layer,x,y,o){
  o=o||{};if(!layer)return 0;
  var sp=v1Warm();if(sp.parentNode!==layer)layer.appendChild(sp);
  var F=Math.max(0,Math.min(40,Math.round(o.petals||0)));
  var c=Math.max(1,Math.round(o.combo||F||1));
  var dist=o.dist||1,rnd=Math.random,i;
  var pool=v1Pool(c),pk=c>=12?6:5,pst=pk===6?5:3;
  var L=(o.loose!=null)?Math.min(14,o.loose):Math.max(0,8-Math.round(F*.55));
  var S=Math.min(20,Math.round(o.dots||0));
  var H=Math.min(12,Math.round(o.hearts||0));
  var boost=F<=2?1.55:F<=5?1.22:F<=12?1.06:1;
  var mk=function(cls,inner){var d=document.createElement("div");d.className=cls;
    d.style.setProperty("--x",x+"px");d.style.setProperty("--y",y+"px");
    if(inner)d.innerHTML=inner;layer.appendChild(d);return d;};
  var uz=function(id,vb){return '<svg viewBox="'+vb+'" aria-hidden="true"><use href="#'+id+'"/></svg>';};
  var V=function(d,n,v){d.style.setProperty(n,v);};
  if(o.flash!==false){var g=mk("v1-glow",uz("v1-glow","0 0 100 100"));V(g,"--gw",Math.round(94+Math.min(40,c)*.95)+"px");}
  if(o.ring)mk("v1-ring",uz("v1-hring","0 0 100 100"));
  for(i=0;i<L;i++){
    var k=(i*pst+1)%pk,d=mk("v1-lp",uz("v1-lp-"+k,"0 0 16 16"));
    var a=-Math.PI/2+Math.PI*2*i/Math.max(3,L)+(rnd()-.5)*.8,dd=(36+rnd()*54)*dist;
    V(d,"--sz",(7.5+rnd()*5).toFixed(1)+"px");
    V(d,"--dx",(Math.cos(a)*dd).toFixed(1)+"px");V(d,"--dy",(Math.sin(a)*dd*.9-8).toFixed(1)+"px");
    V(d,"--ra",(rnd()*360-180).toFixed(0)+"deg");V(d,"--rc",((rnd()<.5?-1:1)*(220+rnd()*260)).toFixed(0)+"deg");
    V(d,"--dur",(.66+rnd()*.22).toFixed(2)+"s");V(d,"--del",((i%3)*.02).toFixed(2)+"s");
  }

    var kk=(i*pst)%pk,fl=mk("v1-fl",uz("v1-"+sn+"-"+kk,"0 0 32 32")),lay=i%2;
    var ang=(F<=3)?(-Math.PI/2+(i-(F-1)/2)*.9+(rnd()-.5)*.3):(-Math.PI/2+Math.PI*2*i/F+(rnd()-.5)*.5);
    var dd2=(56+lay*38+rnd()*44)*dist;
    var r0=rnd()*360-180,sg=rnd()<.5?-1:1,amt=130+rnd()*210;
    V(fl,"--sz",Math.min(28,(13+rnd()*8)*boost-lay*1.2).toFixed(1)+"px");
    V(fl,"--dx",(Math.cos(ang)*dd2).toFixed(1)+"px");
    V(fl,"--dy",(Math.sin(ang)*dd2*.88-10).toFixed(1)+"px");
    V(fl,"--drop",(10+rnd()*20).toFixed(0)+"px");
    V(fl,"--ra",r0.toFixed(0)+"deg");V(fl,"--rb",(r0+sg*amt*.46).toFixed(0)+"deg");V(fl,"--rc",(r0+sg*amt).toFixed(0)+"deg");
    V(fl,"--flip",(.24+rnd()*.5).toFixed(2));
    V(fl,"--dur",(.82+rnd()*.2).toFixed(2)+"s");V(fl,"--del",((i%3)*.012).toFixed(3)+"s");
  }
  for(i=0;i<H;i++){
    var kh=i%2?1:0,dh=mk("v1-lp",uz("v1-hp-"+kh,"0 0 24 24"));
    var ah=-Math.PI/2+Math.PI*2*i/Math.max(3,H)+(rnd()-.5)*.5,dh2=(52+rnd()*54)*dist;
    V(dh,"--sz",(14+rnd()*8).toFixed(1)+"px");
    V(dh,"--dx",(Math.cos(ah)*dh2).toFixed(1)+"px");V(dh,"--dy",(Math.sin(ah)*dh2*.9-16).toFixed(1)+"px");
    V(dh,"--ra",(rnd()*40-20).toFixed(0)+"deg");V(dh,"--rc",(rnd()*70-35).toFixed(0)+"deg");
    V(dh,"--dur",(.8+rnd()*.2).toFixed(2)+"s");
  }
  for(i=0;i<S;i++){

    V(ds,"--c",V1PAL[ks].g);
    var as=-Math.PI/2+Math.PI*2*i/Math.max(3,S)+(rnd()-.5)*.9,dss=(42+rnd()*76)*dist;

    V(ds,"--dx",(Math.cos(as)*dss).toFixed(1)+"px");V(ds,"--dy",(Math.sin(as)*dss-6).toFixed(1)+"px");
    V(ds,"--s2",(.2+rnd()*.4).toFixed(2));V(ds,"--rc",(rnd()*180-90).toFixed(0)+"deg");
    V(ds,"--dur",(.42+rnd()*.2).toFixed(2)+"s");V(ds,"--del",((i%4)*.015).toFixed(3)+"s");
  }
  if(o.heart)mk("v1-pop",uz("v1-hbig","0 0 100 100"));
  if(o.edge)mk("v1-edge");
  return 1100;
}

function burstV2(layer,x,y,o){

let v4T=null,v4uid=0;
function v4Tpl(){
  if(v4T)return v4T;
  const t=h=>{const e=document.createElement("template");e.innerHTML=h;return e;};
  let ph="";for(let i=0;i<6;i++)ph+='<i class="v4-pt" style="--pa:'+(i*60)+'deg">'+v4PetalSVG()+'</i>';
  v4T={hero:t(ph+'<i class="v4-core">'+v4CoreSVG()+'</i>'),
       rich:t(v4FlowerSVG(true)),lite:t(v4FlowerSVG(false)),
       star:t(v4StarSVG()),heart:t(v4HeartSVG()),hring:t(v4HeartRingSVG())};
  return v4T;}

function burstV4(layer,x,y,o){
  o=o||{};const T=v4Tpl(),R=Math.random,uid=++v4uid,dist=o.dist||1,UP=-Math.PI/2;
  const mk=(cls,key)=>{const d=document.createElement("div");d.className=cls;
    d.style.setProperty("--x",x+"px");d.style.setProperty("--y",y+"px");
    if(key)d.appendChild(T[key].content.cloneNode(true));
    layer.appendChild(d);return d;};
  const xy=(d,a,r,lift)=>{d.style.setProperty("--dx",(Math.cos(a)*r).toFixed(1)+"px");
    d.style.setProperty("--dy",(Math.sin(a)*r*.88-(lift||0)).toFixed(1)+"px");};

  /* 1) 중앙 광원(하트) + 하트 윤곽 */
  if(o.flash){mk("v4-glow").innerHTML=v4HeartGlowSVG("v4hg"+uid);}
  if(o.ring)mk("v4-hring","hring");

  /* 2) 꽃: 앞 2~3송이는 꽃잎 개별요소(히어로), 나머지는 1요소 통짜 */
  const P=Math.max(0,Math.min(40,o.petals|0));
  const hero=P<=2?P:(P<=8?3:2);
  for(let i=0;i<P;i++){
    const isHero=i<hero;
    const a=UP+Math.PI*2*(i+(i&1)*.5)/Math.max(1,P)+(R()-.5)*(P>6?.5:.9);
    const rad=(44+R()*30+P*.95)*dist;
    const d=isHero?mk("v4-fl","hero"):mk(i<18?"v4-bl":"v4-bl v4-lite",i<18?"rich":"lite");
    const h=(V4_HUES[i%V4_HUES.length]+R()*14-7+360)%360;
    d.style.color=v4hsl(h,70);
    d.style.setProperty("--v4g",v4hsl(h,64));
    xy(d,a,rad,10);
    d.style.setProperty("--v4rot",(R()*54-27).toFixed(1)+"deg");
    d.style.setProperty("--v4ps",(8+R()*14).toFixed(1)+"deg");
    if(isHero){
      d.style.setProperty("--v4s",(.82+R()*.18).toFixed(3));
      d.style.setProperty("--v4dur",(.94+R()*.12).toFixed(3)+"s");
      d.style.setProperty("--v4d",(i*.045+R()*.03).toFixed(3)+"s");
    }else{
      d.style.setProperty("--sz",(15+R()*8).toFixed(1)+"px");
      d.style.setProperty("--v4s",(.88+R()*.14).toFixed(3));
      d.style.setProperty("--v4dur",(.82+R()*.14).toFixed(3)+"s");
      d.style.setProperty("--v4d",(i/Math.max(1,P)*.17+R()*.05).toFixed(3)+"s");
    }
  }

  /* 3) 불티(꽃가루) */
  const D=Math.max(0,Math.min(18,o.dots|0));
  for(let i=0;i<D;i++){const d=mk("v4-dot");
    xy(d,UP+Math.PI*2*(i+.5)/Math.max(1,D)+(R()-.5)*.9,(30+R()*62)*dist,4);
    d.style.setProperty("--v4g",v4hsl(V4_HUES[i*3%V4_HUES.length],66));
    d.style.setProperty("--sz",(2.4+R()*2.4).toFixed(1)+"px");
    d.style.setProperty("--v4dur",(.42+R()*.14).toFixed(3)+"s");
    d.style.setProperty("--v4d",(R()*.08).toFixed(3)+"s");}

  /* 4) 반짝임(제자리 점멸, 이동 없음) */
  const W=o.tw==null?Math.min(8,2+Math.round(P/5)):Math.max(0,Math.min(10,o.tw|0));
  for(let i=0;i<W;i++){const d=mk("v4-tw","star");
    xy(d,R()*Math.PI*2,(26+R()*74)*dist,6);
    d.style.setProperty("--sz",(9+R()*8).toFixed(1)+"px");
    d.style.setProperty("--v4dur",(.44+R()*.16).toFixed(3)+"s");
    d.style.setProperty("--v4d",(.06+R()*.46).toFixed(3)+"s");}

  /* 5) 하트 파티클 / 가장자리 금빛 / 중앙 하트 팝(결과화면 호환) */
  const H=Math.max(0,Math.min(14,o.hearts|0));
  for(let i=0;i<H;i++){const d=mk("v4-heart","heart");
    xy(d,UP+Math.PI*2*(i+.5)/Math.max(1,H),(52+R()*54)*dist,16);
    d.style.setProperty("--sz",(15+R()*9).toFixed(1)+"px");
    d.style.setProperty("--v4rot",(R()*50-25).toFixed(1)+"deg");
    d.style.setProperty("--v4dur",(.86+R()*.16).toFixed(3)+"s");
    d.style.setProperty("--v4d",(i*.03+R()*.05).toFixed(3)+"s");}
  if(o.edge)mk("v4-edge");
  if(o.heart)mk("v4-hpop","heart");
}

function v6Tier(c){return c>=10?3:c>=6?2:c>=3?1:0;}
/* 콤보 → 옵션. 단계마다 파티클 구성·색폭·타이밍이 달라진다 */
function v6Opts(combo){
  /* P(꽃 수)만 바닥 8로 올린다. 단계 t는 실제 콤보 c로 계산해 서사는 그대로 둔다. */
  const c=Math.max(1,Math.floor(combo||1)),t=v6Tier(c),P=Math.min(40,Math.max(8,c)),dense=P>=26;
  return {
    tier:t,
    petals:P,
    dots:P<=2?4+2*P:P<=9?6+P:P<=25?16:8,
    dist:1+Math.min(16,c)*.045,
    flash:true,
    gsz:92+Math.min(9,c)*4,
    gop:t>=3?.7:t>=1?.58:.48,
    ring:t>=1,ring2:t>=2,
    wave:c===3||c===6||c===10||c===20||c===30||c===40,
    hearts:t>=2?(dense?5:Math.min(8,2+Math.floor((c-6)/3))):0,
    twinkles:t>=2?Math.min(dense?3:6,1+Math.floor((c-6)/4)):0,
    ribbons:t>=3?(dense?5:Math.min(8,2+Math.floor((c-10)/4))):0,
    edge:t>=3,pulse:t>=3,
    hueFrom:t>=3?326:t>=2?320:t>=1?330:336,
    hueSpan:t>=3?330:t>=2?190:t>=1?92:24,
    kinds:t>=2?3:t>=1?2:1
  };
}
/* 진입점. layer에 append, (x,y)는 화면 좌표(px), o는 옵션 객체 */
function burstV6(layer,x,y,o){
  o=o||{};
  const P=Math.max(0,o.petals||0),tier=o.tier!=null?o.tier:v6Tier(P),dense=P>=26;
  const rnd=Math.random;
  const mk=(cls,html,vars)=>{
    const d=document.createElement("div");d.className=cls;
    d.style.setProperty("--x",x+"px");d.style.setProperty("--y",y+"px");
    if(vars)for(const k in vars)d.style.setProperty(k,vars[k]);
    if(html)d.innerHTML=html;
    layer.appendChild(d);return d;};
  /* 1) 중앙 하트 광원 (0.5초, 반투명) */
  if(o.flash!==false)mk("v6-glow",v6GlowSVG(),{"--gsz":(o.gsz||100)+"px","--gop":String(o.gop||.55)});
  /* 2) 링: 3연속부터 흰 링, 6연속부터 금빛 점선이 하나 더, 단계 진입에는 분홍 파동 */
  if(o.ring)mk("v6-r",null,{"--rmax":(170+Math.min(60,P*2))+"px"});
  if(o.ring2)mk("v6-r v6-r2",null,{"--rmax":(215+Math.min(70,P*2))+"px","--dly":".07s"});
  if(o.wave)mk("v6-r v6-r3",null,{"--rmax":"272px","--dly":".13s"});
  /* 3) 꽃: 콤보 수만큼. 단계가 오를수록 종류와 색폭이 늘어난다 */
  const kinds=o.kinds||(tier>=2?3:tier>=1?2:1),
        hueFrom=o.hueFrom!=null?o.hueFrom:336,hueSpan=o.hueSpan!=null?o.hueSpan:24,
        dist=o.dist||1,
        smin=P<=2?19:P<=9?15:P<=25?13:11,svar=P<=2?9:P<=9?8:7;
  for(let i=0;i<P;i++){
    const k=kinds===1?0:i%kinds,
          svg=k===0?V6_ROSE:k===1?V6_BLOOM:V6_SAKURA,
          h=Math.round((hueFrom+(P<2?0:i/P*hueSpan)+rnd()*10)%360),
          a=(P===1?-Math.PI/2:P===2?-Math.PI/2+(i ? .62 : -.62):-Math.PI/2+Math.PI*2*i/P+(i%2?.2:-.2))+(rnd()-.5)*.45,
          r=(62+rnd()*68)*dist,
          d=mk("v6-f",svg,{
            "--sz":(smin+rnd()*svar).toFixed(1)+"px",
            "--v6c":"hsl("+h+",92%,66%)",
            "--dx":(Math.cos(a)*r).toFixed(1)+"px",
            "--dy":(Math.sin(a)*r-(12+rnd()*14)).toFixed(1)+"px",
            "--sag":(10+rnd()*14).toFixed(1)+"px",
            "--rot":Math.round(rnd()*300-150)+"deg",
            "--dur":((tier>=2?.8:.72)+rnd()*.2).toFixed(2)+"s",
            "--dly":(i/Math.max(1,P)*.06).toFixed(3)+"s"});
    /* 꽃이 적을 때만 빛번짐 1개(모바일 사파리에서 40송이 동시 필터를 피한다) */
    if(P<=12)d.style.filter="drop-shadow(0 0 4px rgba(255,255,255,.85))";
  }
  /* 4) 불티 */
  const D=Math.max(0,o.dots||0);
  for(let i=0;i<D;i++){
    const a=Math.PI*2*i/D+(rnd()-.5)*.8,r=(34+rnd()*62)*dist;
    mk("v6-d",null,{
      "--dsz":(3.5+rnd()*2.5).toFixed(1)+"px",
      "--v6c":i%3===0?"#ff8ac6":i%3===1?"#ffd34d":"#5ce6ff",
      "--dx":(Math.cos(a)*r).toFixed(1)+"px",
      "--dy":(Math.sin(a)*r-6).toFixed(1)+"px",
      "--dur":(.5+rnd()*.14).toFixed(2)+"s",
      "--dly":(rnd()*.05).toFixed(3)+"s"});
  }
  /* 5) 하트 꽃가루: 6연속부터. 위로 더 떠오르고 조금 느리다 */
  const H=Math.max(0,o.hearts||0);
  for(let i=0;i<H;i++){
    const a=-Math.PI/2+Math.PI*2*(i+.5)/H+(rnd()-.5)*.4,r=(52+rnd()*54)*dist;
    mk("v6-h",V6_PETALHEART,{
      "--sz":(dense?13:15+rnd()*7).toFixed(1)+"px",
      "--v6c":"hsl("+Math.round(322+rnd()*26)+",96%,70%)",
      "--dx":(Math.cos(a)*r).toFixed(1)+"px",
      "--dy":(Math.sin(a)*r-(24+rnd()*16)).toFixed(1)+"px",
      "--sag":"6px",
      "--rot":Math.round(rnd()*70-35)+"deg",
      "--dur":(.92+rnd()*.12).toFixed(2)+"s",
      "--dly":(.04+rnd()*.06).toFixed(3)+"s"});
  }
  /* 6) 반짝 별: 6연속부터, 중앙 가까이서 짧게 */
  const T=Math.max(0,o.twinkles||0);
  for(let i=0;i<T;i++){
    const a=rnd()*Math.PI*2,r=(28+rnd()*54)*dist;
    mk("v6-tw",V6_TWINKLE,{
      "--sz":(11+rnd()*6).toFixed(1)+"px",
      "--v6c":i%2?"#ffd34d":"#ff8ac6",
      "--dx":(Math.cos(a)*r).toFixed(1)+"px",
      "--dy":(Math.sin(a)*r).toFixed(1)+"px",
      "--dur":(.48+rnd()*.12).toFixed(2)+"s",
      "--dly":(.1+rnd()*.22).toFixed(3)+"s"});
  }
  /* 7) 금빛 리본: 10연속부터 */
  const R=Math.max(0,o.ribbons||0);
  for(let i=0;i<R;i++){
    const a=-Math.PI/2+Math.PI*2*i/R+(rnd()-.5)*.6,r=(70+rnd()*76)*dist;
    mk("v6-rib",null,{
      "--dx":(Math.cos(a)*r).toFixed(1)+"px",
      "--dy":(Math.sin(a)*r-18).toFixed(1)+"px",
      "--rot":Math.round(420+rnd()*300)+"deg",
      "--dur":(.9+rnd()*.14).toFixed(2)+"s",
      "--dly":(rnd()*.06).toFixed(3)+"s"});
  }
  /* 8) 10연속+: 큰 하트가 한 번 맥동 + 화면 가장자리 금빛 */
  if(o.pulse)mk("v6-pulse",V6_PULSE);
  if(o.edge)mk("v6-edge");
  /* 9) 기존 호환: 결과 화면에서 큰 하트 팝 */
  if(o.heart)mk("v6-hpop",V6_BIGHEART);
}
/* ── 적용(기존 fx 안의 두 줄만 교체) ─────────────────────────
   기존: const o={petals:Math.min(40,c),dots:...,flash:true,ring:c>=5,edge:c>=10,dist:...};
         burst(layer,x,y,o);
   교체: burstV6(layer,x,y,v6Opts(c));
   결과 화면 fxHeart도 burst → burstV6 로 교체 가능:
         burstV6(layer,x,y,{heart:true,hearts:7,dots:8,ring:true,flash:true,dist:1.2,tier:2});
   정리 타이머는 1300ms면 충분하다(가장 늦게 끝나는 파티클 1.14초). */
/* ===== 꽃 v3 · 하트 광휘의 층 ===== */
/* ===== v3 · 빛과 색의 층 =====
   붙일 곳: vocagoyangfable.html 의 heartGlowSVG()/burst() 근처(1428~1495행대) 아무 곳.
   연결: fx() 안의  burst(layer,x,y,o);  →  burstV3(layer,x,y,o);  한 줄만 바꾸면 된다.
   (fxHeart() 의 burst(...) 도 그대로 burstV3 로 바꿔도 동작한다 — heart/hearts 옵션 지원)
   기존 burst/roseSVG/heartGlowSVG 는 건드리지 않으므로 다른 안과 공존한다.        */
let v3uid=0;
/* 색 전략: 360° 전체 회전 대신 "어두운 보라 위에서 또렷한 여덟 색 아크"만 돈다
   (금 45 · 호박 32 · 분홍 330 · 핫핑크 342 · 마젠타 312 · 바이올렛 278 · 시안 196 · 민트 158) */
const V3_HUES=[45,32,330,342,312,278,196,158];
const V3_BASEH=335;                      /* 꽃 원본색이 분홍(#ff4fa3) 계열 */
const V3_HPATH='M50 86 C19 64 9 47 9 32 C9 19 19 11 30.5 11 C39.5 11 46.5 16 50 23.5 C53.5 16 60.5 11 69.5 11 C81 11 91 19 91 32 C91 47 81 64 50 86 Z';
/* 꽃 마크업은 최초 1회만 만들어 캐시한다(40송이 × 문자열 생성 비용 제거) */
const V3_FLOWER=(function(){var p='',k;
  for(k=0;k<6;k++)p+='<ellipse cx="12" cy="5.7" rx="3.2" ry="6.3" fill="#ff4fa3" transform="rotate('+(k*60)+' 12 12)"/>';
  for(k=0;k<5;k++)p+='<ellipse cx="12" cy="8.2" rx="2.5" ry="4.2" fill="#ff8ac6" transform="rotate('+(k*72+26)+' 12 12)"/>';
  return '<svg viewBox="0 0 24 24" aria-hidden="true">'+
    '<g stroke="#fff" stroke-width=".5" stroke-opacity=".8">'+p+'</g>'+
    '<circle cx="12" cy="12" r="2.9" fill="#ffd34d"/>'+
    '<circle cx="12" cy="12" r="1.45" fill="#fffbe8"/>'+
    '<circle cx="10.7" cy="10.5" r=".72" fill="#fff"/></svg>';})();
const V3_HEART='<svg viewBox="0 0 100 100" aria-hidden="true">'+
  '<path d="'+V3_HPATH+'" fill="#ff4fa3" stroke="#fff" stroke-width="5" stroke-linejoin="round"/>'+
  '<path d="M34 27 C27 30 24 37 25.5 44" fill="none" stroke="#ffd9ec" stroke-width="6" stroke-linecap="round" opacity=".9"/>'+
  '<circle cx="62" cy="30" r="4.5" fill="#ffd34d"/></svg>';
/* 하트 파동: 두꺼운 분홍 아래층 + 얇은 흰 윗층 = 빛나는 윤곽 (blur 없이) */
const V3_WAVE='<svg viewBox="0 0 100 100" aria-hidden="true">'+
  '<path d="'+V3_HPATH+'" fill="none" stroke="#ff8ac6" stroke-width="7" stroke-linejoin="round" opacity=".3"/>'+
  '<path d="'+V3_HPATH+'" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" opacity=".95"/></svg>';
/* 요구사항 2 · 중앙 광원을 원이 아니라 하트로: 하트 path 를 방사 그라데이션으로 채운다.
   gradient id 는 버스트마다 유일하게 만들어 두 번 연속 정답 시 id 충돌을 막는다. */
function v3CoreSVG(){var id='v3g'+(++v3uid);
  return '<svg viewBox="0 0 100 100" aria-hidden="true"><defs>'+
  '<radialGradient id="'+id+'" cx="50%" cy="40%" r="58%">'+
  '<stop offset="0%" stop-color="#fff" stop-opacity="1"/>'+
  '<stop offset="22%" stop-color="#fff0f8" stop-opacity=".8"/>'+
  '<stop offset="46%" stop-color="#ffd34d" stop-opacity=".4"/>'+
  '<stop offset="70%" stop-color="#ff8ac6" stop-opacity=".24"/>'+
  '<stop offset="88%" stop-color="#ff4fa3" stop-opacity=".07"/>'+
  '<stop offset="100%" stop-color="#ff4fa3" stop-opacity="0"/>'+
  '</radialGradient></defs><path d="'+V3_HPATH+'" fill="url(#'+id+')"/></svg>';}

/* o = {petals, dots, dist, flash, ring, edge, hearts, heart, rays, pollen, waves}
   petals/dots/dist 는 기존 의미 그대로. rays/pollen/waves 는 안 주면 petals 에서 유도한다. */
function burstV3(layer,x,y,o){
  o=o||{};
  var R=Math.random,P=Math.max(0,o.petals|0),D=Math.max(0,o.dots|0),dist=o.dist||1;
  var rays=o.rays!=null?o.rays:Math.min(9,3+Math.round(P*.2));
  var pol=o.pollen!=null?o.pollen:Math.min(18,3+Math.round(P*.45));
  var waves=o.waves!=null?o.waves:(P>=20?3:(P>=6||o.ring?2:1));
  var mk=function(cls,html){var d=document.createElement("div");d.className=cls;
    d.style.setProperty("--x",x+"px");d.style.setProperty("--y",y+"px");
    if(html)d.innerHTML=html;layer.appendChild(d);return d;};
  var hueAt=function(i,n){var h=V3_HUES[n<2?0:Math.round(i/(n-1)*(V3_HUES.length-1))];
    return (h+(R()-.5)*14+360)%360;};

  /* 1층 — 중앙 하트 광원(반투명, 0.56초 소멸) */
  if(o.flash!==false){var cr=mk("v3-core",v3CoreSVG());
    cr.style.setProperty("--sz",Math.round(88+Math.min(22,P)*2.2)+"px");}

  /* 2층 — 하트 모양 파동 링 */
  for(var w=0;w<waves;w++){var wv=mk("v3-wave",V3_WAVE);
    wv.style.setProperty("--sz",(52+w*8)+"px");
    wv.style.setProperty("--s2",(1.9+w*.55+Math.min(.9,dist-1))+"");
    wv.style.setProperty("--tilt",((w%2?1:-1)*(4+w*3))+"deg");
    wv.style.setProperty("--del",(w*.09)+"s");
    wv.style.setProperty("--dur",(.62+w*.07)+"s");}

  /* 3층 — 빛살 부채(콤보 5+) + 꽃 뒤를 지나가는 빛줄기 */
  if(P>=5){var fan=mk("v3-fan");fan.style.setProperty("--sz",Math.round(210+Math.min(24,P)*5)+"px");}
  var rcol=["#fff3c4","#ffd34d","#ff8ac6","#a5f2ff","#c9ffe4"];
  for(var r=0;r<rays;r++){var ry=mk("v3-ray");
    var ra=(360/rays)*r+(R()-.5)*18-90;
    var long=(r%3===0);
    ry.style.setProperty("--a",ra+"deg");
    ry.style.setProperty("--len",Math.round((long?128:82)*(.8+R()*.5)*dist)+"px");
    ry.style.setProperty("--w",(long?3.4:2.2)+"px");
    ry.style.setProperty("--rc",rcol[r%rcol.length]);
    ry.style.setProperty("--push",(14+R()*18)+"px");
    ry.style.setProperty("--del",(r*.012)+"s");
    ry.style.setProperty("--dur",(.34+R()*.12)+"s");}

  /* 4층 — 꽃. 개수가 적으면 크게(1송이도 빈약하지 않게), 많으면 작게 + 3겹 껍질로 흩뿌려
     40송이에도 중앙 글자 위가 아니라 고리 모양으로 퍼진다 */
  var base=R()*Math.PI*2,fsz=P<=2?25:(P<=6?22:(P<=16?19:16));
  for(var i=0;i<P;i++){
    var f=mk("v3-flower",V3_FLOWER);
    var a=(P<=3)?(-Math.PI/2+(i-(P-1)/2)*.9+(R()-.5)*.3)   /* 1~3송이는 위로 피어오른다 */
                :(base+Math.PI*2*i/P+(R()-.5)*(P>8?.5:.32));
    var shell=(i%3===0)?.66:((i%3===1)?.88:1.12);
    var rad=(64+R()*52)*shell*dist;
    var h=hueAt(i,P);
    f.style.setProperty("--hr",Math.round((h-V3_BASEH+360)%360)+"deg");
    f.style.setProperty("--glow","hsl("+Math.round(h)+",100%,72%)");
    f.style.setProperty("--sz",(fsz+R()*4-2).toFixed(1)+"px");
    f.style.setProperty("--dx",Math.round(Math.cos(a)*rad)+"px");
    f.style.setProperty("--dy",Math.round(Math.sin(a)*rad-9)+"px");
    f.style.setProperty("--rot",Math.round(R()*300-150)+"deg");
    f.style.setProperty("--del",((i%5)*.018).toFixed(3)+"s");
    f.style.setProperty("--dur",(.86+R()*.18).toFixed(2)+"s");}

  /* 5층 — 흰 불티 */
  for(var s=0;s<D;s++){var sp=mk("v3-spark");
    var sa=Math.PI*2*s/Math.max(1,D)+(R()-.5)*.9,sd=(34+R()*56)*dist;
    sp.style.setProperty("--sz",(3+R()*2.4).toFixed(1)+"px");
    sp.style.setProperty("--sc",s%3?"#fff":"#ffe9a8");
    sp.style.setProperty("--dx",Math.round(Math.cos(sa)*sd)+"px");
    sp.style.setProperty("--dy",Math.round(Math.sin(sa)*sd)+"px");
    sp.style.setProperty("--dur",(.38+R()*.1).toFixed(2)+"s");}

  /* 6층 — 늦게(0.2~0.44초 뒤) 반짝이며 떨어지는 금빛 꽃가루 */
  for(var p=0;p<pol;p++){var pl=mk("v3-pollen");
    var pa=R()*Math.PI*2,pd=(26+R()*62)*dist;
    pl.style.setProperty("--sz",(3.4+R()*2.2).toFixed(1)+"px");
    pl.style.setProperty("--pc",p%4===0?"#ff8ac6":(p%4===1?"#7cffb2":"#ffd34d"));
    pl.style.setProperty("--dx",Math.round(Math.cos(pa)*pd)+"px");
    pl.style.setProperty("--dy",Math.round(Math.sin(pa)*pd*.7-14)+"px");
    pl.style.setProperty("--fall",Math.round(20+R()*28)+"px");
    pl.style.setProperty("--del",(.2+R()*.24).toFixed(2)+"s");
    pl.style.setProperty("--dur",(.6+R()*.18).toFixed(2)+"s");}

  /* 7층 — 콤보 10+ 화면 가장자리 금빛 */
  if(o.edge)mk("v3-edge");

  /* 호환 — 날아가는 하트 / 큰 하트 팝 (fxHeart 용) */
  var H=Math.max(0,o.hearts|0);
  for(var k=0;k<H;k++){var ht=mk("v3-heart",V3_HEART);
    var ha=Math.PI*2*k/Math.max(1,H)+Math.PI/Math.max(1,H)*.5,hd=(58+R()*54)*dist;
    ht.style.setProperty("--sz",(16+R()*9).toFixed(1)+"px");
    ht.style.setProperty("--glow","#ff8ac6");
    ht.style.setProperty("--dx",Math.round(Math.cos(ha)*hd)+"px");
    ht.style.setProperty("--dy",Math.round(Math.sin(ha)*hd-22)+"px");
    ht.style.setProperty("--rot",Math.round(R()*70-35)+"deg");
    ht.style.setProperty("--dur",(.9+R()*.2).toFixed(2)+"s");}
  if(o.heart){var hp=mk("v3-hpop",V3_HEART);hp.style.setProperty("--sz","74px");}
}

/* ============ 연습마다 돌아가는 꽃 효과 ============
   여섯 가지를 연습 단위로 차례로 쓴다. 같은 연습은 언제 풀어도 같은 꽃이라
   "이 연습은 벚꽃"처럼 기억에 남고, 연습을 넘기면 바뀐다.
   결과 화면에서 틀린 단어를 지울 때(fxHeart)는 빨간 장미와 네 가지 꽃비를 순환. */
var BURSTS=[
  {name:"합본",          fn:function(l,x,y,o){return burst(l,x,y,o);}},
  {name:"겹꽃잎 꽃다발",   fn:function(l,x,y,o){return burstV1(l,x,y,o);}},
  {name:"두 번 뛰는 꽃비", fn:function(l,x,y,o){return burstV2(l,x,y,v2Opts(o.combo||o.petals||1));}},
  {name:"피어나는 하트꽃", fn:function(l,x,y,o){return burstV4(l,x,y,o);}},
  {name:"콤보 서사 꽃비",  fn:function(l,x,y,o){return burstV6(l,x,y,v6Opts(o.combo||o.petals||1));}},
  {name:"하트 광휘의 층",  fn:function(l,x,y,o){return burstV3(l,x,y,o);}}
];
function burstStyle(){var n=BURSTS.length,li=state.li|0,ei=state.ei|0;return BURSTS[((li*7+ei)%n+n)%n];}
/* 변형 안들은 저마다 '속을 채운 하트'를 중앙에 깐다. 어두운 카드 위에서 채움은 빛이 아니라
   글자를 덮는 때가 된다(26.9.13 영신 지적). 만들어진 뒤 그 요소만 골라 채움을 옅게·작게 만든다.
   꽃·불티는 건드리지 않는다. */
function tameHeart(layer){
  /* 여섯 안 중 넷(두 번 뛰는 꽃비·피어나는 하트꽃·콤보 서사·하트 광휘)이 저마다
     '속을 채운 반투명 하트'를 중앙에 깐다. 예전엔 78px로 줄이고 알파를 0.4배 했는데,
     줄여도 때는 때라서 새 윤곽 하트 밑에 회색 덩어리가 그대로 남는다.
     이제는 지운다 — 중앙 하트는 bigHeartFX 하나로 통일한다. */
  var els=layer.querySelectorAll(".v1-glow,.v2-glow,.v3-core,.v4-glow,.v4-hpop,.v6-glow,.v6-hpop,.hwave");
  for(var i=0;i<els.length;i++)els[i].parentNode&&els[i].parentNode.removeChild(els[i]);
}

let reviewRoseTap=0;
function fxHeart(el){
  const layer=$("#fxLayer");if(!layer)return;
  const [x,y]=fxOrigin(el);++fxGen;applyFX(layer);
  // Cycle by tap, independent of exercise size. Each burst owns its cleanup.
  const style=reviewRoseTap++%4;
  const flowers=document.createElement("div");flowers.className="review-roses";
  flowers.dataset.style=String(style+1);
  layer.appendChild(flowers);
  const spray=document.createElement("div");spray.className="review-spray";flowers.appendChild(spray);
  if(style===0)burstV1(spray,x,y,{petals:18,dots:14,loose:10,flash:false,dist:1.6});
  else if(style===1){
    burstV2(spray,x,y,{petals:18,dots:14,trails:7,flash:false,dist:1.45});
    for(const p of spray.querySelectorAll('.v2-p,.v2-d'))p.style.setProperty('--grav','40px');
  }
  else if(style===2)burstV4(spray,x,y,{petals:18,dots:14,tw:8,flash:false,dist:1.75});
  else burstV3(spray,x,y,{petals:16,dots:10,pollen:18,rays:7,waves:0,flash:false,dist:1.5});
  calmFX(spray);
  const core=document.createElement("div");core.className="review-rose-core";
  core.style.setProperty("--x",x+"px");core.style.setProperty("--y",y+"px");
  core.innerHTML=REVIEW_ROSE_SVG;

  setTimeout(()=>flowers.remove(),1300);
}

function esc(v){return String(v).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
/* 고양이 대사는 고양이가 있는 곳에서 한다(26.10.13 영신: 화면 맨 밑에 뜨는 대사는 "눈에 띄지도 않고 좀 뜬금없다").
   맨 밑에 뜨던 알림(toast)은 없앴다. 지금 화면 고양이의 말풍선에 띄운다. 고양이가 없는 연습 목록에서는 홈 고양이가 받아 둔다. */
function catSay(msg){

  if(on("gameScreen")&&state.session){quizSay(msg);return;}
  $(on("sumScreen")?"#sumBubble":"#homeBubble").innerHTML=`<span><span class="nm">고양고양이</span> ${esc(msg)}</span>`;

/* 문제 화면: 카드 머리줄 고양이 말풍선(시간 막대 자리)에 잠깐 띄우고, 그 카드가 그대로면 원래 말풍선으로 되돌린다. */
function quizSay(msg){
  const s=state.session,sp=$("#catSpeech");if(!s||!sp)return;
  if(s.opening)quizOpenEnd(s);
  if(!state.quizSayT)state.quizSayBack={text:sp.textContent,hidden:sp.hidden,card:s.currentId,answered:s.answered};
  clearTimeout(state.quizSayT);
  sp.textContent=msg;sp.hidden=false;$("#timeWrap").style.visibility="hidden";
  state.quizSayT=setTimeout(()=>{state.quizSayT=null;const b=state.quizSayBack;
    if(state.session!==s||s.currentId!==b.card||s.answered!==b.answered)return; // 그사이 카드가 바뀌거나 공개됐으면 그쪽이 말풍선을 정한다
    sp.textContent=b.text;sp.hidden=b.hidden;if(!s.answered)$("#timeWrap").style.visibility="";},1600);
}
/* 시작 대사: 첫 카드에서 고양이가 말한다. 읽는 동안(2.6초, 먼저 치기 시작하면 그때까지) 첫 카드 시간은 흐르지 않는다. */
function quizOpen(msg){
  const s=state.session,sp=$("#catSpeech");if(!s||!sp||s.currentId===null)return;
  sp.textContent=msg;sp.hidden=false;$("#timeWrap").style.visibility="hidden";
  const r=$("#catSpeechReserve");if(r&&msg.length>(r.textContent||"").length)r.textContent=msg; // 말풍선 높이만큼 자리를 잡아 둔다(그 카드 동안 유지해 화면이 들썩이지 않는다)
  s.opening=true;clearTimeout(state.openT);state.openT=setTimeout(()=>quizOpenEnd(s),2600);
}
function quizOpenEnd(s){
  if(!s||!s.opening)return;s.opening=false;clearTimeout(state.openT);
  if(state.session!==s||s.answered)return;
  const sp=$("#catSpeech");sp.textContent="";sp.hidden=true;$("#timeWrap").style.visibility="";
  s.cardStart=s.pausedAt||Date.now(); // 화면을 가린 채 접히면 가린 때부터 잰다(돌아올 때 가린 시간만큼 다시 민다)
}

// A transparent native button sits over the first cell, above the typing input.
// The other cells continue to tap the input directly (including on mobile).
(()=>{
  const hint=$("#hintBtn"),context=$("#hoeCtx"),form=$("#aform");
  let pending=0;
  function positionHint(){
    const s=state.session,cell=context.querySelector(".slot");
    if(!s||s.currentId===null||s.answered||s.copyMode||hint.disabled||!cell){hint.hidden=true;return;}
    const r=cell.getBoundingClientRect(),f=form.getBoundingClientRect();
    if(!r.width||!r.height||!f.width){hint.hidden=true;return;}
    // Extend left of the first glyph; never cover the adjacent letter.
    const width=r.width+6,height=Math.max(44,r.height);
    hint.style.left=(r.left-f.left-6)+"px";
    hint.style.top=(r.top-f.top-(height-r.height)/2)+"px";
    hint.style.width=width+"px";hint.style.height=height+"px";
    hint.hidden=false;
  }
  function schedulePosition(){
    if(pending)return;
    pending=requestAnimationFrame(()=>{pending=0;positionHint();});
  }
  hint.addEventListener("pointerdown",e=>e.preventDefault());
  // 26.10.27 영신 제보(iPhone): 힌트 칸을 누르면 화면이 맨 아래로 내려갔다. 입력칸에 글자를 넣고 커서를 옮길 때
  // iOS가 화면을 끌어내린다. 누르기 전 자리로 되돌린다. 그사이 학생이 직접 스크롤하면 건드리지 않는다.
  function holdScroll(y){
    let moved=false;const stop=()=>{moved=true;};
    window.addEventListener("touchmove",stop,{passive:true});window.addEventListener("wheel",stop,{passive:true});
    const back=()=>{if(!moved&&Math.abs(window.scrollY-y)>4)window.scrollTo(0,y);};
    requestAnimationFrame(back);setTimeout(back,120);
    setTimeout(()=>{back();window.removeEventListener("touchmove",stop);window.removeEventListener("wheel",stop);},360);
  }
  hint.addEventListener("click",e=>{
    e.preventDefault();e.stopPropagation();
    if(hint.disabled||hint.hidden)return;
    const y=window.scrollY;
    giveHint();positionHint();focusAnswerInput();holdScroll(y);
  });
  new MutationObserver(schedulePosition).observe(context,{childList:true,subtree:true});
  new MutationObserver(schedulePosition).observe(hint,{attributes:true,attributeFilter:["disabled"]});
  if(typeof ResizeObserver==="function")new ResizeObserver(schedulePosition).observe(context);
  window.addEventListener("resize",schedulePosition);
  positionHint();
})();

  const lessons=state.lessons.filter(L=>L.kind!=='saved'&&(typeof inScope!=='function'||inScope(L)));
  const label=n=>{const L=state.lessons.find(x=>x.lesson===n),m=L&&String(L.name||'').match(/(\d+)\s*~\s*(\d+)/);return m?Number(m[2]).toLocaleString('en-US')+'단어':(L?L.id+'까지':'');};
  const ends=PACE_COURSE==='fable'?[25,45,Infinity].filter(n=>n===25||!state.levelB1):[Infinity];
  const name=n=>n===Infinity?(PACE_COURSE==='fable'?'FABLE 완주':PACE_COURSE==='ksat'?'발음고양 완주':'EBS 완주'):label(n);
  const out=ends.map(n=>{let u=0,ex=0;lessons.filter(L=>L.lesson<=n).forEach(L=>visEx(L).forEach(e=>{if(!getRec(L.id,e.title)?.completed){u+=paceUnits(e.words);ex++;}}));return {end:n,label:name(n),u,ex};});
  const i=out.findIndex(t=>t.ex>0);if(i<0)return null;
  return {...out[i],next:out[i+1]?.label||null,passed:i>0?out[i-1].label:null};
}

/* ── 예측. recs는 시간순 [{at,ms,u,k}] (k: n 새 연습, a 다시 푼 연습, w 틀린 것만), target은 {u,ex}.
   속도 r = 걸린 시간 ÷ 일의 양. 새 연습이 5판 이상이면 새 연습만으로 잰다(다시 푼 판은 이미 알아서 빠르다).
   - 지금 속도: 최근 판에 무게를 더 준 평균(한 판 앞설 때마다 0.85배).
   - 변화율: 학습 곡선 ln r = a + b·ln(누적 일의 양)을 같은 무게로 맞춘 기울기 b(-0.4~0으로 묶음).
   - 긍정값: 지금 속도에서 그 곡선대로 더 빨라진다고 보고 적분하되, 지금의 70%보다 빨라지지는 않는다.
   - 보수값: 지금 속도와 전체 중앙값 중 느린 쪽으로, 더 빨라지지 않는다고 본다. 다시 풀기·틀린 것만에 든 시간 비율(최대 1.5배)도 더한다.
   - 하루 시간: 최근 14일(처음 기록부터가 더 짧으면 그만큼)의 하루 평균. 기록이 3일에 못 미치면 하루 1시간으로 계산한다.
     하루 30분이 안 되면 갈구면서 하루 1시간 기준으로 준다(영신). */
function paceDay(t){const d=new Date(t);return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
function paceDayStart(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function paceForecast(recs,target,now){
  const full=recs.filter(r=>r.k!=='w'),news=full.filter(r=>r.k==='n');
  if(full.length<paceMinPlays||!target||!(target.u>0))return null;
  const base=news.length>=5?news:full,N=base.length,rate=r=>r.ms/r.u;
  let sw=0,sr=0;base.forEach((r,i)=>{const w=Math.pow(0.85,N-1-i);sw+=w;sr+=w*rate(r);});
  const rNow=sr/sw;
  let cum=0;const pts=base.map((r,i)=>{const x=Math.log(1+cum+r.u/2);cum+=r.u;return {x,y:Math.log(rate(r)),w:Math.pow(0.85,N-1-i)};});
  let b=0;
  if(N>=5){const W=pts.reduce((a,p)=>a+p.w,0),mx=pts.reduce((a,p)=>a+p.w*p.x,0)/W,my=pts.reduce((a,p)=>a+p.w*p.y,0)/W;
    const vx=pts.reduce((a,p)=>a+p.w*(p.x-mx)**2,0),cxy=pts.reduce((a,p)=>a+p.w*(p.x-mx)*(p.y-my),0);if(vx>1e-6)b=Math.max(-0.4,Math.min(0,cxy/vx));}
  const R=target.u,C=1+cum,steps=40;let opt=0;
  for(let i=0;i<steps;i++){const x=(i+0.5)*R/steps;opt+=Math.max(0.7*rNow,rNow*Math.pow((C+x)/C,b))*R/steps;}
  const sorted=base.map(rate).sort((p,q)=>p-q),med=sorted[Math.floor(sorted.length/2)];
  const sumMs=a=>a.reduce((s,r)=>s+r.ms,0);
  const over=news.length>=5?Math.min(1.5,Math.max(1,sumMs(recs)/sumMs(news))):1;
  const rCons=Math.max(rNow,med)*over;let cons=rCons*R;if(opt>cons)[opt,cons]=[cons,opt];
  const exU=R/Math.max(1,target.ex);
  const recent=base.slice(-5),prev=base.slice(-10,-5),mean=a=>a.reduce((s,r)=>s+rate(r),0)/a.length;
  const trend=recent.length>=3&&prev.length>=3?mean(recent)/mean(prev)-1:0;
  const first=paceDayStart(recs[0].at),today=paceDayStart(now),span=Math.round((today-Math.max(first,today-13*864e5))/864e5)+1;
  const daily=span>=3?sumMs(recs.filter(r=>r.at>=Math.max(first,today-13*864e5)))/60000/span:null;
  const mode=daily===null?'hour':daily<paceLowDaily?'low':'daily',perDay=mode==='daily'?daily:paceHourBasis;
  const optMin=opt/60000,consMin=cons/60000;
  return {optMin,consMin,exMin:[rNow*exU/60000,rCons*exU/60000],trend,daily,mode,perDay,
    days:[Math.max(1,Math.ceil(optMin/perDay)),Math.max(1,Math.ceil(consMin/perDay))],b,rNow};
}

/* ── 대사. 고양고양이는 츤데레다(PRINCIPLES 1). 말풍선은 폰에서 두 줄 안. 예측은 늘 '이 기세면' 가정으로, 범위로만 말한다. */
var PACE_LINES={
  intro:{daily:['네 속도 쟀다고양. 이대로면 {R} 뒤 {T} 돌파라고양!'],
         hour:['속도 쟀다고양. 1시간씩이면 {R}에 {T}라고양!']},
  regular:{daily:['이 기세면 {R} 뒤 {T}라고양. 늦으면 갈군다고양.','{T}까지 {R}이라고양. 딴짓 금지라고양~','{R} 뒤면 {T}라고양. 금방이지 않냐고양?'],
           hour:['하루 1시간씩이면 {R}에 {T} 돌파라고양!','1시간씩만 버티면 {R}에 {T}라고양. 쉽지?']},
  fast:{daily:['빨라졌다고양? 이 기세면 {R} 뒤 {T}라고양!','손이 풀렸냐고양? 이대로면 {R} 뒤 {T}라고양.'],
        hour:['빨라졌다고양! 1시간씩이면 {R}에 {T}라고양.']},
  next:['{P} 돌파라고양! 이제 {T}까지 {R}이라고양.'],
  later:['{T}부터 뚫으라고양. {N}는 그다음에 알려주겠다고양!'],
  slow:['요즘 굼떠졌다고양. 이러다 {T}까지 {RB} 걸린다고양?!','손가락 녹슬었냐고양? 속도가 {p}%나 떨어졌다고양!'],
  absent:['{g}일 만이라고양? 단어들이 짐 싸서 도망갔다고양.','{g}일이나 놀았냐고양? {T}가 멀어진다고양.'],
  low:['하루 {m}분? 매일 하라고양! 1시간씩이면 {R}이라고양.','하루 {m}분? 꿈 깨라고양. 1시간씩이면 {R}이라고양.']
};
function paceRange(a,b){return a===b?a+'일':a+'~'+b+'일';}
function paceFill(t,v){return t.replace(/\{(\w+)\}/g,(m,k)=>v[k]??m);}
function paceNote(f,t){
  const ex=f.exMin.map(x=>Math.max(1,Math.round(x))),exT=ex[0]===ex[1]?ex[0]+'분':ex[0]+'~'+ex[1]+'분';
  const tr=Math.abs(f.trend)>=0.1?` · 최근 ${Math.round(Math.abs(f.trend)*100)}% ${f.trend<0?'빨라짐':'느려짐'}`:'';
  const basis=f.mode==='daily'?`하루 평균 ${Math.round(f.daily)}분 기준`:f.mode==='low'?`하루 평균 ${Math.round(f.daily)}분 → 1시간 기준`:'하루 1시간 기준';
  return `${t.label}까지 ${paceRange(f.days[0],f.days[1])} · 연습 하나 ${exT}${tr} · ${basis}`.replace(/ · /g,'\u00a0· '); // 줄이 바뀌어도 구분점은 앞말에 붙는다
}
/* 무엇을 말할지: 처음(10판째) > 오랜만 > 하루가 짧음(하루 한 번) > 앞 목표 돌파 > 느려짐 > 빨라짐 > 다섯 판마다 예측. 아니면 원래 대사. */
function paceKind(recs,f,t,meta,now){
  const full=recs.filter(r=>r.k!=='w'),last=recs[recs.length-1],before=recs[recs.length-2];
  const plays=Number.isFinite(meta.total)?meta.total:full.length,since=plays-(meta.n||0),gap=before?Math.floor((paceDayStart(last.at)-paceDayStart(before.at))/864e5):0;
  if(!meta.intro)return 'intro';
  if(gap>=3)return 'absent';
  if(f.mode==='low'&&meta.lowDay!==paceDay(now))return 'low';
  if(t.passed&&meta.target&&meta.target!==t.label)return 'next';
  if(f.trend>=0.2&&plays-(meta.slowAt||0)>=5)return 'slow';
  if(f.trend<=-0.15&&since>=3)return 'fast';
  if(since>=5)return t.next&&!meta.later&&PACE_COURSE==='fable'?'later':'regular';
  return null;
}
function paceLine(kind,f,t,recs,now){
  const mode=f.mode==='daily'?'daily':'hour',pool=Array.isArray(PACE_LINES[kind])?PACE_LINES[kind]:PACE_LINES[kind][mode];
  const before=recs[recs.length-2],last=recs[recs.length-1];
  const v={T:t.label,N:t.next||'',P:t.passed||'',R:paceRange(f.days[0],f.days[1]),RB:f.days[1]+'일',m:Math.round(f.daily||0),p:Math.round(Math.abs(f.trend)*100),
    g:before?Math.floor((paceDayStart(last.at)-paceDayStart(before.at))/864e5):0};
  return paceFill(pool[Math.floor(Math.random()*pool.length)],v);
}
function paceShow(info,ms){
  const now=Date.now(),recs=paceRead(),words=info.partial?info.words:info.e.words;
  if(ms>=5000){
    const fullBefore=recs.filter(r=>r.k!=='w').length;
    recs.push({at:now,ms:Math.round(ms),u:Math.round(paceUnits(words)*10)/10,k:info.partial?'w':info.was?'a':'n'});paceSave(paceKey,recs.slice(-paceKeep));
    // 판 수는 보관(최근 600판)과 따로 센다. 배열 길이로 세면 600판에서 멈춰 다섯 판마다 대사가 끊겼다(26.10.15 아스트라 리뷰 T05).
    if(!info.partial){const m=paceMeta();m.total=(Number.isFinite(m.total)?m.total:fullBefore)+1;paceSave(paceMetaKey,m);}
  }
  const note=paceNoteEl();note.hidden=true;
  if(info.partial)return;
  const t=paceTargets(),f=t&&paceForecast(recs,t,now);if(!f)return;
  note.textContent=paceNote(f,t);note.hidden=false;
  if($("#sumTitle").textContent!=="연습 클리어 ✦")return;   // 세트 정복·엔딩 대사는 그대로 둔다
  const meta=paceMeta(),kind=paceKind(recs,f,t,meta,now),plays=Number.isFinite(meta.total)?meta.total:recs.filter(r=>r.k!=='w').length;
  if(kind){
    $("#sumBubble").innerHTML=`<span><span class="nm">고양고양이</span> ${esc(paceLine(kind,f,t,recs,now))}</span>`;
    meta.n=plays;meta.intro=true;
    if(kind==='low')meta.lowDay=paceDay(now);
    if(kind==='slow')meta.slowAt=plays;
    if(kind==='later')meta.later=true;
  }
  meta.target=t.label;paceSave(paceMetaKey,meta);
}
function paceNoteEl(){
  let el=$("#paceNote");
  if(!el){el=document.createElement('p');el.id='paceNote';el.className='pace-note';el.hidden=true;const b=$("#sumBubble");b.parentNode.insertBefore(el,b.nextSibling);}
  return el;
}
var paceOrigStart=startExercise,paceOrigFinish=finishExercise;
startExercise=function(){const r=paceOrigStart.apply(this,arguments);paceActive=0;paceLast=Date.now();return r;};
finishExercise=function(){
  const s=state.session;
  const info=s&&s.lesson&&s.lesson.kind!=='saved'&&s.exercise?{e:s.exercise,partial:!!s.partial,was:!!getRec(s.lesson.id,s.exercise.title)?.completed,words:s.words}:null;
  paceTick();const ms=paceActive;paceActive=0;paceLast=0;
  const r=paceOrigFinish.apply(this,arguments);
  if(info)try{paceShow(info,ms);}catch(e){}
  return r;
};
function paceInit(){
  ['keydown','pointerdown','input'].forEach(n=>document.addEventListener(n,paceTick,true));
  document.addEventListener('visibilitychange',()=>{if(document.hidden){paceTick();paceLast=0;}else if(state.session)paceLast=Date.now();});
}
paceInit();
/* PACE_END */
renderHome();
</script>
</body>
