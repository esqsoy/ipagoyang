<!doctype html>
<html lang="ko">

<title>발음고양</title>
<!-- 생성물이다. 고칠 때는 pipeline/template.html과 data/·sources/를 고치고 python3 pipeline/build.py를 돌린다.
     화면은 고양 시리즈(보카고양·탄고고양) 틀을 따른다: 밤하늘 바탕, 진보라 판, 픽셀 고양고양이 표정 7종(proposals/vocagoyang-design-analysis-20261106.md). -->
<style>
@font-face{font-family:"Balum IPA";src:url("assets/fonts/BalumIPA-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Balum IPA";src:url("assets/fonts/BalumIPA-Bold.woff2") format("woff2");font-weight:700;font-display:swap}
/* 고양 시리즈 색(보카고양 :root) + 발음고양은 소리를 청록으로 칠한다. 시리즈처럼 어두운 화면 하나로 간다. */
:root{
  --bg1:#160826;--bg2:#2a0c40;--bg3:#3a1054;--ink:#ffffff;--muted:#c6bcdd;--panel:#1d0c2e;--panel2:#26103a;--line:#6f3c95;
  --pink:#ff4fa3;--pink2:#ff8ac6;--pinkpale:#f6e2ec;--cyan:#5ce6ff;--cyansoft:#a5dfef;--mint:#7cffb2;--gold:#ffd34d;--gold2:#f5b301;
  --bad:#ff5d6c;--bad2:#ff8a94;--lav:#c3aefc;--radius:14px;
  --sub:var(--muted);--card:var(--panel);--accent:var(--cyan);--hot:var(--gold);--hot-soft:#3d2c0c;
  --cav:#2a1240;--tis:#3d2558;--tongue:#a4567c;--tooth:#f6e2ec;--ok:var(--mint);--ng:var(--bad2);
  --ipa:"Balum IPA","Charis SIL","Doulos SIL","Gentium Plus",serif;
  --ko:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{font-family:var(--ko);color:var(--ink);word-break:keep-all;overflow-wrap:break-word;-webkit-text-size-adjust:100%;
  background:
    radial-gradient(circle at 16% 14%, rgba(255,79,163,.30), transparent 30%),
    radial-gradient(circle at 84% 10%, rgba(92,230,255,.16), transparent 26%),
    radial-gradient(circle at 78% 84%, rgba(124,255,178,.10), transparent 26%),
    linear-gradient(180deg, var(--bg1) 0%, var(--bg2) 60%, var(--bg3) 100%);
  background-color:var(--bg1);background-attachment:fixed;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 70% 80%,#fff,transparent),
    radial-gradient(1px 1px at 40% 60%,var(--gold),transparent),radial-gradient(1px 1px at 85% 22%,var(--cyan),transparent),
    radial-gradient(2px 2px at 12% 82%,var(--pink2),transparent),radial-gradient(1px 1px at 52% 12%,#fff,transparent),
    radial-gradient(2px 2px at 34% 88%,var(--pink),transparent);
  opacity:.7;animation:tw 3s steps(2) infinite}
@keyframes tw{50%{opacity:.3}}
button,input{font:inherit;color:inherit}
a{color:var(--cyansoft)}
.app{position:relative;z-index:1;width:min(100%,560px);margin:0 auto;display:flex;flex-direction:column;gap:12px;
  padding-block:10px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ipa{font-family:var(--ipa);font-weight:400}
.appbar{display:flex;align-items:center;gap:10px;min-height:40px}
.appbar h1{margin:0;font-size:clamp(.92rem,4vw,1.12rem);letter-spacing:-.4px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar h1 b{color:var(--gold)}
.appbar .spacer{flex:1}
.qcount{font-size:.8rem;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.iconbtn{flex:none;width:40px;height:40px;border-radius:11px;border:2px solid var(--line);background:var(--panel2);color:#fff;font-size:1.05rem;cursor:pointer;display:grid;place-items:center}
.iconbtn:focus-visible,.btn:focus-visible,.lessonbtn:focus-visible,.opt:focus-visible,.key:focus-visible,.play:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.catrow{display:grid;grid-template-columns:auto 1fr;gap:11px;align-items:end;border:2px solid var(--line);border-radius:var(--radius);
  background:linear-gradient(135deg,rgba(255,255,255,.05),transparent 40%),var(--panel);padding:12px}
.catimg{width:clamp(78px,21vw,104px)}
.catrow.small .catimg{width:clamp(60px,16vw,76px)}
.catimg img,.catbtn img{display:block;width:100%;height:auto;image-rendering:pixelated}
.bubble{position:relative;border:2px solid var(--pink2);border-radius:12px;padding:11px 13px;background:rgba(34,16,58,.96);
  font-size:clamp(.86rem,3.6vw,1.02rem);line-height:1.5;min-height:3em;display:flex;align-items:center}
.bubble:before{content:"";position:absolute;left:-9px;bottom:16px;border:8px solid transparent;border-right-color:var(--pink2);border-left:0}
.bubble .nm,.nm{color:var(--pink2);font-weight:900}
.panel{border:2px solid var(--line);border-radius:var(--radius);background:linear-gradient(135deg,rgba(255,255,255,.05),transparent 42%),var(--panel);min-width:0}
.phead{display:flex;align-items:center;gap:10px;padding:13px 13px 8px}
h2,h3{margin:0;font-size:1.05rem}
small{font-weight:800;font-size:.76rem;opacity:.85;color:var(--muted)}
.note{margin:0;padding:0 13px 13px;font-size:.84rem;line-height:1.6;color:var(--muted)}
.svgbox svg{width:100%;height:auto;display:block}
.mapbox{padding:0 8px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;align-items:start;padding:0 13px 13px}
.lessonbtn{border:2px solid var(--line);border-radius:12px;cursor:pointer;color:#fff;text-align:left;padding:13px;display:flex;flex-direction:column;gap:6px;
  background:linear-gradient(160deg,#3a1555,#26103a 62%,#170824);transition:transform .12s,border-color .12s;min-width:0}
.lessonbtn:active{transform:scale(.98)}
.lessonbtn .t{font-size:1.18rem;font-weight:900}
.lessonbtn .s{color:var(--pink2);font-weight:900;font-size:.9rem}
.lessonbtn .sy{color:var(--cyan);font-size:1rem}
.lessonbtn .m{color:var(--muted);font-size:.76rem;font-weight:800}
.lessonbtn.done{border-color:var(--gold2)}
.lessonbtn.locked{border-style:dashed;background:transparent;opacity:.55;cursor:default}
.btn{display:block;width:100%;min-height:56px;border-radius:11px;border:2px solid var(--gold2);cursor:pointer;font-weight:900;font-size:1.05rem;padding:0 18px;
  background:linear-gradient(180deg,#ffe06b,#e0a92a 60%,#7d4f06);color:#1a0820;box-shadow:0 4px 0 #4a2d06}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #4a2d06}
.btn.sub{background:var(--panel2);border-color:var(--line);color:#fff;box-shadow:none;min-height:48px}
.homeCredit{margin:4px 0 0;text-align:center;font-size:.78rem;font-weight:800;letter-spacing:.4px;color:var(--muted)}
.homeCredit a{color:var(--muted);text-decoration:none}
.homeCredit b{color:var(--pink2)}
/* 배우기 */
.learn{padding:14px 13px}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--gold)}
.big{font-size:68px;line-height:1.05;text-align:center;color:var(--cyan)}
.name{text-align:center;font-weight:900;font-size:1.05rem;margin-top:2px}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:start;margin-top:12px}
.cap{font-size:.72rem;color:var(--muted);text-align:center;margin-top:3px;font-weight:700}
.learn p{line-height:1.65;margin:8px 0 0;font-size:.95rem}
.learn .k{color:var(--pink2);font-weight:900}
.learn .other{color:var(--muted);font-size:.84rem}
.symrow{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:8px;font-size:.8rem;color:var(--muted);font-weight:700}
.exlist{padding:0 13px 8px}
.ex{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid rgba(111,60,149,.6)}
.ex:first-child{border-top:0}
.lang{font-size:.72rem;color:var(--muted);white-space:nowrap;font-weight:800}
.word{font-size:1.05rem;font-weight:900}
.word small{margin-left:6px;font-size:.78rem}
.tr{font-family:var(--ipa);font-size:1.15rem;color:var(--cyan)}
.tr b{color:var(--gold);font-weight:700}
.play{width:44px;height:44px;border-radius:50%;border:2px solid var(--cyan);background:var(--panel2);color:var(--cyan);font-size:15px;display:grid;place-items:center;cursor:pointer}
.play[disabled]{border-color:var(--line);color:var(--line);cursor:default}
.soon{font-size:.68rem;color:var(--muted);white-space:nowrap;font-weight:700}
.pcell{display:flex;flex-direction:column;align-items:center;gap:2px}
canvas.wave{width:100%;height:40px;display:block;grid-column:1/-1}
.feel{border:2px dashed var(--line);border-radius:12px;padding:11px 13px;font-size:.88rem;line-height:1.6;color:var(--pinkpale);background:rgba(255,255,255,.03)}
.feel b{color:var(--pink2)}
/* 문제 */
.quiz{padding:12px 12px 14px;display:flex;flex-direction:column;gap:10px}
.trow{display:flex;align-items:center;gap:10px}
.tslot{flex:1;min-width:0}
.pbar{height:12px;border-radius:7px;background:var(--panel2);border:2px solid var(--line);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--lav);transition:width .3s}
.combo{font-weight:900;color:var(--pink);font-size:.9rem;min-width:2.2em;text-align:right;font-variant-numeric:tabular-nums}
.catbtn{flex:none;width:48px;background:none;border:0;padding:0;cursor:default}
.cat-speech{margin:0;padding:7px 9px;border:1px solid var(--pink2);border-radius:10px;background:var(--panel2);color:var(--pink2);
  font-size:clamp(.85rem,3.5vw,.98rem);font-weight:800;line-height:1.45;text-align:center;min-height:2.6em;display:flex;align-items:center;justify-content:center}
.qmeta{text-align:center;color:var(--muted);font-size:.8rem;font-weight:800}
.qword{font-size:clamp(1.6rem,7vw,2rem);text-align:center;font-weight:900;line-height:1.2}
.qtr{font-family:var(--ipa);font-size:clamp(2rem,9vw,2.4rem);text-align:center;color:var(--cyan)}
.slot{display:inline-block;min-width:1.3em;border-bottom:3px solid var(--gold);color:var(--gold);text-align:center}
.qplay{display:flex;justify-content:center;align-items:center;gap:8px}
.qask{text-align:center;margin:0;font-weight:800}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(64px,1fr));gap:8px}
.opt,.key{border:2px solid var(--line);border-radius:12px;cursor:pointer;color:#fff;background:linear-gradient(160deg,#3a1555,#26103a 62%,#170824)}
.opt{padding:14px 6px;font-size:1.6rem;font-weight:900}
.opt.ipa{font-size:1.9rem;color:var(--cyan);font-weight:400}
.opt.right,.key.right{border-color:var(--mint);background:rgba(124,255,178,.14)}
.opt.wrong,.key.wrong{border-color:var(--bad);background:rgba(255,93,108,.14)}
.opt.need,.key.need{outline:3px solid var(--gold);outline-offset:2px}
.kb{border:2px solid var(--line);border-radius:12px;overflow:hidden}
.kbhead{font-size:.72rem;color:var(--muted);padding:6px 9px;background:var(--panel2);font-weight:800}
.kb table{width:100%;border-collapse:collapse}
.kb th{font-size:.72rem;color:var(--muted);font-weight:800;text-align:left;padding:6px 9px;background:var(--panel2);width:62px;border-top:1px solid var(--line)}
.kb td{padding:6px;border-top:1px solid var(--line)}
.keys{display:flex;gap:6px;flex-wrap:wrap}
.key{min-width:54px;padding:5px 6px 4px;font-family:var(--ipa);font-size:1.6rem;line-height:1;text-align:center;color:var(--cyan)}
.key .ks{display:block;line-height:1.5;padding-bottom:3px}
.key small{display:block;font-family:var(--ko);font-size:.62rem;line-height:1.2}
.tap{font-size:.74rem;color:var(--muted);text-align:center;font-weight:700}
.reveal{border-radius:12px;padding:12px 13px;font-size:.92rem;line-height:1.6;background:var(--panel2);border:2px solid var(--line)}
.reveal.ok{border-color:var(--mint)}
.reveal.ng{border-color:var(--bad)}
.reveal .tr{font-size:1.3rem}
.reveal .lbl{font-weight:900}
.reveal.ok .lbl{color:var(--mint)}
.reveal.ng .lbl{color:var(--bad2)}
.heart{position:fixed;z-index:9;pointer-events:none;font-size:56px;color:var(--pink);transform:translate(-50%,-50%) scale(.2);opacity:0;animation:hb .9s cubic-bezier(.16,1,.3,1) forwards}
@keyframes hb{20%{opacity:1}60%{transform:translate(-50%,-80%) scale(1.15);opacity:1}100%{transform:translate(-50%,-110%) scale(1);opacity:0}}
/* 결과·출처 */
.res{padding:0 13px 13px}
.perfect{font-size:1.4rem;font-weight:900;color:var(--gold);letter-spacing:1px}
table.cr{width:100%;border-collapse:collapse;font-size:.8rem}
table.cr td{border-top:1px solid var(--line);padding:7px 4px;text-align:left;vertical-align:top;color:var(--pinkpale)}
.crbox{padding:0 13px 13px;overflow-x:auto}
.vib{animation:vib .12s linear infinite alternate}
@keyframes vib{from{transform:translateX(-.6px)}to{transform:translateX(.6px)}}
.puff{animation:puff 1.4s ease-out infinite}
@keyframes puff{0%{opacity:0;transform:translateX(0)}30%{opacity:1}100%{opacity:0;transform:translateX(-8px)}}
@media (prefers-reduced-motion:reduce){.vib,.puff,body::before,.heart{animation:none}.heart{display:none}}
</style>
</head>

      <div class="opts">${q.c.options.map(o => `<button class="opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div></section>`;
  } else if (q.type === 'listen') {
    body = `${header('첫소리 기호를 고르라고양. 철자는 안 보여 준다고양.', q.type)}
      <div class="qmeta">${esc(L)}</div>
      <div class="qplay"><button class="play" id="pl" style="width:64px;height:64px;font-size:22px" aria-label="듣기">▶</button></div>
      <canvas class="wave" id="wv"></canvas>
      <div class="opts">${['p', 'b', 'pʰ', 'p͈'].map(o => `<button class="opt ipa" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div></section>`;
  } else {
    body = `${header('빈칸에 들어갈 기호를 치라고양.', q.type)}
      <div class="qmeta">${esc(L)}</div><div class="qword">${esc(w.text)}</div><div class="qmeta">${esc(w.roman !== w.text ? w.roman + ' · ' : '')}${esc(w.ko)}</div>
      <div class="qtr" id="qtr">${trHtml(w, true)}</div>
      <div class="qplay"><button class="play" id="pl" ${hasAudio(w.audio) ? '' : 'disabled'} aria-label="듣기">▶</button>${hasAudio(w.audio) ? '' : '<span class="soon">녹음 준비 중</span>'}</div>
      ${hasAudio(w.audio) ? '<canvas class="wave" id="wv"></canvas>' : ''}
      ${keyboard()}<div class="tap">컴퓨터 자판: 키 아래 글자를 치고 Enter</div></section>`;
  }
  app.innerHTML = body + '<div id="rv"></div>';
  const wv = document.getElementById('wv'), pl = document.getElementById('pl');
  if (pl) pl.onclick = () => play(w.audio, wv);
  if (wv) requestAnimationFrame(() => wave(wv, w.audio, 0));
  if (q.type !== 'blank' && hasAudio(w.audio)) setTimeout(() => play(w.audio, wv), 250);
  app.querySelectorAll('.opt').forEach(b => b.onclick = () => answer(b.dataset.o, b));
  app.querySelectorAll('.key').forEach(b => b.onclick = () => answer(b.dataset.k, b));
  document.getElementById('quit').onclick = home;
  typed = '';
  window.scrollTo(0, 0);
}
let typed = '';
document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const q = Q[qi];
  if (copyNeed) {
    if (e.key === 'Enter' || e.key.length === 1) { e.preventDefault(); typedCopy(e); }
    return;
  }
  if (lock) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); next(); } return; }
  if (!q || !document.getElementById('rv')) return;
  if (q.type === 'blank') {
    if (e.key === 'Enter') { e.preventDefault(); const k = B.shortcuts[typed]; if (k) answer(k, app.querySelector(`.key[data-k="${CSS.escape(k)}"]`)); typed = ''; return; }
    if (e.key === 'Backspace') { typed = typed.slice(0, -1); }
    else if (e.key.length === 1) typed += e.key;
    const slot = app.querySelector('.slot'); if (slot) slot.textContent = typed ? (B.shortcuts[typed] || typed) : ' ';
  } else if (/^[1-9]$/.test(e.key)) {
    const b = app.querySelectorAll('.opt')[+e.key - 1]; if (b) b.click();
  }
});
function correctOf(q) { return q.type === 'compare' ? [q.c.answer] : q.type === 'listen' ? [q.w.target] : (q.w.accept || [q.w.target]); }
let copyNeed = null;
function answer(v, btn) {
  if (lock || copyNeed) return;
  const q = Q[qi], ok = correctOf(q).includes(v);
  typed = '';
  res.push({q, ok, v});
  const sel = q.type === 'blank' ? '.key' : '.opt';
  const right = correctOf(q)[0];
  if (btn) btn.classList.add(ok ? 'right' : 'wrong');
  streak = ok ? streak + 1 : 0;
  setCat(ok ? 'win' : 'rage');
  if (ok) heart(btn);
  const cb = document.getElementById('combo'); if (cb) cb.textContent = streak >= 2 ? '♥×' + streak : '';
  const slot = app.querySelector('.slot'); if (slot) { slot.textContent = right; slot.style.color = ok ? 'var(--ok)' : 'var(--ng)'; }
  const w = q.w;
  const why = q.type === 'compare' ? q.c.why : (w.note || '');
  const line = (B.lines.by_word || {})[w.id] || pick(ok ? B.lines.correct : B.lines.wrong);
  say(line);
  document.getElementById('rv').innerHTML = `<div class="reveal ${ok ? 'ok' : 'ng'}">
      <span class="lbl">${ok ? '맞았다' : '틀렸다'}</span> · ${esc(LANG[w.lang].ko)} <b>${esc(w.text)}</b> <span class="tr">${trHtml(w)}</span>
      ${why ? `<div style="margin-top:4px">${esc(why)}</div>` : ''}
      ${q.type !== 'compare' ? `<div style="margin-top:4px;color:var(--muted)"><span class="ipa" style="color:var(--cyan)">[${esc(w.target === 'β' ? 'β̞' : w.target)}]</span> ${esc(SYM[w.target].name)}</div>` : ''}
      ${ok ? '' : `<div style="margin-top:6px"><b>따라 하기:</b> 정답 칸(<span class="ipa">${esc(right)}</span>)을 눌러야 넘어간다고양.</div>`}
    </div><div class="tap" id="tp">${ok ? '화면을 누르거나 Enter로 다음' : ''}</div>`;
  if (hasAudio(w.audio)) play(w.audio, document.getElementById('wv'));
  if (!ok) {
    copyNeed = right;
    const tgt = [...app.querySelectorAll(sel)].find(b => (b.dataset.k || b.dataset.o) === right);
    if (tgt) { tgt.classList.add('need'); }
    app.querySelectorAll(sel).forEach(b => b.onclick = () => { if ((b.dataset.k || b.dataset.o) === copyNeed) copied(b); });
    return;
  }
  settle(why + line);
}
function typedCopy(e) {
  const q = Q[qi];
  if (q.type !== 'blank') { if (/^[1-9]$/.test(e.key)) { const b = app.querySelectorAll('.opt')[+e.key - 1]; if (b && b.dataset.o === copyNeed) copied(b); } return; }
  if (e.key === 'Enter') { if (B.shortcuts[typed] === copyNeed) copied(app.querySelector(`.key[data-k="${CSS.escape(copyNeed)}"]`)); typed = ''; return; }
  typed += e.key;
}
function copied(b) {
  copyNeed = null; if (b) { b.classList.remove('need'); b.classList.add('right'); }
  document.getElementById('tp').textContent = '화면을 누르거나 Enter로 다음';
  settle('');
}
function settle(text) {
  lock = true;
  const ms = Math.min(15000, 2000 + 110 * [...String(text)].length);
  timer = setTimeout(next, ms);
  setTimeout(() => { document.addEventListener('click', tapNext, {once: true}); }, 300);
}
function tapNext(e) { if (e.target.closest('.play')) { document.addEventListener('click', tapNext, {once: true}); return; } next(); }
function next() { if (!lock) return; lock = false; clearTimeout(timer); document.removeEventListener('click', tapNext); qi++; question(); }

function result() {
  stopAudio();
  const ok = res.filter(r => r.ok).length, tot = res.length, perfect = ok === tot;
  const st = load(); const prev = st.b01 || {};
  st.b01 = {done: true, best: Math.max(prev.best || 0, ok), total: tot, at: new Date().toISOString().slice(0, 10)};
  save(st);
  const wrong = res.filter(r => !r.ok);
  app.innerHTML = `
    <header class="appbar"><h1><b>발음고양</b> · 묶음 1</h1></header>
    ${catRow(perfect ? 'win' : 'normal', perfect ? (B.lines.perfect || B.lines.end) : B.lines.end)}
    <section class="panel"><div class="phead"><div style="flex:1;min-width:0"><h2>묶음 1 끝: ${ok}/${tot}</h2>${perfect ? '<div class="perfect">PERFECT</div>' : ''}</div></div>
      <div class="svgbox mapbox">${mapSvg(['p', 'b'])}</div>
      <p class="note">입술(1) 칸의 파열음에 불이 들어왔다. [pʰ]·[p͈]는 표에 따로 칸이 없고, [p]에 부호를 붙여 적는다.</p></section>
    ${wrong.length ? `<section class="panel"><div class="phead"><h3>틀린 것</h3></div><div class="exlist">${wrong.map(r => `<div class="ex"><span class="lang">${esc(LANG[r.q.w.lang].ko)}</span><span><span class="word">${esc(r.q.w.text)}</span> <span class="tr">${trHtml(r.q.w)}</span></span><span class="lang">${esc(TYPE_KO[r.q.type])} · <span class="ipa">${esc(r.v)}</span></span></div>`).join('')}</div></section>` : ''}
    <button class="btn" id="again">다시 ▶</button><button class="btn sub" id="hm">처음으로</button>`;
  document.getElementById('again').onclick = startQuiz;
  document.getElementById('hm').onclick = home;
  window.scrollTo(0, 0);
}

function credits() {
  stopAudio();
  const files = D.audioCredits;
  app.innerHTML = `
    <header class="appbar"><button class="iconbtn" id="hm" aria-label="처음으로">‹</button><h1><b>발음고양</b> · 출처·라이선스</h1></header>
    <section class="panel"><div class="phead"><h3>녹음</h3></div><div class="crbox">
      <table class="cr">${files.map(f => `<tr><td>${esc(f.id)}</td><td><a href="${esc(f.page)}" target="_blank" rel="noopener">${esc(f.commons_file)}</a><br>${esc(f.author)} · ${esc(f.license)}${f.mp3 ? '' : ' · <b>아직 못 받음</b>'}</td></tr>`).join('')}</table>
      <p class="note" style="padding:8px 0 0">Wikimedia Commons, 파일마다 라이선스를 확인했다. 게임에는 형식만 mp3로 바꿔 넣었다(자르거나 다듬지 않음). ${esc(D.audioPlan || '')}</p></div></section>
    <section class="panel"><div class="phead"><h3>자료</h3></div><div class="crbox"><table class="cr">${D.refs.map(r => `<tr><td>${esc(r.cite)}${r.doi ? ` <a href="https://doi.org/${esc(r.doi)}" target="_blank" rel="noopener">doi</a>` : ''}</td></tr>`).join('')}</table>
      <p class="note" style="padding:8px 0 0">PHOIBLE 대조 결과(sources/phoible-b01.json)는 CC BY-SA 3.0을 따른다.</p></div></section>
    <section class="panel"><div class="phead"><h3>그림과 글꼴</h3></div>
      <p class="note">고양고양이 픽셀 그림은 보카고양에서 가져왔다. 입 옆모습·목청·소리 시작 띠는 이 게임이 그린 모식도이고 실제 비율이 아니다. IPA 글꼴 Balum IPA는 Charis SIL 7.000(SIL Global)에서 글자를 줄이고 이름을 바꾼 것이다(SIL Open Font License 1.1).</p></section>`;
  document.getElementById('hm').onclick = home;
  window.scrollTo(0, 0);
}
home();
</script>
